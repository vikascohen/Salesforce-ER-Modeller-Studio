<template>
<div class="mcp-settings">
    <header class="mcp-heading"><h2>Salesforce Hosted MCP · ER Modeller</h2><p>Configure the MCP tools exposed by ER Modeller Studio.</p></header>
    <div class="mcp-content">
        <p>Salesforce hosts the MCP endpoint. ER Modeller contributes Apex actions only; no standalone server is deployed.</p>
        <section class="mcp-panel" aria-label="MCP configuration status">
            <h3 class="slds-text-heading_small">Configuration boundaries</h3>
            <p class="slds-m-top_x-small"><strong>ER Modeller tools:</strong> Apex actions are installed with V4; enable switches below control whether they can execute.</p>
            <p class="slds-m-top_x-small"><strong>Hosted server:</strong> Create, register tools and activate in Salesforce Setup. Server activation is not checked by this screen.</p>
            <p class="slds-m-top_x-small"><strong>External client:</strong> Configure OAuth and verify tool discovery and invocation separately. Connection is not checked by this screen.</p>
            <p class="slds-m-top_small">For the full administrator walkthrough, open <strong>Help → Configuration → MCP Server Configuration</strong>. The Tooling API Named Credential used for snapshot collection is a separate connection.</p>
        </section>
        <template if:true={message}><p class="slds-m-vertical_small" role="status">{message}</p></template>
        <template if:true={ready}>
            <section class="mcp-panel"><h3 class="slds-text-heading_small">Tool execution controls</h3>
            <p>These switches are enforced by ER Modeller Apex actions. They do not add or remove tools from Salesforce Hosted MCP registration.</p>
            <div class="mcp-tool-row"><span class="mcp-tool-label">Get Snapshot Status</span><lightning-input type="toggle" variant="label-hidden" label="Get Snapshot Status" name="Status_Enabled__c" checked={settings.Status_Enabled__c} onchange={handleToggle}></lightning-input></div>
            <div class="mcp-tool-row"><span class="mcp-tool-label">Get Field Usage</span><lightning-input type="toggle" variant="label-hidden" label="Get Field Usage" name="Usage_Enabled__c" checked={settings.Usage_Enabled__c} onchange={handleToggle}></lightning-input></div>
            <div class="mcp-tool-row"><span class="mcp-tool-label">Get Changed Fields</span><lightning-input type="toggle" variant="label-hidden" label="Get Changed Fields" name="Changed_Enabled__c" checked={settings.Changed_Enabled__c} onchange={handleToggle}></lightning-input></div>
            <div class="mcp-tool-row"><span class="mcp-tool-label">Run Scan (operator permission required)</span><lightning-input type="toggle" variant="label-hidden" label="Run Scan (operator permission required)" name="Scan_Enabled__c" checked={settings.Scan_Enabled__c} onchange={handleToggle}></lightning-input></div>
            <div class="mcp-scan-guard"><h3 class="slds-text-heading_small slds-m-top_medium">MCP scan cooldown</h3><label class="mcp-scan-label" for="mcp-cooldown">Minimum time between completed scans and the next MCP-triggered scan (hours)</label><p class="mcp-scan-help">Enter 0 to disable the waiting period for testing, or 24 to allow one MCP scan per day after the latest completed scan. Manual scans also reset this timer.</p><input id="mcp-cooldown" class="mcp-cooldown-input" type="number" min="0" max="8760" step="1" name="Cooldown_Hours__c" value={settings.Cooldown_Hours__c} onchange={handleNumber}/></div>
            <div class="mcp-actions"><lightning-button label="Save settings" variant="brand" onclick={save} disabled={busy}></lightning-button></div>
            </section>
        </template>
        <section class="mcp-panel" aria-label="Recent MCP invocations">
            <h3 class="slds-text-heading_small">Last 5 MCP calls</h3>
            <p>Shows the five most recent MCP invocations when diagnostic logging is enabled.</p>
            <lightning-button label="Refresh calls" onclick={refreshLogs} disabled={busy}></lightning-button>
            <template if:true={hasRecentCalls}>
                <ul class="slds-m-top_small">
                    <template for:each={recentCalls} for:item="entry">
                        <li key={entry.key} class="slds-p-vertical_x-small slds-border_bottom">
                            <lightning-formatted-date-time value={entry.occurredAt} year="numeric" month="short" day="2-digit" hour="2-digit" minute="2-digit"></lightning-formatted-date-time>
                            <p class="slds-text-body_small slds-wrap">{entry.message}</p>
                        </li>
                    </template>
                </ul>
            </template>
            <template if:false={hasRecentCalls}>
                <template if:true={logConfigured}><p>No recent MCP calls in the configured diagnostic object.</p></template>
                <template if:false={logConfigured}><p class="mcp-logging-warning"><strong>MCP call history is not enabled.</strong> No accessible diagnostic log object is configured, so calls cannot be recorded or displayed here. Open <strong>Settings → Error Log Configuration</strong>, select an existing Salesforce logging object, configure its message field and enable logging. Then make a new MCP call and refresh this section. Previous calls cannot be recovered.</p></template>
            </template>
        </section>
        <p class="slds-m-top_medium">MCP invocation diagnostics use the existing Studio diagnostic configuration. Configure an existing Salesforce logging object under Settings → Error Log Configuration to opt in to persistence. No separate MCP log object or retention scheduler is installed.</p>
    </div>
</div>
</template>
