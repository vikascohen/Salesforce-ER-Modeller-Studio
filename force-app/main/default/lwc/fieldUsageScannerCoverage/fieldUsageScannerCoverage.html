<template>
    <section class="coverage-card">
        <header>
            <div><span class="eyebrow">SCANNER COVERAGE</span><h3>Field Usage Discovery Pipeline</h3><p>Every supported source feeds the persisted Field Usage dependency snapshot.</p></div>
            <strong class="summary">{coverageSummary}</strong>
        </header>
        <div class="pipeline">
            <div class="sources">
                <template for:each={scanners} for:item="scanner">
                    <article class={scanner.cssClass} key={scanner.name}>
                        <span class="group">{scanner.group}</span>
                        <strong>{scanner.name}</strong>
                        <span class="status">{scanner.status}</span>
                        <template if:true={scanner.count}><small>{scanner.count} evidence records</small></template>
                        <template if:true={scanner.detail}><small>{scanner.detail}</small></template>
                    </article>
                </template>
            </div>
            <div class="flow"><span>7 discovery sources</span><b>→</b></div>
            <div class="snapshot"><span>DEPENDENCY SNAPSHOT</span><strong>Field Usage Intelligence</strong><small>Persisted evidence for the dedicated Field Usage map</small><b>↓</b><em>Field Usage Map</em></div>
        </div>
    </section>
</template>
