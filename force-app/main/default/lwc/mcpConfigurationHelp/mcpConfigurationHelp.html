<article class="help-doc">
    <h2>MCP Server Configuration</h2>
    <p class="help-lead">ER Modeller V4 exposes stored Field Usage intelligence to authorised AI agents and integrations through <strong>Salesforce Hosted MCP</strong>. Salesforce hosts the MCP server; ER Modeller provides the Apex actions. No standalone MCP server is installed.</p>
    <div class="help-warning"><strong>Before you begin</strong><span>This requires Salesforce administrator access, Hosted MCP availability in your org and an authorised integration user. Deploy the V4 package metadata first. An Apex deployment passing tests does not prove that a Hosted MCP endpoint is active.</span></div>
    <section><h3>1. Confirm prerequisites</h3><p>Check that ER Modeller V4 and its MCP Apex actions, settings and permission sets are installed. Ensure Field Usage has produced a successful snapshot if you want to query real dependency evidence. Start with the read-only Snapshot Status tool; it can also report when no snapshot is available.</p><p>The existing <code>Salesforce_Tooling_API</code> Named Credential is for collecting metadata into ER Modeller snapshots. It is <strong>not</strong> the external MCP client's authentication credential.</p></section>
    <section><h3>2. Grant ER Modeller permissions</h3><p>Assign <code>Diagram_Studio_User</code> to trusted users. It includes MCP reading, settings administration and scan execution permissions; do not assign it to users who should have read-only MCP access. Review underlying object/field access and the Salesforce Hosted MCP tool permissions for the integration identity.</p></section>
    <section><h3>3. Create the custom Hosted MCP server</h3><p>Open <strong>Salesforce Setup</strong> and search for <strong>Salesforce MCP Servers</strong>. Create a <strong>custom</strong> server named, for example, <strong>ER Modeller Intelligence</strong>. Salesforce Setup labels and availability can vary by release. Follow the official custom server guide for your org.</p><p>Do not add Salesforce standard record, schema or data-dictionary tools; this server is specifically for ER Modeller dependency intelligence.</p></section>
    <section><h3>4. Register the four Apex actions</h3><p>Add these deployed <strong>Apex Invocable Actions</strong> as tools in the custom server:</p><div class="help-values"><span><b>ER Modeller Get Snapshot Status</b> <span>Read stored snapshot and running scan state</span></span><span><b>ER Modeller Get Field Usage</b> <span>Read field dependency evidence with cursor pagination</span></span><span><b>ER Modeller Get Changed Fields</b> <span>Compare recent successful snapshot dependencies</span></span><span><b>ER Modeller Run Scan</b> <span>Queue an authorised scan subject to cooldown and active-run checks</span></span></div><p>Save and activate the server. Copy the actual endpoint URL displayed by Salesforce; do not guess an endpoint URL.</p></section>
    <section><h3>5. Configure an external MCP client</h3><p>For each external caller (such as an AI agent, MuleSoft or an MCP-capable testing client), configure a Salesforce <strong>External Client App</strong> with the supported OAuth flow and <code>mcp_api</code> scope. Authorise the intended Salesforce user and grant the necessary MCP/tool access. Follow Salesforce's current authentication documentation. Never paste client secrets, access tokens or refresh tokens into ER Modeller settings or support tickets.</p><p>The external client app is separate from the Tooling API connection used internally by Field Usage.</p></section>
    <section><h3>6. Configure ER Modeller's MCP settings</h3><p>In the Studio open <strong>Settings → MCP Server</strong>. Enable only the tools you want exposed, configure the Run Scan cooldown and log retention, and review the invocation log. The Studio switches are enforced by the Apex tools; disabling a tool here does not automatically remove it from Salesforce's server registration.</p><p>This settings screen does not create, activate or discover a Hosted MCP server automatically.</p></section>
    <section><h3>7. Prove the connection end to end</h3><p>Connect an authorised MCP client to the endpoint copied from Salesforce. First request tool discovery (<code>tools/list</code>) and verify the ER Modeller action appears. Then invoke <strong>Get Snapshot Status</strong> (<code>tools/call</code>) and compare its returned snapshot details with the Studio. Test Field Usage, Changed Fields and finally Run Scan with appropriate permissions.</p><p>Verify disabled-tool responses, permission denials, scan cooldown and active-scan conflicts. Check <strong>Settings → MCP Server</strong> logs. A successful Apex test or deployment alone is not sufficient.</p></section>
    <section><h3>Troubleshooting</h3><div class="help-troubleshoot"><strong>Salesforce MCP Servers is missing</strong><span>Check Hosted MCP feature availability, edition, release and your Setup permissions.</span></div><div class="help-troubleshoot"><strong>Apex action is not listed</strong><span>Confirm the V4 action is deployed, global and invocable; check tool eligibility and user access.</span></div><div class="help-troubleshoot"><strong>401 or OAuth scope error</strong><span>Verify the External Client App, authorised user, token audience and <code>mcp_api</code> scope. Do not reuse the internal Tooling API credential.</span></div><div class="help-troubleshoot"><strong>Tool appears but fails</strong><span>Check the Studio tool enable switch, integration user's permissions, current snapshot state and MCP invocation log.</span></div><div class="help-troubleshoot"><strong>No field dependencies returned</strong><span>Confirm a successful Field Usage snapshot exists and the requested field is within scanner coverage. No detected references does not prove a field is safe to modify.</span></div></section>
    <div class="help-warning"><strong>Security and data boundary</strong><span>Use authorised clients and least-privilege access. ER Modeller exposes only its own snapshot intelligence through these tools, not a general Salesforce data API. Studio diagnostics capture ER Modeller errors only.</span></div>
    <p>Official Salesforce guide: <a href="https://developer.salesforce.com/docs/platform/hosted-mcp-servers/guide/custom-servers.html" target="_blank" rel="noopener noreferrer">Custom Hosted MCP Servers</a>.</p>
</article>
