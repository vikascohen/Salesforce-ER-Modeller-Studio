<article class="help-doc help-manual">
<h2>User Manual</h2>
<p class="help-lead">This manual assumes no previous knowledge of ER modelling or ER Modeller Studio. Follow the steps literally the first time. Every advanced result is evidence to investigate, not an automatic instruction to change Salesforce.</p>
<div class="help-manual-search-wrap"><input class="help-manual-search" type="search" placeholder="Search the manual: e.g. Field Usage, drag, hotspot, export..." value={searchText} oninput={handleSearch}/><button class="arch-action-btn" onclick={clearSearch}>Clear</button></div>
<div class="help-warning"><strong>New user?</strong><span>Read Start here, Files, Import Salesforce objects, Drag objects, and Relationships first. Then move to Data Dictionary and Architecture Intelligence.</span></div><section class="help-manual-section" data-search="beginner start screen toolbar explorer canvas DSL tabs"><h3>1. Start here: what you are looking at</h3><p>The Studio has five areas you will use repeatedly: the top menu bar, the file tabs, the Explorer on the left, the DSL editor, and the diagram canvas. If you are new, begin with a blank diagram and ignore the advanced architecture features until you can create, save and reopen a model.</p><p><strong>How to use it:</strong> Click <strong>File → New</strong> or the <strong>+</strong> beside Saved Diagrams. Give the diagram a name in the name box at the top. The Explorer lists saved diagrams and Salesforce objects. The canvas is the large modelling area. The DSL editor is the text representation of the same model. Changes to the model are reflected between the visual model and DSL.</p></section><section class="help-manual-section" data-search="file new save tabs rename delete explorer saved diagrams ctrl s"><h3>2. Files, tabs, saving and reopening</h3><p>Use <strong>File → New</strong> to start a model and <strong>File → Save</strong> or Ctrl+S to save it. Open a saved diagram by clicking its name under <strong>Saved Diagrams</strong>. Several diagrams can stay open as tabs. An asterisk on a tab means there are unsaved changes. The <strong>x</strong> closes a tab; it does not mean delete the saved diagram.</p><p><strong>How to use it:</strong> The diagram-name box names the active model. The Explorer <strong>+</strong> creates another diagram. Use the file row controls/context actions for file operations. Save before closing a tab when you want the latest edits retained.</p></section><section class="help-manual-section" data-search="import schema org object api names account contact case"><h3>3. Import Salesforce objects from the org</h3><p>Open <strong>Import from Org</strong> in the Explorer. Type object API names separated by commas, for example <code>Account, Contact, Case</code>, then click <strong>Import Schema</strong>. The Studio describes those accessible Salesforce objects and creates model content from their fields and relationships.</p><p><strong>How to use it:</strong> Use API names, not friendly labels. A custom object normally looks like <code>Project__c</code>. If an object cannot be described, check the spelling and the running user's Salesforce access.</p></section><section class="help-manual-section" data-search="drag canvas palette search objects explorer"><h3>4. Drag objects to the canvas</h3><p>Under <strong>Drag to Canvas</strong>, use <strong>Search objects</strong> to find an object. Press and hold the object chip, drag it into the large canvas, then release it where you want the object box to appear. Drag object boxes again to rearrange them.</p><p><strong>How to use it:</strong> Dragging changes presentation/layout; it does not create a Salesforce object. Use this when you want to build a focused diagram from existing org objects.</p></section><section class="help-manual-section" data-search="DSL editor entity fields relationship lookup master detail polymorphic syntax intellisense"><h3>5. DSL editor: reading and editing the model</h3><p>The DSL is a compact text version of the diagram. An <code>entity</code> line defines an object and its fields. Relationship lines connect a child field to a parent object. The editor provides suggestions while you type and can be maximised, wrapped, imported or exported.</p><p><strong>How to use it:</strong> Use <strong>&lt;/&gt;</strong> to show or hide the editor. <strong>Import</strong> loads a DSL file; <strong>Export</strong> saves the text model. <strong>Clear</strong> clears the model, so use it deliberately. Lookup, Master Detail and Polymorphic relationships have distinct relationship semantics in the model.</p></section><section class="help-manual-section" data-search="relationship connector lookup master detail polymorphic arrow child parent"><h3>6. Relationships and connector meaning</h3><p>A relationship says that one object's field points to another object. The child side owns the relationship field; the parent side is the referenced object. The Studio distinguishes Lookup, Master Detail and Polymorphic relationships and draws connectors so you can follow the structure.</p><p><strong>How to use it:</strong> When reading a connector, first identify the child object and relationship field, then follow it to the referenced object. A structural connector tells you the relationship exists; it does not by itself prove runtime usage, business criticality or change impact.</p></section><section class="help-manual-section" data-search="mimic new er custom objects fields generate model hypothetical"><h3>7. Mimic New ER: design without creating metadata</h3><p>Choose <strong>Diagram → Mimic New ER</strong> when you want to sketch a proposed custom data model without creating anything in Salesforce. Enter a model name, click <strong>+ Add Object</strong>, type the base object name, add fields, and choose field types. For Lookup, Master Detail or Polymorphic fields, select the target object.</p><p><strong>How to use it:</strong> Enter base custom names such as <code>Project</code> or <code>Status</code>; Mimic applies <code>__c</code>. Click <strong>Generate Model</strong> when finished. The result becomes normal Studio DSL and a normal diagram. Mimic is a modeller, not a Salesforce metadata deployment tool.</p></section><section class="help-manual-section" data-search="zoom fit model canvas navigation"><h3>8. Fit Model and diagram navigation</h3><p>Use <strong>Fit Model</strong> on the canvas when you want the complete model fitted into the visible workspace. You can still drag objects and use the zoom controls afterwards to move between an overview and detail.</p><p><strong>How to use it:</strong> Fit Model changes the canvas view, not the underlying Salesforce relationships or model content.</p></section><section class="help-manual-section" data-search="compare org schema drift missing new fields recheck"><h3>9. Compare with Org / schema drift</h3><p>Choose <strong>Diagram → Compare with Org</strong>. The Studio freshly describes objects represented by the current model and compares their field lists with the diagram. <strong>In the org but not on this diagram</strong> means Salesforce returned a field that your diagram does not contain. <strong>On this diagram but not in the org</strong> means the current describe did not return that field.</p><p><strong>How to use it:</strong> Review before clicking Add or Remove. A field can appear missing because the running user cannot see it, not only because somebody deleted it. Use <strong>Re-check</strong> after investigating or changing the model.</p></section><section class="help-manual-section" data-search="sharing view internal external sharing rules apex sharing evidence"><h3>10. Sharing View</h3><p>Choose <strong>View → Sharing View</strong> to add sharing information to objects on the current diagram. Use it to discuss data-model structure together with object sharing posture. Hover/object summaries can show internal and external sharing information when that data has been loaded.</p><p><strong>How to use it:</strong> Treat sharing information as evidence about the displayed object, not as a complete security audit. Permissions, sharing rules, Apex-managed sharing and other security mechanisms need to be interpreted in context.</p></section><section class="help-manual-section" data-search="heatmap records volume counts data size"><h3>11. Record-count Heatmap</h3><p>Choose <strong>View → Heatmap</strong> to load record-count information and visually compare relative data volume across objects on the diagram. This answers a different question from relationships: it helps show where data volume is concentrated.</p><p><strong>How to use it:</strong> Use the heatmap when a structurally important object may also be large. Record counts are a point-in-time signal and can change as org data changes.</p></section><section class="help-manual-section" data-search="hover summary records sharing fields card"><h3>12. Object hover summary</h3><p>Hover over an object to see its summary card. The card combines information already available to the Studio, such as field count and, when the relevant views have loaded it, record and sharing information.</p><p><strong>How to use it:</strong> If the card tells you to turn on Heatmap or Sharing View, that means the information has not been loaded for the current view. The summary is a shortcut; use the dedicated workspace when you need deeper evidence.</p></section><section class="help-manual-section" data-search="data dictionary fields metadata search filter usage export excel"><h3>13. Data Dictionary: object and field reference</h3><p>Choose <strong>View → Data Dictionary</strong>. The left side is the object list. Search for an object and click it. The field area then shows metadata for that object. Use field search/filter controls to narrow a large object. Select a field when you want its detailed metadata/intelligence.</p><p><strong>How to use it:</strong> Think of the Data Dictionary as documentation of the schema rather than an ER drawing. <strong>Export All to Excel</strong> exports bulk dictionary information. Live percentage-used calculation, where available, is intentionally a per-object operation rather than an automatic whole-org scan.</p></section><section class="help-manual-section" data-search="dictionary percentage used records populated field usage"><h3>14. Data Dictionary field usage percentage</h3><p>Field usage percentage in the Data Dictionary is about how populated a field is in records; it is not the same thing as dependency usage in Apex, Flow or formulas. Start the supported calculation for the selected object and wait for it to complete before interpreting the percentages.</p><p><strong>How to use it:</strong> A low populated percentage does not automatically mean a field can be deleted. Dependency evidence, business meaning, integrations, reporting and historical requirements are separate questions.</p></section><section class="help-manual-section" data-search="field usage scan batch snapshot tooling api apex flow formula processing console"><h3>15. Run Field Usage Scan</h3><p>Choose <strong>Diagram → Run Field Usage Scan</strong>. The Studio first checks the Tooling API connection. A successful launch starts background Batch Apex. The activity window shows the live Salesforce batch state and processed batch counts. You can close the window; the Salesforce job continues.</p><p><strong>How to use it:</strong> When you reopen the activity screen, the Studio queries Salesforce again and attaches to the active Field Usage Batch Apex job. While a batch is active, starting another scan and cleaning the console are not available. If configuration fails, use <strong>Help → Configuration</strong> rather than repeatedly launching.</p></section><section class="help-manual-section" data-search="field usage coverage formula apex class trigger flow active dependency snapshot"><h3>16. What the Field Usage scan actually covers</h3><p>The snapshot gathers supported dependency evidence from formula fields and Tooling API sources including Apex classes, Apex triggers and active Flows. Work is processed asynchronously and the successful snapshot becomes the evidence source used by Field Usage views.</p><p><strong>How to use it:</strong> A scanner can only report evidence within its implemented coverage. <strong>0 dependencies</strong> therefore means no dependency was detected by this scanner in the successful snapshot; it is not a universal proof that the field is unused everywhere.</p></section><section class="help-manual-section" data-search="field usage map object field search build map dependency evidence source type component"><h3>17. Field Usage Map: step by step</h3><p>After a successful scan choose <strong>View → Field Usage Map</strong>. In the left <strong>Objects</strong> column, search and click an object. The middle <strong>Fields</strong> column then fills with that object's fields. Search there and click one or more fields. Click <strong>Build Map</strong>. The right panel draws the dependency map.</p><p><strong>How to use it:</strong> Read from left to right: selected object → selected field → evidence/source type → component. A source-type node can be clicked to load more detailed evidence. <strong>No dependency detected</strong> means the current successful snapshot contains no detected evidence for that selected field.</p></section><section class="help-manual-section" data-search="field change impact architecture selected field evidence source search"><h3>18. Field Change Impact</h3><p>Open <strong>Architecture Intelligence</strong> and choose the Field Change Impact capability. Select the object and field you are considering changing. Use its search/source controls to inspect persisted Field Usage evidence and identify components that deserve review before a change.</p><p><strong>How to use it:</strong> This is investigation support, not an automatic safe/unsafe decision. The map tells you where evidence was found so an architect or developer can inspect those dependencies.</p></section><section class="help-manual-section" data-search="architecture intelligence overview metrics topology complexity insight"><h3>19. Architecture Intelligence: what it is</h3><p>Choose <strong>View → Architecture Intelligence</strong>. This workspace analyses the current ER model and organises structural evidence into focused sections. It is designed to help you ask architecture questions such as: What is central? What is isolated? How are domains connected? What could sit in the structural neighbourhood of a change?</p><p><strong>How to use it:</strong> Architecture Intelligence analyses the model/evidence available to it. Its metrics and flags are signals for investigation, not design verdicts. Use them to find where to look next.</p></section><section class="help-manual-section" data-search="architecture overview summary metrics objects relationships components cycles hotspots isolated"><h3>20. Architecture Overview and summary</h3><p>The Overview summarises the model so you can orient yourself before drilling down. Depending on the current model, it can surface counts and structural signals such as objects, relationships, connected areas, cycles, hotspots or isolated objects.</p><p><strong>How to use it:</strong> Use Overview first on an unfamiliar model. A high count or highlighted structure is descriptive evidence. Ask why it exists before deciding whether it is good or bad.</p></section><section class="help-manual-section" data-search="topology complexity hotspot isolated connected components graph"><h3>21. Topology, complexity, hotspots and isolated objects</h3><p>Topology describes how objects are connected as a graph. A <strong>hotspot</strong> is an object with comparatively significant structural connectivity in the analysed model. An <strong>isolated object</strong> has no structural connection in that model. Connected components are groups that can reach one another through relationships.</p><p><strong>How to use it:</strong> Hotspot does not mean defective. Isolated does not mean useless. These terms describe graph structure and help you prioritise investigation.</p></section><section class="help-manual-section" data-search="cycle circular relationships architecture graph"><h3>22. Cycles and bounded cycles</h3><p>A cycle exists when relationships form a route that eventually returns to an earlier object. The cycle view helps you see these structural loops without manually tracing every connector.</p><p><strong>How to use it:</strong> A cycle is not automatically an error. Use the evidence to understand coupling, ownership and navigation patterns, especially before structural changes.</p></section><section class="help-manual-section" data-search="path finder source target objects route connected"><h3>23. Relationship Path Finder</h3><p>In Architecture Intelligence open <strong>Relationship Path Finder</strong>. Choose the starting object and destination object, then run the path search. The result shows a relationship route through the current model when one can be found.</p><p><strong>How to use it:</strong> Use it when two objects appear unrelated on a large diagram and you need to know how they are structurally connected. The path is a schema route, not proof that a transaction traverses that exact route at runtime.</p></section><section class="help-manual-section" data-search="object map impact blast radius dependencies neighbourhood external"><h3>24. Object Map and Impact / blast radius</h3><p>Choose an object in <strong>Object Map & Impact</strong>. The view builds its structural neighbourhood and impact evidence from the relationships represented by the model and supported external dependency information.</p><p><strong>How to use it:</strong> <strong>Blast radius</strong> here means the surrounding structural area that deserves investigation if the selected object changes. It is deliberately evidence, not a promise that every neighbour will break.</p></section><section class="help-manual-section" data-search="object usage change readiness references relationship evidence external dependencies"><h3>25. Object Usage and Change Readiness</h3><p>Select an object to inspect how it participates in relationships and, where available, additional cached org-schema references. Use the result as a checklist for change investigation.</p><p><strong>How to use it:</strong> <strong>Change Readiness</strong> should be read as organised evidence that helps prepare a change. It does not replace testing, deployment analysis, security review or knowledge of business processes.</p></section><section class="help-manual-section" data-search="relationship insights direction repeated external target type"><h3>26. Relationship Insights</h3><p>Relationship Insights groups and explains structural relationship evidence: direction, relationship type, repeated relationships and external targets where supported. Use it when the raw ER diagram contains too many connectors to reason about comfortably.</p><p><strong>How to use it:</strong> Repeated or external relationships can be architecturally important because they show concentration or boundaries. They still require human interpretation.</p></section><section class="help-manual-section" data-search="junction many to many object master detail lookup"><h3>27. Junction intelligence</h3><p>Junction intelligence looks for structures that behave like junction objects, which are commonly used to represent many-to-many relationships. Open this section when you want the Studio to call those patterns out rather than finding them manually.</p><p><strong>How to use it:</strong> Inspect the relationships around the identified object to understand why it was classified as junction-like. Treat the result as modelling evidence, especially in unconventional schemas.</p></section><section class="help-manual-section" data-search="show summary hide summary architecture controls buttons insight section"><h3>28. Show Summary and Architecture controls</h3><p><strong>Show Summary</strong> controls whether the architecture summary information is visible in the relevant architecture view. Use it when you want explanatory/context information alongside the diagram; hide it when you need more room for the visual analysis. Section buttons switch the current Architecture Intelligence analysis without changing your ER model.</p><p><strong>How to use it:</strong> These controls change what you are viewing, not the underlying Salesforce schema. If a section has no useful result, check that the current ER model contains the objects/relationships needed for that analysis.</p></section><section class="help-manual-section" data-search="export png mermaid drawio pdf image download files"><h3>29. Export diagram, Mermaid and draw.io</h3><p>Choose <strong>File → Export</strong>. For the diagram image choose the page size and use <strong>Export and Download</strong>. The Studio can also generate Mermaid text and draw.io XML. <strong>Copy Mermaid</strong> puts Mermaid source on the clipboard; <strong>Download .mmd</strong> saves it. <strong>Copy draw.io XML</strong> or <strong>Download .drawio</strong> produces an editable diagrams.net representation.</p><p><strong>How to use it:</strong> Exports are representations of the current model. Check the exported result before treating it as formal documentation, especially after changing layout or model content.</p></section><section class="help-manual-section" data-search="settings schedule automatic scan cron jobs pause resume delete"><h3>30. Field Usage schedules</h3><p>Choose <strong>Settings → Open Settings</strong>. Under <strong>Schedule Configuration</strong>, click <strong>+ Add Schedule</strong>, give it a name, choose hour/minute, enable it and save. Under <strong>Scheduled Jobs</strong>, inspect Studio-owned jobs and use the available Pause, Resume or Delete actions.</p><p><strong>How to use it:</strong> A scheduled scan still needs the Salesforce security and Tooling API configuration described in <strong>Help → Configuration</strong>. Scheduling does not bypass Named Credential or principal access.</p></section><section class="help-manual-section" data-search="theme dark light monokai solarized navigation back diagram workspace"><h3>31. Themes, full-screen workspaces and Back to Diagram</h3><p>Theme is now an application setting rather than a diagram-toolbar control. Open <strong>Settings → Theme</strong>. Choose Dark+, Light+, Monokai or Solarized Light. The selection previews immediately so you can inspect the diagram, Settings and other workspaces. Click <strong>Save Theme</strong> when you want that choice restored on later visits. Dark+ is the default when no preference has been saved.</p><p>Help, Settings, Mimic, Architecture Intelligence and other large features use dedicated workspaces because squeezing them into the diagram canvas would make them difficult to operate. <strong>Back to Diagram</strong> returns to the active modelling session; it does not create a new model or intentionally discard the current one. Theme changes presentation only and do not change Salesforce metadata, diagram DSL or architecture calculations.</p></section><section class="help-manual-section" data-search="reference evidence meaning zero dependency snapshot architecture signal limitations"><h3>32. How to interpret evidence safely</h3><p>Whenever the Studio says <strong>evidence</strong>, <strong>dependency</strong>, <strong>impact</strong>, <strong>hotspot</strong>, <strong>cycle</strong> or <strong>readiness</strong>, read it in the scope of the current model and the data/scanner coverage that produced it. The Studio is designed to make architecture knowledge visible, not to make an irreversible change decision for you.</p><p><strong>How to use it:</strong> Before deleting or changing Salesforce metadata, combine Studio evidence with source review, tests, integrations, reports, security, business ownership and your organisation's normal change process.</p></section><section class="help-manual-section" data-search="troubleshoot error not working configuration named credential refresh save"><h3>33. Troubleshooting: where to start</h3><p>If Field Usage reports credential/authentication errors, go to <strong>Help → Configuration</strong>. If an org object does not appear, check API name and Salesforce access. If Compare with Org reports a missing field unexpectedly, check field visibility. If a view looks stale, re-run the feature's refresh/re-check operation or rebuild the relevant map.</p><p><strong>How to use it:</strong> Do not repeatedly click a failing action. Read the displayed error first. For Field Usage, verify the Named Credential, authenticated principal and permission-set principal access before retrying.</p></section>
<section class="help-manual-section" data-search="settings system information version api namespace environment organisation support"><h3>34. Settings → System Information</h3><p><strong>Purpose:</strong> System Information is the identity card for the running Studio installation. Open <strong>Settings</strong>, then choose <strong>System Information</strong> under SYSTEM. This page is read-only. Merely opening it does not run a Field Usage scan and does not make a Tooling API request.</p><p>The Application area shows the ER Modeller Studio version, default application theme and namespace state. The Salesforce Integration area shows the Tooling API version used by Field Usage, the Salesforce API baseline, environment, Organisation ID and running user. These values are useful when comparing two environments or reporting a problem because they identify exactly where and with which integration baseline the Studio is running.</p><p><strong>Refresh:</strong> click Refresh after an environment or user change. A version such as <code>v60.0</code> describes the API contract used by this Studio build; it is not a statement about every API version available in your Salesforce org.</p></section>
<section class="help-manual-section" data-search="diagnostics health application ready self test run diagnostics configuration required attention"><h3>35. Settings → Diagnostics: application self-test</h3><p>Diagnostics answers a simple operational question: <strong>is this installation in a good state to work?</strong> Open <strong>Settings → Diagnostics</strong> and click <strong>Run Diagnostics</strong>. The Studio opens a dedicated full-screen health-check workspace and shows the processing stages rather than leaving you staring at an inactive button.</p><p>The self-test checks Studio runtime, required Field Usage data access, the latest snapshot state, active Field Usage Batch Apex work, scheduler configuration and the authenticated Tooling API connection. It never launches a Field Usage scan. The Tooling API connection check deliberately performs one lightweight authenticated preflight because configuration cannot be proven merely by looking at a Named Credential name.</p><p>The overall result is <strong>Application Ready</strong>, <strong>Attention Required</strong> or <strong>Configuration Required</strong>. Application Ready means the required checks passed at the time of the test. Attention Required means something deserves review but the diagnostic engine did not classify it as a blocking configuration failure. Configuration Required means at least one required check failed and the failed row should be resolved before relying on all Studio functions.</p></section>
<section class="help-manual-section" data-search="diagnostic passed failed attention information remediation what to do troubleshooting"><h3>36. Reading individual diagnostic results</h3><p>Every diagnostic row contains a check name, state and explanation. <strong>Passed</strong> means the test actually succeeded. <strong>Information</strong> records useful state that is not itself an error, such as no Field Usage snapshot existing yet. <strong>Attention</strong> identifies a condition worth investigating. <strong>Failed</strong> identifies a condition that prevented a required test from succeeding.</p><p>When a failed check has a known recovery path, the row contains <strong>What to do</strong>. Follow that remediation before rerunning diagnostics. For Tooling API failures the manual points you to <strong>Help → Configuration</strong>, because OAuth, Named Credential authentication and External Credential Principal Access are Salesforce Setup concerns rather than something the Studio should silently modify.</p><p>Diagnostics are a point-in-time health check. A successful test does not guarantee that a later Salesforce permission, credential, metadata or platform change cannot alter the state. Use <strong>Run Again</strong> after configuration changes.</p></section>
<section class="help-manual-section" data-search="named credential tooling api diagnostic oauth principal security secrets callout"><h3>37. What the Tooling API diagnostic proves</h3><p>The Tooling API diagnostic uses the same logical connection expected by Field Usage: <code>Salesforce_Tooling_API</code>. A successful result proves that the running context can resolve the Named Credential and complete the small authenticated Tooling API request used by the preflight. This is more meaningful than displaying a green icon merely because configuration metadata exists.</p><p>A failure can mean the Named Credential is missing or inaccessible, the External Credential is not authenticated, principal access is absent, OAuth configuration is invalid, or Salesforce rejected the callout. Diagnostics never display the Consumer Secret, access token, refresh token or other credential material. Do not paste those secrets into support reports or documentation.</p></section>
<section class="help-manual-section" data-search="field usage scan lifecycle discovery tooling work unit snapshot finalizer batch stages"><h3>38. Field Usage scan lifecycle in plain English</h3><p>A Field Usage scan is a background pipeline, not one synchronous button click. The first discovery stage prepares scan work from Salesforce schema information. Tooling discovery then finds supported source components such as Apex classes, Apex triggers and active Flows. Work-unit processing analyses queued work and stores dependency evidence. Formula evidence is also included through the Field Usage scanning pipeline. Finalisation promotes a successful snapshot for later maps and impact analysis.</p><p>Because Batch Apex is asynchronous, you can close the activity screen and return later. Reopening the Field Usage console asks Salesforce for current state and attaches to the active Field Usage job when one exists. The browser is a viewer of the server-side process; closing the browser does not cancel Salesforce Batch Apex.</p></section>
<section class="help-manual-section" data-search="field usage activity console processing batches launch clean console reopen progress"><h3>39. Field Usage Activity console</h3><p>Choose <strong>Diagram → Run Field Usage Scan</strong> to open the activity experience. If a Field Usage job is already active, the Studio should show that running state instead of presenting a second launch action. The console can show the current Batch Apex status and processed/total batch counts obtained from Salesforce runtime state.</p><p><strong>Launch Batch Now</strong> is intended only when no Field Usage batch is active. <strong>Clean Console</strong> is not an operation for changing Salesforce job state; it only concerns displayed console history and is unavailable while processing. Do not interpret closing or cleaning the console as aborting a server-side job.</p></section>
<section class="help-manual-section" data-search="field usage map objects fields dependency map build map select multiple search evidence"><h3>40. Field Usage Map: complete walkthrough</h3><p>The Field Usage Map uses a three-pane layout. The left pane is <strong>Objects</strong>, the middle pane is <strong>Fields</strong>, and the right pane is the dependency map. Search above Objects when the org contains too many objects to scan visually. Click an object to populate the Fields pane. Search the Fields pane to narrow the list, then select the field or fields you want to investigate.</p><p>Click <strong>Build Map</strong> after making the selection. The resulting graph is based on evidence stored by the current successful Field Usage snapshot. A node or relationship on this map is evidence discovered by the supported scanners; absence of a node is not a universal proof that no dependency exists anywhere in Salesforce or in external systems.</p><p>Use zoom controls for navigation rather than changing the model itself. When several fields are selected, keep the question narrow enough that the graph remains understandable. If you are preparing a change, use the map as the start of investigation and then inspect the underlying component/source evidence.</p></section>
<section class="help-manual-section" data-search="field change impact blast radius dependency impact field evidence source component"><h3>41. Field Change Impact: before changing a field</h3><p>Field Change Impact asks what the current Field Usage snapshot knows about a particular field. Select an object and field, then inspect the returned evidence and connected components. Use this before renaming, changing type, restricting values or considering deletion of an established field.</p><p><strong>Blast radius</strong> means the set of things the available evidence indicates may be affected. It is not a guarantee that every connected component will break, and it is not permission to change a field when no evidence is shown. External integrations, dynamically constructed references, reports or unsupported metadata can require separate investigation.</p></section>
<section class="help-manual-section" data-search="data dictionary object fields usage percentage calculate usage filter export excel"><h3>42. Data Dictionary: object and field investigation</h3><p>Open <strong>Data Dictionary</strong> when you need a structured description rather than a topology diagram. Select an object to load its field information. Use object search to find the object quickly and field search/filter controls to narrow large field sets. The dictionary is especially useful during discovery workshops, documentation work and change analysis.</p><p>Field Usage percentages or usage-related indicators should be read in the context in which they were calculated. They are not a universal business-value score. A low percentage does not automatically make a field safe to remove. Export functions are useful for sharing the dictionary with people who do not use the Studio, but exported information is a snapshot and can become stale after Salesforce changes.</p></section>
<section class="help-manual-section" data-search="architecture intelligence overview topology complexity hotspot isolated connected component cycle meaning"><h3>43. Architecture Intelligence: how to read the overview</h3><p>Architecture Intelligence analyses the model currently loaded into the Studio. Start with the overview before drilling into individual objects. <strong>Connected components</strong> identify groups linked by relationships. <strong>Isolated objects</strong> have no relationship path to the rest of the loaded model. <strong>Cycles</strong> identify relationship paths that return to an earlier object. <strong>Hotspots</strong> identify structurally prominent areas according to the Studio's model analysis.</p><p>These are architecture signals, not grades. A hotspot can be completely legitimate. A cycle can be intentional. An isolated object may simply be outside the bounded context represented by the current diagram. Always ask whether the loaded model is complete enough for the question you are trying to answer.</p></section>
<section class="help-manual-section" data-search="object map impact object usage change readiness external dependencies drill down"><h3>44. Object Map, Impact and Change Readiness</h3><p>Select an object in the relevant Architecture Intelligence workspace to inspect its neighbourhood and structural reach. Object Map &amp; Impact helps you see what is immediately connected and what can be reached through relationship paths. Change Readiness combines architecture signals into an investigation aid so that structurally sensitive objects are easier to notice before design work begins.</p><p>Do not treat readiness as an automated approval or rejection. The Studio cannot know every business deadline, data owner, external contract, regulatory constraint or runtime behaviour. Use the result to decide where more evidence is required, not to replace architecture governance.</p></section>
<section class="help-manual-section" data-search="relationship path finder source target shortest path relationship insights junction object"><h3>45. Relationship Path Finder and Relationship Insights</h3><p>Path Finder answers <em>how are these two objects connected in this model?</em> Choose a source object and a target object, then run the path search. The returned path is useful when designing navigation, integration payloads, queries or explaining a model to another person.</p><p>Relationship Insights focuses on the nature and concentration of relationships. Junction intelligence helps identify many-to-many modelling patterns represented through an intermediate object. A detected junction pattern is a structural observation; confirm the intended business semantics before documenting an object as a formal junction object.</p></section>
<section class="help-manual-section" data-search="sharing view heatmap record count owd sharing rules apex sharing runtime evidence"><h3>46. Sharing View and Heatmap</h3><p><strong>Sharing View</strong> overlays sharing-related information onto the model where the Studio has retrieved it. Use it to make security architecture discussions easier, but do not treat the visualisation as a replacement for a complete Salesforce security review. Object permissions, field permissions, role hierarchy, groups, sharing rules, manual sharing and Apex-managed behaviour can interact.</p><p><strong>Heatmap</strong> adds record-volume context to modelled objects. It is useful for spotting where large data volumes may influence design or migration conversations. Record count is not the same as performance cost, business importance or growth rate. The object hover summary can combine information already fetched by these views without creating a new scanner of its own.</p></section>
<section class="help-manual-section" data-search="dsl syntax entity field lookup master detail polymorphic intellisense compile parser editor"><h3>47. DSL editor: working safely with the textual model</h3><p>The DSL is the textual representation of the ER model. An entity declaration defines an object and its fields; relationship-capable field types describe how objects connect. IntelliSense suggestions help reduce typing and API-name mistakes. The visual canvas and DSL are two views of the same modelling intent, so editing text can rebuild visual geometry and visual operations can update the textual model.</p><p>When editing manually, make small changes and watch for parser or validation feedback. A syntax error can prevent the Studio from understanding the intended model. Save only after confirming the canvas represents what you meant. The DSL describes the Studio model; it does not by itself deploy Salesforce metadata.</p></section>
<section class="help-manual-section" data-search="mimic new er hypothetical custom object field lookup master detail generate"><h3>48. Mimic New ER: design without changing Salesforce</h3><p>Mimic New ER is the point-and-click modeller for hypothetical custom data models. Add an object, add fields, choose field types and select relationship targets. Mimic automatically applies the custom API suffix rules described on the screen. Relationship fields target the Salesforce Id of another mimicked object.</p><p>Click <strong>Generate Model</strong> when the form represents your idea. The Studio converts the form into its ER DSL and opens the result on the normal canvas. This is modelling only: Mimic does not create custom objects, fields or relationships in the Salesforce org.</p></section>
<section class="help-manual-section" data-search="export png pdf mermaid drawio excel files architecture report documentation"><h3>49. Exporting and sharing Studio results</h3><p>Use export when you need a durable artefact outside the interactive workspace. Diagram export supports image-oriented output and interchange/documentation formats such as Mermaid and draw.io where offered. Architecture reporting can produce architecture-oriented exports from the current analysis. Data Dictionary export is intended for tabular documentation.</p><p>Before sharing an export, confirm that the active model and snapshot are the ones you intended to document. An exported architecture picture does not automatically update when the Salesforce org changes. Treat exports as dated evidence and regenerate them after material model changes.</p></section>
<section class="help-manual-section" data-search="settings schedule automatic field usage hour minute enabled scheduled jobs pause resume delete"><h3>50. Settings → Field Usage schedules</h3><p>Open <strong>Settings → Schedule Settings</strong>. In <strong>Schedule Configuration</strong>, add only the automatic scans your organisation actually wants. Give each schedule a recognisable name, choose hour and minute, decide whether it is enabled, then click <strong>Save Changes</strong>. Studio does not need hidden default schedules.</p><p>Open the <strong>Scheduled Jobs</strong> tab to inspect Studio-owned Field Usage scheduled jobs. Refresh to read current job information. Pause when you want to retain a schedule definition without allowing it to run, Resume to reactivate it, and Delete only when the schedule is no longer required. Scheduling controls future scans; they do not retroactively alter an existing snapshot.</p></section>
<section class="help-manual-section" data-search="settings theme dark light monokai solarized save theme default black"><h3>51. Settings → Theme</h3><p>Open <strong>Settings → Theme</strong>. Dark+ is the default black theme for users who have no saved preference. Selecting another theme previews it immediately across the Studio. Click <strong>Save Theme</strong> to persist the choice. If saving fails, the preview can still remain for the current session, so read the Settings message rather than assuming the preference was stored.</p><p>The theme changes visual presentation only. It does not alter diagrams, Salesforce data, metadata, Field Usage evidence or architecture results.</p></section>
<section class="help-manual-section" data-search="workflow beginner first day tutorial create import save dictionary architecture field usage"><h3>52. First-day workflow for a new user</h3><p>If you have never used the Studio, use this sequence: create a new diagram; import two or three familiar Salesforce objects; drag/reposition them; inspect their fields and relationships; save the diagram; close and reopen it; open Data Dictionary; then open Architecture Intelligence. Only after those basics make sense should you move into Field Usage evidence and change-impact investigation.</p><p>This sequence deliberately separates <strong>modelling</strong> from <strong>org-wide evidence collection</strong>. You can learn the canvas without running Field Usage. When you are ready for Field Usage, ask an administrator to complete Help → Configuration, run Settings → Diagnostics, and only then launch the first scan.</p></section>
<section class="help-manual-section" data-search="architect workflow change investigation before change dependency path dictionary evidence governance"><h3>53. Suggested workflow for change investigation</h3><p>Start with the object or field being changed. Use Data Dictionary to understand its definition. Use the ER model and Architecture Intelligence to understand structural context. Use Field Usage Map or Field Change Impact for persisted dependency evidence. Use Path Finder when the question involves connectivity between objects. Export evidence when it needs to accompany an architecture or change record.</p><p>Then leave the Studio where appropriate: inspect source code, integration contracts, reports, permissions, tests and business ownership. The strongest use of the Studio is to reduce architectural blind spots before change, not to claim that one visualisation contains every fact about an enterprise Salesforce estate.</p></section>
<section class="help-manual-section" data-search="glossary object field relationship lookup master detail polymorphic dependency evidence snapshot hotspot cycle blast radius"><h3>54. Plain-English glossary</h3><p><strong>Object:</strong> a Salesforce data structure such as Account or a custom object. <strong>Field:</strong> one piece of data on an object. <strong>Relationship:</strong> a field/structure connecting records or objects. <strong>Lookup:</strong> a relationship where the referenced record is generally independent. <strong>Master-Detail:</strong> a stronger parent-child relationship with Salesforce platform semantics. <strong>Polymorphic:</strong> a relationship that can refer to more than one object type.</p><p><strong>Dependency evidence:</strong> a stored observation that a supported component references a field. <strong>Snapshot:</strong> the promoted result of a Field Usage scan at a point in time. <strong>Hotspot:</strong> a structurally prominent area identified by architecture analysis. <strong>Cycle:</strong> a relationship path that loops back. <strong>Blast radius:</strong> the area the available evidence suggests may be touched by a change. <strong>Connected component:</strong> a group of objects connected to one another within the loaded model.</p></section>
<section class="help-manual-section" data-search="limitations dynamic apex external integration reports unsupported metadata false negative no dependency"><h3>55. Important limitations and responsible interpretation</h3><p>No static architecture tool can prove the absence of every runtime or external dependency. Dynamic Apex, constructed strings, middleware, external applications, reports, analytics, unsupported metadata and human processes can sit outside a particular scanner's evidence. Therefore <strong>No dependency detected</strong> means no dependency was detected within the evidence and coverage available to that feature; it must not be rewritten mentally as <em>this field is safe to delete</em>.</p><p>Similarly, architecture metrics describe the loaded model, not an objective score of whether the organisation's architecture is good or bad. Use the Studio to ask better questions, find evidence faster and document what you know. Keep normal peer review, testing, security review and change governance.</p></section>
<section class="help-manual-section" data-search="support diagnostic report troubleshooting reproduce version system information configuration"><h3>56. Before raising a support issue</h3><p>First reproduce the problem once and capture the exact user-visible error. Open <strong>Settings → System Information</strong> and note Studio version, API baseline, environment and namespace state. Then run <strong>Settings → Diagnostics</strong>. If a check fails, follow its remediation and rerun it.</p><p>For Field Usage authentication issues, compare the failure with <strong>Help → Configuration</strong>. Never include OAuth secrets or tokens in a support message. For a visual/model issue, record which diagram was open, which workspace/control you used and whether the issue survives a refresh/reopen. This information is far more useful than saying only that the application is not working.</p></section></article></template>
