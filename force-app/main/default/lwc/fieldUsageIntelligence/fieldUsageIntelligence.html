<template><lightning-card title="Field Usage Intelligence" icon-name="standard:relationship">
<div class="slds-p-around_medium">
<template if:true={message}><div class="notice slds-m-bottom_medium">{message}</div></template>
<div class="toolbar slds-grid slds-wrap slds-gutters_small">
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"><lightning-combobox label="Object" value={selectedObject} options={objectOptions} onchange={handleObject}></lightning-combobox></div>
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"><lightning-dual-listbox label="Fields" source-label="Available" selected-label="Selected" options={fieldOptions} value={selectedFields} onchange={handleFields}></lightning-dual-listbox></div>
<div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 actions"><lightning-button variant="brand" label="Analyse Selected Fields" onclick={loadEvidence} disabled={disableAnalyse}></lightning-button><lightning-button class="slds-m-left_small" label="Run Scan Now" onclick={runNow} disabled={running}></lightning-button></div>
</div>
<template if:true={running}><lightning-spinner alternative-text="Field usage scan running"></lightning-spinner><p class="slds-m-top_medium">A field usage snapshot is currently being built. Existing results remain available until the new snapshot is promoted.</p></template>
<template if:true={groups.length}><div class="tree slds-m-top_large"><template for:each={groups} for:item="group"><section key={group.key} class="node"><h3>{group.field}</h3><template for:each={group.items} for:item="item"><div key={item.key} class="leaf"><strong>{item.source}</strong> → {item.component}<div class="muted">{item.type} · {item.confidence}</div></div></template></section></template></div></template>
<div class="slds-m-top_large"><h3 class="slds-text-heading_small">Automatic scan schedule</h3><p class="muted">Admins can configure any number of daily scan times. No CRON knowledge is required.</p><template for:each={schedules} for:item="row"><div key={row.Id} class="schedule">{row.Name}: {row.Hour__c}:{row.minuteDisplay} <template if:false={row.Enabled__c}>(disabled)</template></div></template></div>
</div></lightning-card></template>
