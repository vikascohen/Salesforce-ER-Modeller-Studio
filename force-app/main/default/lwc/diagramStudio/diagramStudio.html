<template>
<div class={rootClass}>

    <!-- CONTEXT MENU -->
    <template if:true={ctxMenu}>
        <div class="ctx-menu" style={ctxMenuStyle}>
            <div class="ctx-item" onclick={handleCtxOpen}>Open</div>
            <div class="ctx-item" onclick={handleCtxDuplicate}>Duplicate</div>
            <div class="ctx-divider"></div>
            <div class="ctx-item ctx-danger" onclick={handleCtxDelete}>Delete</div>
        </div>
    </template>

    <!-- OBJECT SUMMARY HOVER CARD -->
    <template if:true={hoverCard}>
        <div class="hover-card" style={hoverCard.style}>
            <div class="hover-card-title">{hoverCard.name}</div>
            <div class="hover-card-sub">{hoverCard.objectTypeText} &middot; {hoverCard.fieldCount} fields</div>
            <div class="hover-card-divider"></div>

            <div class="hover-card-row">
                <span class="hover-card-label">Records</span>
                <template if:true={hoverCard.hasRecordData}>
                    <span class="hover-card-value">{hoverCard.recordCountText}</span>
                </template>
                <template if:false={hoverCard.hasRecordData}>
                    <span class="hover-card-hint">Turn on Heatmap to see this</span>
                </template>
            </div>
            <template if:true={hoverCard.recordFreshnessText}>
                <div class="hover-card-row">
                    <span class="hover-card-label"></span>
                    <span class="hover-card-freshness">{hoverCard.recordFreshnessText}</span>
                </div>
            </template>

            <div class="hover-card-row">
                <span class="hover-card-label">Internal Sharing</span>
                <template if:true={hoverCard.hasSharingData}>
                    <span class="hover-card-value">{hoverCard.internalSharingText}</span>
                </template>
                <template if:false={hoverCard.hasSharingData}>
                    <span class="hover-card-hint">Turn on Sharing View to see this</span>
                </template>
            </div>
            <template if:true={hoverCard.hasSharingData}>
                <div class="hover-card-row">
                    <span class="hover-card-label">External Sharing</span>
                    <span class="hover-card-value">{hoverCard.externalSharingText}</span>
                </div>
                <template if:true={hoverCard.hasSharingSignalData}>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Sharing Rules</span>
                        <span class="hover-card-value">{hoverCard.sharingRuleText}</span>
                    </div>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Apex Sharing</span>
                        <span class="hover-card-value">{hoverCard.apexSharingText}</span>
                    </div>
                </template>
                <template if:false={hoverCard.hasSharingSignalData}>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Sharing Rules / Apex Sharing</span>
                        <span class="hover-card-hint">No sharing data for this object</span>
                    </div>
                </template>
            </template>
        </div>
    </template>

    <!-- EXPORT MODAL -->
    <template if:true={exportModalOpen}>
        <div class="modal-backdrop" onclick={handleCloseExport}>
            <div class="modal-box" onclick={stopProp}>
                <div class="modal-header">
                    <span class="modal-title">Export Diagram</span>
                    <button class="modal-close" onclick={handleCloseExport}>x</button>
                </div>
                <div class="modal-body">
                    <div class="export-field">
                        <label class="export-label" for="exportPageSize">Page Size</label>
                        <select id="exportPageSize" class="export-select" onchange={handleExportSizeChange}>
                            <template for:each={exportSizeOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                    <p class="hint-text slds-m-top_small">The PNG will be saved to Salesforce Files and downloaded to your browser.</p>
                    <div class="export-divider"></div>
                    <div class="export-field">
                        <label class="export-label">Mermaid ER Diagram</label>
                        <p class="hint-text">Paste this straight into a GitHub README, Confluence, or Notion page — it renders as a live diagram, no image needed.</p>
                        <div class="export-mermaid-actions">
                            <lightning-button label="Copy Mermaid" variant="neutral" onclick={handleCopyMermaid}></lightning-button>
                            <lightning-button label="Download .mmd" variant="neutral" onclick={handleDownloadMermaid}></lightning-button>
                        </div>
                    </div>
                    <div class="export-divider"></div>
                    <div class="export-field">
                        <label class="export-label">draw.io Diagram</label>
                        <p class="hint-text">Opens directly in draw.io / diagrams.net (File → Open, or drag the .drawio file in) — laid out exactly like your canvas, fully editable there.</p>
                        <div class="export-mermaid-actions">
                            <lightning-button label="Copy draw.io XML" variant="neutral" onclick={handleCopyDrawio}></lightning-button>
                            <lightning-button label="Download .drawio" variant="neutral" onclick={handleDownloadDrawio}></lightning-button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <lightning-button label="Cancel" variant="neutral" onclick={handleCloseExport}></lightning-button>
                    <lightning-button label="Export and Download" variant="brand" disabled={exportModalSaveDisabled} onclick={handleDoExport}></lightning-button>
                </div>
            </div>
        </div>
    </template>

    <!-- SCHEMA DRIFT MODAL -->
    <template if:true={driftModalOpen}>
        <div class="modal-backdrop" onclick={handleCloseDriftModal}>
            <div class="modal-box modal-box-wide" onclick={stopProp}>
                <div class="modal-header">
                    <span class="modal-title">Compare with Org Schema</span>
                    <button class="modal-close" onclick={handleCloseDriftModal}>x</button>
                </div>
                <div class="modal-body">
                    <template if:true={driftBusy}>
                        <p class="hint-text">Re-checking against the org's current schema…</p>
                    </template>
                    <template if:true={driftNoIssues}>
                        <p class="hint-text">Everything matches — for every entity on this canvas that maps to a real object, the diagram's field list and the org's current schema are identical. (Entities with no matching object in the org are skipped, since there's nothing to compare them against.)</p>
                    </template>
                    <template for:each={driftResults} for:item="r">
                        <div key={r.entityName} class="drift-entity-block">
                            <div class="drift-entity-head">
                                <span>{r.entityName}</span>
                            </div>
                            <template if:true={r.newFields.length}>
                                <div class="drift-section">
                                    <div class="drift-section-head">
                                        <span class="drift-section-label drift-new">+ In the org but not on this diagram ({r.newFields.length})</span>
                                        <button class="dsl-head-btn" data-entity={r.entityName} onclick={handleAddAllDriftFields}>Add all</button>
                                    </div>
                                    <p class="drift-new-hint">These exist on the object in the org but aren't in your diagram — either added since you built it, or just never included. Add any you want shown.</p>
                                    <template for:each={r.newFields} for:item="f">
                                        <div key={f.id} class="drift-row">
                                            <span class="drift-field-name">{f.name}</span>
                                            <button class="rel-suggest-add" data-entity={r.entityName} data-field={f.name} onclick={handleAddDriftField}>+ Add</button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:true={r.missingFields.length}>
                                <div class="drift-section drift-section-warn">
                                    <div class="drift-section-head">
                                        <span class="drift-section-label drift-missing">⚠ On this diagram but not in the org ({r.missingFields.length})</span>
                                    </div>
                                    <p class="drift-missing-hint">Your diagram lists these, but they didn't come back from the org — usually renamed or deleted. Note they'd also show up here if your profile simply can't see them (field-level security), so check before removing.</p>
                                    <template for:each={r.missingFields} for:item="f">
                                        <div key={f.id} class="drift-row">
                                            <span class="drift-field-name drift-field-stale">{f.name}</span>
                                            <button class="drift-remove-btn" data-entity={r.entityName} data-field={f.name} onclick={handleRemoveDriftField}>Remove</button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <lightning-button label="Close" variant="neutral" onclick={handleCloseDriftModal}></lightning-button>
                    <lightning-button label="Re-check" variant="brand" disabled={driftBusy} onclick={handleOpenDriftCheck}></lightning-button>
                </div>
            </div>
        </div>
    </template>

    <!-- TOP MENU BAR -->
    <div class="menu-bar">
        <span class="app-logo">ER</span>
        <span class="app-name">Diagram Studio</span>
        <div class="menu-spacer"></div>
        <span class={statusClass}>{statusLabel}</span>
        <template if:true={currentId}>
            <button class="menu-btn" onclick={handleCopyId} title="Copy record Id">Copy Id</button>
        </template>
    </div>

    <!-- ACTION TOOLBAR -->
    <div class="toolbar">
        <button class="tb-icon-btn" onclick={handleToggleSidebar} title="Toggle file explorer">|||</button>
        <button class="tb-icon-btn" onclick={handleToggleDslPanel} title="Toggle DSL editor">&lt;/&gt;</button>
        <div class="tb-sep"></div>

        <!-- FILE MENU -->
        <div class="dd-menu-wrap">
            <button class={fileMenuClass} data-menu="file" onclick={handleToggleMenu}>File <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={fileMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuNew}>+ New</div>
                    <div class="dd-menu-item" onclick={handleMenuSave}>Save <span class="dd-menu-shortcut">Ctrl+S</span></div>
                    <div class="dd-menu-divider"></div>
                    <div class="dd-menu-item" onclick={handleMenuImport}>Import from Org</div>
                    <div class="dd-menu-item" onclick={handleMenuExport}>Export...</div>
                </div>
            </template>
        </div>

        <!-- DIAGRAM MENU -->
        <div class="dd-menu-wrap">
            <button class={diagramMenuClass} data-menu="diagram" onclick={handleToggleMenu}>Diagram <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={diagramMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuAutoLayout}>Auto Layout</div>
                    <div class="dd-menu-item" onclick={handleMenuCompareOrg}>Compare with Org</div>
                    <div class="dd-menu-divider"></div>
                    <div class="dd-menu-item dd-menu-item-danger" onclick={handleMenuClearCanvas}>Clear Canvas</div>
                </div>
            </template>
        </div>

        <!-- VIEW MENU -->
        <div class="dd-menu-wrap">
            <button class={viewMenuClass} data-menu="view" onclick={handleToggleMenu}>View <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={viewMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuSharingView}>{sharingViewMenuText}</div>
                    <div class="dd-menu-item" onclick={handleMenuHeatmap}>{heatmapMenuText}</div>
                    <div class="dd-menu-item" onclick={handleMenuDataDictionary}>{dictionaryMenuText}</div>
                    <div class="dd-menu-divider"></div>
                    <div class="dd-menu-item" onclick={handleMenuArchitecture}>{architectureMenuText}</div>
                </div>
            </template>
        </div>

        <select class="theme-select" onchange={handleThemeChange} title="Color theme">
            <option value="theme-dark-plus" selected={isThemeDarkPlus}>Dark+</option>
            <option value="theme-light-plus" selected={isThemeLightPlus}>Light+</option>
            <option value="theme-monokai" selected={isThemeMonokai}>Monokai</option>
            <option value="theme-solarized-light" selected={isThemeSolarizedLight}>Solarized Light</option>
        </select>

        <div class="tb-spacer"></div>
        <input class="diag-name-input" type="text" value={fileName} oninput={handleNameChange} placeholder="Diagram name" />
    </div>

    <!-- TAB BAR -->
    <div class="tab-bar">
        <template for:each={computedTabs} for:item="tab">
            <div key={tab.id}
                 class={tab.tabClass}
                 data-tabid={tab.id}
                 onclick={handleTabClick}
                 title={tab.name}>
                <template if:false={tab.renaming}>
                    <span class="tab-name">{tab.name}</span>
                    <template if:true={tab.dirty}>
                        <span class="tab-dirty">*</span>
                    </template>
                    <button class="tab-close" data-tabid={tab.id} onclick={handleTabClose}>x</button>
                </template>
                <template if:true={tab.renaming}>
                    <input class="tab-rename-input"
                           type="text"
                           value={tab.renameValue}
                           data-tabid={tab.id}
                           onchange={handleTabRenameChange}
                           onkeydown={handleTabRenameCommit}
                           onblur={handleTabRenameBlur} />
                </template>
            </div>
        </template>
        <button class="tab-new-btn" onclick={handleNew}>+</button>
    </div>

    <!-- MAIN BODY -->
    <div class="studio-body">

        <!-- FILE EXPLORER SIDEBAR -->
        <div class={sidebarClass}>
            <div class="sidebar-head">EXPLORER</div>

            <div class="sidebar-section">
                <div class="sidebar-sec-head">
                    <span>SAVED DIAGRAMS</span>
                    <button class="sb-icon-btn" onclick={handleNew}>+</button>
                </div>
                <div class="file-list">
                    <template for:each={files} for:item="f">
                        <div key={f.id}
                             class={f.rowClass}
                             data-id={f.id}
                             onclick={handleOpen}
                             oncontextmenu={handleFileContextMenu}>
                            <span class="file-name">{f.name}</span>
                            <span class="file-date">{f.modified}</span>
                            <button class="file-del-btn" data-id={f.id} onclick={handleDeleteFile}>x</button>
                        </div>
                    </template>
                    <template if:true={noFiles}>
                        <p class="empty-msg">No saved diagrams yet. Click + to create one.</p>
                    </template>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-sec-head" onclick={handleToggleImport}>
                    <span>IMPORT FROM ORG</span>
                </div>
                <template if:true={importPanelOpen}>
                    <div class="import-panel">
                        <textarea class="import-textarea"
                                  placeholder="Account, Contact, Case"
                                  value={importObjectNames}
                                  oninput={handleImportNamesChange}></textarea>
                        <button class="sb-full-btn" onclick={handleImportSchema}>Import Schema</button>
                    </div>
                </template>
            </div>

            <div class="sidebar-section palette-section">
                <div class="sidebar-sec-head">DRAG TO CANVAS</div>
                <input class="palette-search" type="text"
                       placeholder="Search objects"
                       value={paletteFilter}
                       oninput={handlePaletteFilterChange} />
                <div class="palette-chips">
                    <template for:each={filteredPaletteObjects} for:item="obj">
                        <div key={obj} class="palette-chip"
                             draggable="true"
                             data-name={obj}
                             ondragstart={handlePaletteDragStart}>{obj}</div>
                    </template>
                </div>
            </div>

        </div>

        <!-- DSL EDITOR PANEL -->
        <div class={dslPanelClass} style={dslPanelStyle}>
            <div class="dsl-panel-head">
                <span>DSL EDITOR</span>
                <div class="dsl-panel-head-actions">
                    <button class="dsl-head-btn" onclick={handleToggleDslMaximise} title="Maximise or restore the editor without changing the DSL">{dslMaximiseLabel}</button>
                    <button class="dsl-head-btn" onclick={handleImportDslClick} title="Import a .dsl file from your computer and draw it">Import</button>
                    <button class="dsl-head-btn" onclick={handleExportDsl} title="Export this DSL as a .dsl file">Export</button>
                    <button class="dsl-head-btn dsl-head-btn-danger" onclick={handleClearCanvas} title="Clear the DSL editor and the canvas">Clear</button>
                </div>
            </div>
            <input type="file" class="dsl-file-input" accept=".dsl,.txt" onchange={handleImportDslFile} />
            <p class="dsl-hint">Type entity / relationship lines directly — the canvas updates as you type. Suggestions appear at the cursor; use up/down then Enter or Tab to accept, Esc to dismiss.</p>

            <template if:true={missingRelationshipSuggestions.length}>
                <div class="rel-suggest-banner">
                    <div class="rel-suggest-head">
                        <span>💡 Possible relationships found</span>
                        <div class="rel-suggest-head-actions">
                            <button class="dsl-head-btn" onclick={handleAddAllSuggestions}>Add all</button>
                            <button class="dsl-head-btn" onclick={handleDismissSuggestions} title="Dismiss">×</button>
                        </div>
                    </div>
                    <template for:each={missingRelationshipSuggestions} for:item="s">
                        <div key={s.id} class="rel-suggest-row">
                            <span class="rel-suggest-label">{s.label}</span>
                            <button class="rel-suggest-add" data-line={s.line} onclick={handleAddSuggestion}>+ Add</button>
                        </div>
                    </template>
                </div>
            </template>

            <div class="dsl-editor-wrap">
                <textarea class="code-editor"
                          spellcheck="false"
                          wrap="off"
                          placeholder="entity Account : Name, Industry&#10;&#10;Contact.AccountId => Account"
                          value={sourceText}
                          oninput={handleTextChange}
                          onkeydown={handleDslKeyDown}
                          onclick={handleDslClick}
                          onscroll={handleDslScroll}
                          onblur={handleDslBlur}></textarea>
                <template if:true={dslSuggestOpen}>
                    <div class="dsl-suggestions" style={dslSuggestStyle}>
                        <template for:each={computedSuggestions} for:item="s">
                            <div key={s.id}
                                 class={s.rowClass}
                                 data-index={s.idx}
                                 onmousedown={handleSuggestionMouseDown}
                                 onclick={handleSuggestionClick}>
                                <span class="dsl-suggest-label">{s.label}</span>
                                <span class="dsl-suggest-detail">{s.detail}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- DSL PANEL RESIZE HANDLE -->
        <template if:true={dslPanelOpen}>
            <div class="dsl-resize-handle"
                 onpointerdown={handleDslResizePointerDown}
                 onpointermove={handleDslResizePointerMove}
                 onpointerup={handleDslResizePointerUp}></div>
        </template>

        <!-- CANVAS AREA -->
        <div class={canvasOuterClass}>

            <template if:true={errorMessage}>
                <div class="error-bar" role="alert">
                    {errorMessage}
                    <button class="error-dismiss" onclick={clearError}>x</button>
                </div>
            </template>

            <!-- Zoom controls -->
            <div class="zoom-controls">
                <button class="zoom-btn zoom-btn-wide" onclick={handleToggleCanvasMaximise} title="Maximise or restore canvas">{canvasMaximiseLabel}</button>
                <button class="zoom-btn zoom-btn-wide" onclick={handleFitModel} title="Fit the complete model into the visible canvas">Fit Model</button>
                <template lwc:if={showCanvasFitExport}><button class="zoom-btn zoom-btn-wide" onclick={handleOpenExport} title="Export the complete fitted model">Export</button></template>
                <button class="zoom-btn" onclick={handleZoomOut} title="Zoom out">-</button>
                <button class="zoom-btn zoom-btn-label" onclick={handleZoomReset} title="Reset zoom">{zoomPercentLabel}</button>
                <button class="zoom-btn" onclick={handleZoomIn} title="Zoom in">+</button>
            </div>

            <!-- Legend -->
            <div class="legend-overlay">
                <p class="legend-title">Relationships</p>
                <div class="legend-row">
                    <svg width="52" height="14"><line x1="2" y1="7" x2="40" y2="7" stroke="#5c2d91" stroke-width="2.5"></line><polygon points="38,4 50,7 38,10" fill="#5c2d91"></polygon></svg>
                    <span>Master-Detail</span>
                </div>
                <div class="legend-row">
                    <svg width="52" height="14"><line x1="2" y1="7" x2="38" y2="7" stroke="#0070d2" stroke-width="1.75"></line><polyline points="34,4 48,7 34,10" fill="none" stroke="#0070d2" stroke-width="1.75"></polyline></svg>
                    <span>Lookup</span>
                </div>
                <div class="legend-row">
                    <svg width="52" height="14"><line x1="2" y1="7" x2="38" y2="7" stroke="#ea4335" stroke-width="1.75" stroke-dasharray="4,2"></line><polygon points="38,4 50,7 38,10" fill="none" stroke="#ea4335" stroke-width="1.5"></polygon></svg>
                    <span>Polymorphic</span>
                </div>
            </div>

            <!-- Scrollable canvas -->
            <div class="canvas-wrap" ondragover={handleCanvasDragOver} ondrop={handleCanvasDrop}>
              <div class="svg-scale-wrap" style={svgScaleWrapStyle}>
                <svg data-role="er-svg"
                     viewBox={svgViewBox}
                     width={svgWidth}
                     height={svgHeight}
                     style={svgTransformStyle}
                     class="er-svg"
                     xmlns="http://www.w3.org/2000/svg"
                     onpointermove={handleSvgPointerMove}
                     onpointerup={handleSvgPointerUp}>

                    <defs lwc:dom="manual"></defs>

                    <rect x="0" y="0" width={svgWidth} height={svgHeight} fill="#f4f6f9" onclick={handleCanvasBackgroundClick}></rect>

                    <!-- Connectors rendered under boxes -->
                    <template for:each={connectorsView} for:item="c">
                        <g key={c.key} opacity={c.connOpacity} class="conn-group">
                            <path d={c.d} fill="none" stroke="rgba(0,0,0,0)" stroke-width="10"></path>
                            <path d={c.d} fill="none" stroke={c.stroke} stroke-width={c.strokeWidth} stroke-dasharray={c.dashArray} marker-end={c.markerEnd}></path>
                            <text x={c.midX} y={c.midY} text-anchor="middle" font-size="10" class="conn-label" fill={c.stroke}>{c.label}</text>
                            <circle cx={c.cardStartX} cy={c.cardStartY} r="9" fill="#ffffff" stroke={c.stroke} stroke-width="1.5"></circle>
                            <text x={c.cardStartX} y={c.cardStartY} dy="4" text-anchor="middle" font-size="9" font-weight="bold" fill={c.stroke}>{c.cardStartText}</text>
                            <circle cx={c.cardEndX} cy={c.cardEndY} r="9" fill="#ffffff" stroke={c.stroke} stroke-width="1.5"></circle>
                            <text x={c.cardEndX} y={c.cardEndY} dy="4" text-anchor="middle" font-size="9" font-weight="bold" fill={c.stroke}>{c.cardEndText}</text>
                        </g>
                    </template>

                    <!-- Entity boxes -->
                    <template for:each={erBoxes} for:item="b">
                        <g key={b.name}
                           data-name={b.name}
                           opacity={b.boxOpacity}
                           class="entity-group"
                           onmouseenter={handleBoxMouseEnter}
                           onmouseleave={handleBoxMouseLeave}>

                            <!-- Shadow -->
                            <rect x={b.shadowX} y={b.shadowY} width={b.width} height={b.height} rx="7" fill="#c8cdd6"></rect>
                            <!-- Body -->
                            <rect x={b.x} y={b.y} width={b.width} height={b.height} rx="7" fill={b.bodyFill} stroke={b.boxStroke} stroke-width={b.boxStrokeWidth}></rect>
                            <!-- Header drag handle -->
                            <rect data-name={b.name} x={b.x} y={b.y} width={b.width} height="36" rx="6" fill={b.headerFill} class="drag-header" onpointerdown={handleBoxPointerDown}></rect>
                            <!-- Header bottom strip (covers rounded corners gap) -->
                            <rect x={b.x} y={b.headerBodyY} width={b.width} height="10" fill={b.headerFill}></rect>
                            <!-- Entity name -->
                            <text x={b.x} y={b.y} dx="12" dy="24" font-size="13" font-weight="bold" fill="#ffffff">{b.name}</text>
                            <!-- Delete button -->
                            <g data-name={b.name} class="delete-btn" onclick={handleDeleteEntity} transform={b.deleteTransform}>
                                <circle cx="0" cy="0" r="10" fill="#c23934"></circle>
                                <text x="0" y="0" font-size="14" fill="#ffffff" text-anchor="middle" dy="5">x</text>
                            </g>
                            <!-- Badges: heatmap record count, sharing model (internal/external) -->
                            <template for:each={b.badges} for:item="badge">
                                <g key={badge.id} class="entity-badge">
                                    <title>{badge.title}</title>
                                    <circle cx={badge.cx} cy={badge.cy} r="12" fill={badge.fillColor} stroke={badge.strokeColor} stroke-width="2"></circle>
                                    <text x={badge.cx} y={badge.cy} font-size="9" font-weight="bold" fill={badge.textColor} text-anchor="middle" dy="3">{badge.code}</text>
                                </g>
                            </template>
                            <!-- Divider -->
                            <line x1={b.x} y1={b.dividerY} x2={b.xEnd} y2={b.dividerY} stroke="#e4e7ec" stroke-width="1"></line>

                            <!-- Field rows — primary key -->
                            <template for:each={b.pkFields} for:item="fld">
                                <g key={fld.key}>
                                    <text x={b.x} y={fld.rowY} dx="10" font-size="10" fill="#d4a72c">*</text>
                                    <text x={b.x} y={fld.rowY} dx="22" font-size="11" font-weight="600" fill="#101828">{fld.text}</text>
                                    <template if:true={fld.isRequired}>
                                        <text x={b.x} y={fld.rowY} dx={b.reqMarkerDx} font-size="10" font-weight="700" fill="#d92d20">R</text>
                                    </template>
                                </g>
                            </template>
                            <!-- Field rows — relationship fields -->
                            <template for:each={b.relFields} for:item="fld">
                                <g key={fld.key}>
                                    <text x={b.x} y={fld.rowY} dx="10" font-size="10" fill="#7b5ea7">~</text>
                                    <text x={b.x} y={fld.rowY} dx="22" font-size="11" font-style="italic" fill="#667085">{fld.text}</text>
                                    <template if:true={fld.isRequired}>
                                        <text x={b.x} y={fld.rowY} dx={b.reqMarkerDx} font-size="10" font-weight="700" fill="#d92d20">R</text>
                                    </template>
                                </g>
                            </template>
                            <!-- Field rows — plain fields (roll-up summary fields get a Σ marker) -->
                            <template for:each={b.plainFields} for:item="fld">
                                <g key={fld.key}>
                                    <template if:true={fld.isRollupSummary}>
                                        <text x={b.x} y={fld.rowY} dx="10" font-size="10" fill="#0d9488">&#931;</text>
                                    </template>
                                    <text x={b.x} y={fld.rowY} dx="22" font-size="11" fill="#344054">{fld.text}</text>
                                    <template if:true={fld.isRequired}>
                                        <text x={b.x} y={fld.rowY} dx={b.reqMarkerDx} font-size="10" font-weight="700" fill="#d92d20">R</text>
                                    </template>
                                </g>
                            </template>

                            <!-- More fields indicator -->
                            <template if:true={b.hasHidden}>
                                <text data-name={b.name} x={b.x} y={b.moreTextY} dx="12" font-size="10" fill="#98a2b3" class="more-fields-text" onclick={handleShowAllFields}>{b.moreLabel}</text>
                            </template>

                            <!-- Bottom resize handle -->
                            <rect data-name={b.name} data-role="resize"
                                  x={b.x} y={b.resizeY}
                                  width={b.width} height="14"
                                  fill="rgba(0,0,0,0)"
                                  class="resize-handle"
                                  onpointerdown={handleResizePointerDown}
                                  onpointermove={handleResizePointerMove}
                                  onpointerup={handleResizePointerUp}
                                  ondblclick={handleShowAllFields}></rect>
                            <line x1={b.resizeDotX1} y1={b.resizeLineY} x2={b.resizeDotX2} y2={b.resizeLineY}
                                  stroke="#d0d5dd" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"></line>
                            <!-- Right resize handle -->
                            <rect data-name={b.name} data-role="resize-right"
                                  x={b.resizeRightX} y={b.resizeRightY}
                                  width="14" height={b.resizeRightHeight}
                                  fill="rgba(0,0,0,0)"
                                  class="resize-handle-right"
                                  onpointerdown={handleResizeRightPointerDown}
                                  onpointermove={handleResizeRightPointerMove}
                                  onpointerup={handleResizeRightPointerUp}></rect>
                        </g>
                    </template>

                </svg>
              </div>
            </div>
            <template if:true={canvasHasModel}>
                <section class="canvas-summary">
                    <div class="canvas-summary-head">
                        <div><strong>Model Relationship Summary</strong><span>Live explanation of the relationships currently on this canvas.</span></div>
                        <button class="zoom-btn zoom-btn-wide" onclick={handleToggleCanvasSummary}>{canvasSummaryToggleLabel}</button>
                    </div>
                    <template if:true={canvasSummaryVisible}>
                        <div class="canvas-summary-scroll">
                            <template for:each={canvasRelationshipSummary} for:item="item">
                                <div class="canvas-summary-row" key={item.key}>
                                    <span class="canvas-summary-kind">{item.kind}</span>
                                    <strong>{item.child}</strong><span class="canvas-summary-arrow">→</span><strong>{item.parent}</strong>
                                    <span class="canvas-summary-field">{item.field}</span>
                                    <span class="canvas-summary-sentence">{item.sentence}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </section>
            </template>
        </div>

    </div>

    <!-- PHASE 2: DATA ARCHITECTURE INTELLIGENCE -->
    <template if:true={architectureOpen}>
        <div class="arch-panel" style={architecturePanelStyle}>
            <div class="arch-header">
                <div><div class="arch-kicker">PHASE 2 · DATA MODEL ANALYSIS</div><div class="arch-title">Data Architecture Intelligence</div><div class="arch-subtitle">Structural evidence from the ER model currently on the canvas.</div></div>
                <div class="arch-header-actions"><div class="arch-font-controls" title="Adjust Architecture Intelligence text size"><button class="arch-font-btn" onclick={handleArchitectureFontDecrease} disabled={architectureCanDecreaseFont}>A−</button><button class="arch-font-value" onclick={handleArchitectureFontReset} title="Reset text size">{architectureFontPercent}</button><button class="arch-font-btn" onclick={handleArchitectureFontIncrease} disabled={architectureCanIncreaseFont}>A+</button></div><template if:true={architectureHasModel}><button class="arch-action-btn arch-print-btn" onclick={handlePrintArchitectureReport}>Export PDF</button></template><button class="arch-action-btn" onclick={handleCloseArchitecture}>Back to Diagram</button><button class="modal-close arch-close" onclick={handleCloseArchitecture}>x</button></div>
            </div>
            <template if:true={architectureHasError}>
                <div class="arch-error" role="alert">
                    <div><strong>Analysis unavailable</strong><p>{architectureError}</p><span>Your diagram has not been changed. Fix the DSL/model issue and retry.</span></div>
                    <button class="arch-action-btn" onclick={handleRetryArchitecture}>Retry Analysis</button>
                </div>
            </template>
            <template if:true={architectureHasModel}>
                <section class="arch-brief">
                    <div class="arch-brief-label">ARCHITECTURE SUMMARY</div>
                    <p class="arch-brief-text">{architectureExecutiveSummary}</p>
                    <div class="arch-brief-signals">
                        <div><span>Connectivity</span><strong>{architectureConnectivityLabel}</strong></div>
                        <div><span>Maximum reach</span><strong>{architectureAnalysis.maxRelationshipDepth} hops</strong></div>
                        <div><span>Cycles</span><strong>{architectureCycleLabel}</strong></div>
                        <div><span>Isolated objects</span><strong>{architectureIslandLabel}</strong></div>
                        <div><span>Junctions</span><strong>{architectureJunctionLabel}</strong></div>
                        <div><span>Relationship mix</span><strong>{architectureRelationshipSemantics}</strong></div>
                    </div>
                </section>

                <template if:true={architectureReviewLead}>
                    <section class="arch-section arch-review-first">
                        <div class="arch-section-head"><span>Where Should I Look First?</span><span class="arch-section-hint">Evidence-led starting point</span></div>
                        <div class="arch-review-card">
                            <div class="arch-review-rank">1</div>
                            <div class="arch-review-main"><div class="arch-review-title"><strong>{architectureReviewLead.name}</strong><span class="arch-tag">{architectureReviewLead.role}</span></div><p>{architectureReviewLead.reason}</p><div class="arch-evidence">{architectureReviewLead.evidence} · {architectureReviewLead.reach}</div></div>
                            <button class="arch-action-btn" data-name={architectureReviewLead.name} onclick={handleArchitectureFindingInspect}>Inspect Object</button>
                        </div>
                    </section>
                </template>

                <section class="arch-section">
                    <div class="arch-section-head"><span>Architecture Findings</span><span class="arch-section-hint">Finding → evidence → why it matters → next investigation</span></div>
                    <div class="arch-findings">
                        <template for:each={architectureFindings} for:item="f">
                            <article class="arch-finding" key={f.key}>
                                <div class="arch-finding-top"><span class="arch-tag">{f.kind}</span><strong>{f.title}</strong></div>
                                <div class="arch-finding-grid"><div><span>Evidence</span><p>{f.evidence}</p></div><div><span>Why it matters</span><p>{f.impact}</p></div><div><span>Investigate</span><p>{f.action}</p></div></div>
                                <template if:true={f.hasObject}><button class="arch-inline-link" data-name={f.objectName} onclick={handleArchitectureFindingInspect}>Inspect {f.objectName} →</button></template>
                            </article>
                        </template>
                    </div>
                </section>

                <section class="arch-section arch-map-section"><div class="arch-section-head"><span>Architecture Map</span><span class="arch-section-hint">Start here: see the structure before reading the intelligence</span></div><div class="arch-map-explainer"><strong>How to read this</strong><span>Scroll horizontally or vertically to explore the complete model. Lines run from child to parent and arrowheads show relationship direction. Highlighted objects are structurally important. Click an object to inspect it.</span></div><div class="arch-map-viewport"><div class="arch-insight-map" style={architectureInsightMapCanvasStyle}><template for:each={architectureInsightMapEdges} for:item="edge"><i class="arch-map-edge" key={edge.key} style={edge.style} title={edge.title}><b></b></i></template><template for:each={architectureInsightMapNodes} for:item="node"><button key={node.name} class={node.className} style={node.style} data-name={node.name} onclick={handleArchitectureObjectSelect}><strong>{node.name}</strong><span>{node.role}</span><small>{node.degree} relationships · {node.fieldCount} fields</small></button></template></div></div><div class="arch-map-legend"><span>Structural gravity</span><span>Bridge object</span><span>Model object</span></div></section><section class="arch-section arch-deep-intelligence">
                    <div class="arch-section-head"><span>Architecture Intelligence Insights</span><span class="arch-section-hint">Correlated graph patterns, derived without AI</span></div>
                    <div class="arch-deep-grid">
                        <article class="arch-deep-card"><div class="arch-deep-title"><span>STRUCTURAL GRAVITY</span><strong>Where the model concentrates</strong></div><template if:true={architectureHasGravity}><template for:each={architectureGravity} for:item="n"><div class="arch-deep-row" key={n.name}><button class="arch-object-link" data-name={n.name} onclick={handleArchitectureObjectSelect}>{n.name}</button><span>{n.degree} rel. · {n.reachPct}% reach · {n.fieldCount} fields</span></div></template></template></article>
                        <article class="arch-deep-card"><div class="arch-deep-title"><span>BRIDGE OBJECTS</span><strong>Objects joining structural areas</strong></div><template if:true={architectureHasBridges}><template for:each={architectureBridges} for:item="n"><div class="arch-deep-row" key={n.name}><button class="arch-object-link" data-name={n.name} onclick={handleArchitectureObjectSelect}>{n.name}</button><span>{n.detail}</span></div></template></template></article>
                        <article class="arch-deep-card"><div class="arch-deep-title"><span>CHANGE CORRIDORS</span><strong>Long relationship routes worth understanding</strong></div><template if:true={architectureHasCorridors}><template for:each={architectureCorridors} for:item="n"><div class="arch-deep-row arch-corridor-row" key={n.key}><strong>{n.hops} hops</strong><span>{n.path}</span></div></template></template></article>
                        <article class="arch-deep-card"><div class="arch-deep-title"><span>RELATIONSHIP ASYMMETRY</span><strong>Strongly directional dependency patterns</strong></div><template if:true={architectureHasAsymmetry}><template for:each={architectureAsymmetry} for:item="n"><div class="arch-deep-row" key={n.name}><button class="arch-object-link" data-name={n.name} onclick={handleArchitectureObjectSelect}>{n.name}</button><span>{n.direction} concentration · {n.ratio}</span></div></template></template></article>
                        <article class="arch-deep-card"><div class="arch-deep-title"><span>COMPLEXITY CLUSTERS</span><strong>Connected high-connectivity objects</strong></div><template if:true={architectureHasComplexityClusters}><template for:each={architectureComplexityClusters} for:item="n"><div class="arch-deep-row" key={n.key}><strong>{n.objectCount} objects</strong><span>{n.detail}</span></div></template></template></article>
                        <article class="arch-deep-card"><div class="arch-deep-title"><span>BOUNDARY LEAKAGE</span><strong>Cross-domain coupling from your domain assignments</strong></div><template if:true={architectureHasBoundaryLeakage}><template for:each={architectureBoundaryLeakage} for:item="n"><div class="arch-deep-row" key={n.name}><strong>{n.name}</strong><span>{n.crossDomainRelationships} cross-domain rel. · {n.crossPct}% boundary share</span></div></template></template></article>
                    </div>
                    <div class="arch-density-note">These are structural signals, not architecture grades. Each pattern is calculated from the current ER graph and should be interpreted in business context.</div>
                </section>

                <section class="arch-section arch-advice-section">
                    <div class="arch-section-head"><span>Architecture Advice</span><span class="arch-section-hint">Evidence led guidance, not an automated architecture verdict</span></div>
                    <div class="arch-advice-grid">
                        <template for:each={architectureAdvice} for:item="item">
                            <article class="arch-advice-card" key={item.key}>
                                <div class="arch-finding-top"><span class="arch-tag">{item.kind}</span><strong>{item.title}</strong></div>
                                <div class="arch-advice-evidence"><span>Evidence</span><p>{item.evidence}</p></div>
                                <div><span>Why consider it</span><p>{item.reason}</p></div>
                                <div><span>Suggested investigation</span><p>{item.next}</p></div>
                            </article>
                        </template>
                    </div>
                </section>

                <section class="arch-section">
                    <div class="arch-section-head"><span>Model Evidence</span><span class="arch-section-hint">Technical measures supporting the findings</span></div>
                    <div class="arch-summary"><template for:each={architectureSummary} for:item="m"><div class="arch-metric" key={m.label}><span class="arch-metric-value">{m.value}</span><span class="arch-metric-label">{m.label}</span></div></template></div>
                    <div class="arch-topology"><template for:each={architectureTopologySummary} for:item="m"><div class="arch-topology-row" key={m.label}><span>{m.label}</span><strong>{m.value}</strong></div></template></div>
                    <div class="arch-density-note">{architectureDensityHelp}</div>
                </section>

                <section class="arch-section"><div class="arch-section-head"><span>Hotspots &amp; Model Shape</span><span class="arch-section-hint">Explore the evidence behind the summary</span></div>
                    <div class="arch-insights">
                        <div><strong>Structural hubs</strong><p>{architectureHubsText}</p></div>
                        <div><strong>Isolated objects</strong><p>{architectureIslandsText}</p></div>
                        <div><strong>Relationship cycles</strong><p>{architectureCyclesText}</p></div>
                    </div>
                    <div class="arch-ranked-grid"><div><h4>Most connected</h4><template for:each={architectureMostConnected} for:item="n"><div class="arch-rank-row" key={n.name}><button class="arch-object-link" data-name={n.name} onclick={handleArchitectureObjectSelect}>{n.name}</button><strong>{n.degree} rel.</strong></div></template></div><div><h4>Largest definitions</h4><template for:each={architectureLargestObjects} for:item="n"><div class="arch-rank-row" key={n.name}><button class="arch-object-link" data-name={n.name} onclick={handleArchitectureObjectSelect}>{n.name}</button><strong>{n.fieldCount} fields</strong></div></template></div></div>
                </section>
                <section class="arch-section">
                    <div class="arch-section-head"><span>Architecture Domains</span><span class="arch-section-hint">Architect-defined business boundaries</span></div>
                    <p class="arch-domain-help">Assign a domain such as Claim, Provider, Payment or Customer to each object. Assignments are analysis-only in this development build and do not change Salesforce metadata.</p>
                    <div class="arch-domain-assign"><template for:each={architectureDomainRows} for:item="o"><div class="arch-domain-row" key={o.name}><strong>{o.name}</strong><input class="arch-domain-input" data-name={o.name} value={o.domain} placeholder="Domain name" onchange={handleArchitectureDomainChange}/></div></template></div>
                    <div class="arch-domain-unassigned">{architectureUnassignedText}</div>
                    <template if:true={architectureHasDomains}><div class="arch-domain-grid"><template for:each={architectureDomains} for:item="d"><div class="arch-domain-card" key={d.name}><strong>{d.name}</strong><div><span>{d.objectCount} objects</span><span>{d.fieldCount} fields</span><span>{d.internalRelationships} internal rel.</span><span>{d.crossDomainRelationships} cross-domain rel.</span></div></div></template></div></template>
                    <template if:true={architectureHasDomainCouplings}><div class="arch-coupling-list"><h4>Cross-Domain Coupling</h4><template for:each={architectureDomainCouplings} for:item="x"><div class="arch-coupling-row" key={x.domainA}><span>{x.domainA} ↔ {x.domainB}</span><strong>{x.relationshipCount} relationships</strong></div></template></div></template>
                </section>
                <section class="arch-section">
                    <div class="arch-section-head"><span>Relationship Path Finder</span><span class="arch-section-hint">Shortest structural route</span></div>
                    <div class="arch-path-controls"><select class="arch-select" onchange={handleArchitecturePathSource}><template for:each={architectureObjectOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select><span>→</span><select class="arch-select" onchange={handleArchitecturePathTarget}><template for:each={architectureObjectOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></div>
                    <template if:true={architecturePathReady}><div class="arch-path-result"><template if:true={architecturePathFound}><strong>{architecturePathResult.hops} hop shortest path</strong></template><p>{architecturePathText}</p></div></template>
                </section>
                <section class="arch-section">
                    <div class="arch-section-head"><span>Junction Intelligence</span><span class="arch-section-hint">Multi-parent structural candidates</span></div>
                    <template if:true={architectureHasJunctions}><div class="arch-junction-grid"><template for:each={architectureJunctions} for:item="j"><div class="arch-junction-card" key={j.name}><div><strong>{j.name}</strong><span class="arch-tag">{j.confidence}</span></div><p>{j.distinctTargets} parent targets · {j.outboundRelationships} outbound relationships · {j.masterDetailRelationships} Master-Detail</p></div></template></div></template>
                    <template if:false={architectureHasJunctions}><div class="arch-empty arch-empty-small">No multi-parent junction candidates detected in the current model.</div></template>
                </section>
                <section class="arch-section"><div class="arch-section-head"><span>Object-Level Metrics</span><span class="arch-section-hint">Sorted by relationship degree</span></div>
                    <div class="arch-table-wrap"><table class="arch-table"><thead><tr><th>Object</th><th>Fields</th><th>Rel. Fields</th><th>Incoming</th><th>Outgoing</th><th>Total Degree</th><th>Required</th><th>Rollups</th></tr></thead><tbody><template for:each={architectureNodes} for:item="n"><tr key={n.name}><td class="arch-object-name"><button class="arch-object-link" data-name={n.name} onclick={handleArchitectureObjectSelect}>{n.name}</button></td><td>{n.fieldCount}</td><td>{n.relationshipFieldCount}</td><td>{n.incoming}</td><td>{n.outgoing}</td><td><strong>{n.degree}</strong></td><td>{n.requiredFieldCount}</td><td>{n.rollupFieldCount}</td></tr></template></tbody></table></div>
                </section>
                <template if:true={architectureHasObjectDetail}>
                    <section class="arch-section arch-drill">
                        <div class="arch-section-head"><span>Object Drill-Down · {architectureObjectDetail.name}</span><button class="arch-inline-close" onclick={handleArchitectureDrillClose}>Clear selection</button></div>
                        <div class="arch-drill-hero"><div><span class="arch-tag">Structural role</span><strong>{architectureObjectDetail.role}</strong></div><div><span>Fields</span><strong>{architectureObjectDetail.fieldCount}</strong></div><div><span>Incoming</span><strong>{architectureObjectDetail.incoming}</strong></div><div><span>Outgoing</span><strong>{architectureObjectDetail.outgoing}</strong></div><div><span>Total degree</span><strong>{architectureObjectDetail.degree}</strong></div><div><span>Reach ≤3 hops</span><strong>{architectureObjectDetail.reachableWithin3}</strong></div></div>
                        <div class="arch-drill-grid"><div><h4>Parents / targets</h4><p>{architectureObjectParentsText}</p></div><div><h4>Children / dependants</h4><p>{architectureObjectChildrenText}</p></div><div><h4>Cycles involving object</h4><p>{architectureObjectCyclesText}</p></div></div>
                        <template if:true={architectureBlastRadius}><div class="arch-blast-head"><strong>Blast Radius</strong><span>{architectureBlastRadius.total} objects reachable within 3 hops</span></div><div class="arch-reach"><template for:each={architectureBlastLevels} for:item="r"><div class="arch-reach-card" key={r.depth}><span>{r.depth} hop impact</span><strong>{r.count} objects</strong><p>{r.objects}</p></div></template></div></template><div class="arch-reach"><template for:each={architectureObjectReach} for:item="r"><div class="arch-reach-card" key={r.depth}><span>{r.depth} hop</span><strong>{r.count} objects</strong><p>{r.names}</p></div></template></div>
                    </section>
                </template>
                <div class="arch-boundary"><strong>Scope:</strong> data-model architecture only. Permissions, CRUD/FLS, vulnerability and security-posture analysis remain outside ER Modeller Studio.</div>
            </template>
            <template if:true={architectureShowEmpty}><div class="arch-empty">Add or import objects to the diagram to analyse its architecture.</div></template>
        </div>
    </template>

    <!-- DATA DICTIONARY -->
    <template if:true={dictionaryOpen}>
        <div class={dictionaryPanelClass}>
            <div class="dict-header">
                <div class="dict-header-actions">
                    <button class="dict-back-btn" onclick={handleCloseDictionary} title="Return to the ER canvas">&#8592; Back to Diagram</button>
                    <span class="dict-title">Data Dictionary</span>
                </div>
                <div class="dict-header-actions">
                    <button class="dsl-head-btn" onclick={handleToggleDictionaryFullScreen}>{dictionaryFullScreenLabel}</button>
                    <button class="modal-close" onclick={handleCloseDictionary}>x</button>
                </div>
            </div>
            <div class="dict-body">
                <!-- Left: object list -->
                <div class="dict-list-pane">
                    <input type="text"
                           class="dict-search-input"
                           placeholder="Search objects..."
                           value={dictionarySearch}
                           oninput={handleDictionarySearchInput} />
                    <p class="dict-list-count">{dictionaryObjectCount} objects</p>
                    <div class="dict-obj-list">
                        <template for:each={dictionaryObjectList} for:item="o">
                            <div key={o.name} class={o.rowClass} data-name={o.name} onclick={handleSelectDictionaryObject}>{o.name}</div>
                        </template>
                    </div>
                    <div class="dict-list-footer">
                        <button class="tb-btn tb-btn-primary" disabled={dictionaryExportAllBusy} onclick={handleExportAllDictionary}>Export All to Excel</button>
                        <template if:true={dictionaryExportAllBusy}>
                            <p class="dict-export-progress">{dictionaryExportAllProgress}</p>
                        </template>
                        <p class="hint-text">Bulk export includes every field's metadata but not % Used — that's a live data scan, run per-object only, to keep bulk export fast and safe.</p>
                    </div>
                </div>

                <!-- Right: selected object detail -->
                <div class="dict-detail-pane">
                    <template if:false={dictionaryHasSelection}>
                        <div class="dict-empty-state">
                            <p class="hint-text">Select an object on the left to see its field-level detail here.</p>
                        </div>
                    </template>
                    <template if:true={dictionaryLoading}>
                        <p class="hint-text">Loading {dictionarySelectedObject}...</p>
                    </template>
                    <template if:true={dictionaryHasSelection}>
                        <div class="dict-detail-head">
                            <div>
                                <span class="dict-detail-title">{dictionaryRow.apiName}</span>
                                <span class="dict-detail-sub">{dictionaryRow.label} &middot; {dictionaryObjectTypeText} &middot; {dictionaryFieldCount} fields</span>
                            </div>
                            <div class="dict-detail-actions">
                                <button class="dsl-head-btn dict-archaeologist-launch" onclick={handleOpenDictionaryArchaeologist}>Explore Object</button>
                                <button class="dsl-head-btn dict-intelligence-launch" onclick={handleDictionaryIntelligenceToggle}>Expand Intelligence</button>
                                <button class="dsl-head-btn" onclick={handleClearDictionarySelection} title="Clear this object's field list on the right — does not touch the canvas">Clear Selection</button>
                                <button class="dsl-head-btn" disabled={dictionaryUsagePending} onclick={handleCalculateUsage}>{dictionaryCalcUsageLabel}</button>
                                <button class="dsl-head-btn" onclick={handleExportDictionaryCsv}>Export CSV</button>
                                <button class="dsl-head-btn" disabled={dictionaryExportBusy} onclick={handleExportDictionaryXlsx}>Export Excel</button>
                            </div>
                        </div>
                        <section class="dict-fields-primary"><div class="dict-primary-title"><div><span class="dict-intel-kicker">ALL FIELDS</span><strong>Field Dictionary</strong></div><span>{dictionaryVisibleFieldCount} of {dictionaryFieldCount} fields</span></div><div class="dict-field-tools">
                            <input class="dict-search-input dict-field-search" type="text" placeholder="Search fields, labels, descriptions, types or relationship targets..." value={dictionaryFieldSearch} oninput={handleDictionaryFieldSearch}/>
                            <select class="arch-select dict-field-filter" value={dictionaryFieldFilter} onchange={handleDictionaryFieldFilter}><template for:each={dictionaryFilterOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select>
                            <span class="dict-visible-count">{dictionaryVisibleFieldCount} fields shown</span>
                        </div>
                                                <div class="dict-table-wrap">
                            <table class="dict-table">
                                <thead>
                                    <tr>
                                        <th class={dictSortClassApiName} data-column="apiName" onclick={handleSortDictionary}>Field API Name{dictSortArrowApiName}</th>
                                        <th>Label</th>
                                        <th>Description</th>
                                        <th>Data Type</th>
                                        <th class={dictSortClassRequired} data-column="required" onclick={handleSortDictionary}>Required{dictSortArrowRequired}</th>
                                        <th class={dictSortClassCustom} data-column="isCustom" onclick={handleSortDictionary}>Custom{dictSortArrowCustom}</th>
                                        <th>PK</th>
                                        <th>FK</th>
                                        <th>FK To</th>
                                        <th>Last Modified</th>
                                        <th>% Used</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={dictionaryFieldRows} for:item="f">
                                        <tr key={f.key} class={f.rowClass}>
                                            <td><button class="arch-object-link" data-name={f.apiName} onclick={handleDictionaryFieldSelect}>{f.apiName}</button></td>
                                            <td>{f.label}</td>
                                            <td>{f.description}</td>
                                            <td>{f.dataType}</td>
                                            <td>{f.requiredText}</td>
                                            <td>{f.customText}</td>
                                            <td>{f.pkText}</td>
                                            <td>{f.fkText}</td>
                                            <td>{f.fkTarget}</td>
                                            <td>{f.lastModified}</td>
                                            <td>{f.usageText}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div></section><template if:true={dictionaryIntelligenceExpanded}>
                            <section class="dict-intelligence-workspace">
                                <div class="dict-intelligence-workspace-head">
                                    <div><span class="dict-intel-kicker">OBJECT INTELLIGENCE</span><strong>{dictionaryRow.apiName}</strong><p>Metadata evidence and field population insight for the selected object.</p></div>
                                    <button class="dsl-head-btn" onclick={handleDictionaryIntelligenceToggle}>Back to Data Dictionary</button>
                                </div>
                                <div class="dict-intelligence-workspace-body">
                                    <section class="dict-wow-hero"><span class="dict-intel-kicker">OBJECT AT A GLANCE</span><h2>{dictionaryIntelligenceHeadline}</h2></section>
                                    <div class="dict-wow-grid">
                                        <section class="dict-wow-card"><div class="dict-wow-title"><strong>Field composition</strong><span>Standard versus custom extension</span></div><template for:each={dictionaryComposition} for:item="row"><div class="dict-wow-bar-row" key={row.key}><div><span>{row.label}</span><strong>{row.count}</strong></div><div class="dict-wow-track"><i style={row.width}></i></div></div></template></section>
                                        <section class="dict-wow-card"><div class="dict-wow-title"><strong>Documentation coverage</strong><span>Custom field descriptions</span></div><template for:each={dictionaryDocumentationLandscape} for:item="row"><div class="dict-wow-bar-row" key={row.key}><div><span>{row.label}</span><strong>{row.count}</strong></div><div class="dict-wow-track"><i style={row.width}></i></div></div></template></section>
                                    </div>
                                    <div class="dict-wow-grid dict-wow-grid-main">
                                        <section class="dict-wow-card"><div class="dict-wow-title"><strong>Field type landscape</strong><span>Dominant metadata types on this object</span></div><template for:each={dictionaryFieldTypeLandscape} for:item="row"><div class="dict-wow-bar-row" key={row.key}><div><span>{row.label}</span><strong>{row.count}</strong></div><div class="dict-wow-track"><i style={row.width}></i></div></div></template></section>
                                        <section class="dict-wow-card dict-wow-map-card"><div class="dict-wow-title"><strong>Relationship map</strong><span>Selected object at the centre, related targets around it</span></div><template if:true={dictionaryHasRelationshipMap}><div class="dict-rel-map"><div class="dict-rel-map-centre">{dictionaryRow.apiName}</div><template for:each={dictionaryRelationshipMap} for:item="node"><div key={node.key} class="dict-rel-map-node" style={node.style}><strong>{node.target}</strong><span>{node.count}</span></div></template></div></template></section>
                                    </div>
                                    <div class="dict-summary-grid"><template for:each={dictionaryObjectSummary} for:item="m"><div class="dict-summary-card" key={m.label}><strong>{m.value}</strong><span>{m.label}</span></div></template></div>
                                    <div class="dict-findings"><template for:each={dictionaryMetadataFindings} for:item="f"><article class="dict-finding" key={f.key}><span class="arch-tag">{f.kind}</span><div><strong>{f.title}</strong><p>{f.detail}</p></div></article></template></div>
                                    <template if:true={dictionaryHasUsageSummary}><div class="dict-usage-summary"><div class="dict-mini-title">Field population profile</div><div class="dict-summary-grid"><template for:each={dictionaryUsageSummary} for:item="u"><div class="dict-summary-card" key={u.label}><strong>{u.value}</strong><span>{u.label}</span></div></template></div></div></template>
                                    <template if:true={dictionaryHasRelationships}><div class="dict-rel-summary"><div class="dict-mini-title">Relationship context</div><div class="dict-rel-grid"><template for:each={dictionaryRelationshipRows} for:item="rel"><div class="dict-rel-card" key={rel.key}><strong>{rel.field}</strong><span>{rel.type}</span><p>Target: {rel.target}</p></div></template></div></div></template>
                                </div>
                            </section>
                        </template>

                        <template if:true={dictionaryArchaeologistOpen}>
                            <section class={dictionaryArchaeologistClass}>
                                <div class="dict-archaeologist-head"><div><span class="dict-intel-kicker">DATA MODEL ARCHAEOLOGIST</span><strong>{dictionaryRow.apiName}</strong><p>Evidence from metadata already loaded by the Data Dictionary. No Tooling API or external API calls.</p></div><button class="modal-close" onclick={handleCloseDictionaryArchaeologist}>x</button></div>
                                <div class="dict-archaeology-facts"><template for:each={dictionaryArchaeologyFacts} for:item="fact"><article key={fact.key}><span>{fact.label}</span><strong>{fact.value}</strong><p>{fact.detail}</p></article></template></div>
                                <div class="dict-archaeology-section"><div class="dict-archaeology-title"><strong>Field families</strong><span>Repeated business concepts found in field names and labels. Select one to inspect those fields.</span></div><template if:true={dictionaryHasFieldFamilies}><div class="dict-family-grid"><template for:each={dictionaryFieldFamilies} for:item="family"><button key={family.key} class="dict-family-card" data-token={family.filter} onclick={handleDictionaryFamilySelect}><span>{family.label}</span><strong>{family.count} fields</strong><small>{family.fields}</small></button></template></div></template></div>
                                <div class="dict-archaeology-columns">
                                    <div class="dict-archaeology-section"><div class="dict-archaeology-title"><strong>Relationship concentration</strong><span>Repeated relationship references by target object.</span></div><div class="dict-landscape"><template for:each={dictionaryRelationshipConcentration} for:item="rel"><div key={rel.key} class="dict-landscape-row"><span>{rel.target}</span><strong>{rel.count}</strong></div></template></div></div>
                                    <div class="dict-archaeology-section"><div class="dict-archaeology-title"><strong>Possible semantic overlap</strong><span>Same normalised labels or names. Evidence for review, not a duplicate claim.</span></div><template if:true={dictionaryHasPossibleOverlaps}><div class="dict-overlap-list"><template for:each={dictionaryPossibleOverlaps} for:item="item"><article key={item.key}><strong>{item.label}</strong><span>{item.count} fields</span><p>{item.fields}</p></article></template></div></template></div>
                                </div>
                            </section>
                        </template>
                        <template if:true={dictionaryHasFieldDetail}>
                            <aside class="dict-field-drill">
                                <div class="dict-field-drill-head"><div><span class="dict-intel-kicker">FIELD PROFILE</span><strong>{dictionaryFieldDetail.apiName}</strong><p>{dictionaryFieldDetail.label}</p></div><button class="arch-inline-close" onclick={handleDictionaryFieldDrillClose}>Close</button></div>
                                <p class="dict-field-description">{dictionaryFieldDetail.description}</p>
                                <div class="dict-field-facts"><div><span>Type</span><strong>{dictionaryFieldDetail.dataType}</strong></div><div><span>Required</span><strong>{dictionaryFieldDetail.required}</strong></div><div><span>Custom</span><strong>{dictionaryFieldDetail.custom}</strong></div><div><span>Relationship</span><strong>{dictionaryFieldDetail.relationship}</strong></div><div><span>Target</span><strong>{dictionaryFieldDetail.target}</strong></div><div><span>Population</span><strong>{dictionaryFieldDetail.usage}</strong></div><div><span>Last modified</span><strong>{dictionaryFieldDetail.lastModified}</strong></div></div>
                            </aside>
                        </template>
                    </template>
                </div>
            </div>
        </div>
    </template>
</div>
</template>
