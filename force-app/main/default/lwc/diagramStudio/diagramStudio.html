<template>
<div class={rootClass}>

    <!-- CONTEXT MENU -->
    <template if:true={ctxMenu}>
        <div class="ctx-menu" style={ctxMenuStyle}>
            <div class="ctx-item" onclick={handleCtxOpen}>Open</div>
            <div class="ctx-item" onclick={handleCtxDuplicate}>Duplicate</div>
            <div class="ctx-divider"></div>
            <div class="ctx-item ctx-danger" onclick={handleCtxDelete}>Delete</div>
        </div>
    </template>

    <!-- OBJECT SUMMARY HOVER CARD -->
    <template if:true={hoverCard}>
        <div class="hover-card" style={hoverCard.style}>
            <div class="hover-card-title">{hoverCard.name}</div>
            <div class="hover-card-sub">{hoverCard.objectTypeText} &middot; {hoverCard.fieldCount} fields</div>
            <div class="hover-card-divider"></div>

            <div class="hover-card-row">
                <span class="hover-card-label">Records</span>
                <template if:true={hoverCard.hasRecordData}>
                    <span class="hover-card-value">{hoverCard.recordCountText}</span>
                </template>
                <template if:false={hoverCard.hasRecordData}>
                    <span class="hover-card-hint">Turn on Heatmap to see this</span>
                </template>
            </div>
            <template if:true={hoverCard.recordFreshnessText}>
                <div class="hover-card-row">
                    <span class="hover-card-label"></span>
                    <span class="hover-card-freshness">{hoverCard.recordFreshnessText}</span>
                </div>
            </template>

            <div class="hover-card-row">
                <span class="hover-card-label">Internal Sharing</span>
                <template if:true={hoverCard.hasSharingData}>
                    <span class="hover-card-value">{hoverCard.internalSharingText}</span>
                </template>
                <template if:false={hoverCard.hasSharingData}>
                    <span class="hover-card-hint">Turn on Sharing View to see this</span>
                </template>
            </div>
            <template if:true={hoverCard.hasSharingData}>
                <div class="hover-card-row">
                    <span class="hover-card-label">External Sharing</span>
                    <span class="hover-card-value">{hoverCard.externalSharingText}</span>
                </div>
                <template if:true={hoverCard.hasSharingSignalData}>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Sharing Rules</span>
                        <span class="hover-card-value">{hoverCard.sharingRuleText}</span>
                    </div>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Apex Sharing</span>
                        <span class="hover-card-value">{hoverCard.apexSharingText}</span>
                    </div>
                </template>
                <template if:false={hoverCard.hasSharingSignalData}>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Sharing Rules / Apex Sharing</span>
                        <span class="hover-card-hint">No sharing data for this object</span>
                    </div>
                </template>
            </template>
        </div>
    </template>

    <!-- SETTINGS WORKSPACE -->
    <template if:true={settingsOpen}>
        <section class="settings-page">
            <header class="settings-head">
                <div><span class="settings-kicker">ER MODELLER STUDIO</span><h1>Settings</h1><p>Configure Studio features without leaving the application.</p></div>
                <button class="mimic-close" onclick={handleCloseSettings}>Back to Diagram</button>
            </header>
            <div class="settings-shell">
                <aside class="settings-nav">
                    <div class="settings-nav-group">SYSTEM</div>
                    <button class={settingsSystemNavClass} onclick={handleSettingsSystemSection}>System Information</button>
                    <button class={settingsDiagnosticsNavClass} onclick={handleSettingsDiagnosticsSection}>Diagnostics</button>
                    <div class="settings-nav-group">FIELD USAGE</div>
                    <button class={settingsScheduleNavClass} onclick={handleSettingsScheduleSection}>Schedule Settings</button>
                    <div class="settings-nav-group">APPEARANCE</div>
                    <button class={settingsThemeNavClass} onclick={handleSettingsThemeSection}>Theme</button>
                </aside>
                <main class="settings-content">
                    <template if:true={settingsScheduleSectionOpen}>
                    <div class="settings-title"><div><h2>Field Usage Schedule Settings</h2><p>Control automatic Field Usage scans and inspect the Salesforce jobs created by this Studio.</p></div></div>
                    <div class="settings-tabs">
                        <button class={settingsConfigurationTabClass} onclick={handleSettingsConfigurationTab}>Schedule Configuration</button>
                        <button class={settingsJobsTabClass} onclick={handleSettingsJobsTab}>Scheduled Jobs</button>
                    </div>
                    <template if:true={settingsMessage}><div class="settings-message" role="status">{settingsMessage}</div></template>
                    <template if:true={settingsBusy}><div class="settings-loading">Working…</div></template>

                    <template if:true={settingsConfigurationOpen}>
                        <section class="settings-panel">
                            <div class="settings-panel-head"><div><h3>Automatic Field Usage Scans</h3><p>Only schedules listed here are used. Studio does not create hidden default schedules.</p></div><button class="arch-action-btn" onclick={handleAddSchedule}>+ Add Schedule</button></div>
                            <template if:true={settingsNoSchedules}><div class="settings-empty"><strong>No schedules configured</strong><p>Add a schedule when you want Salesforce to run Field Usage automatically.</p></div></template>
                            <template for:each={settingsSchedules} for:item="row">
                                <div class="settings-schedule-row" key={row._key}>
                                    <label class="settings-check"><input type="checkbox" checked={row.Enabled__c} data-key={row._key} onchange={handleScheduleEnabled}/><span>Enabled</span></label>
                                    <label><span>Name</span><input type="text" value={row.Name} data-key={row._key} oninput={handleScheduleName}/></label>
                                    <label><span>Hour</span><input type="number" min="0" max="23" value={row.Hour__c} data-key={row._key} onchange={handleScheduleHour}/></label>
                                    <span class="settings-time-sep">:</span>
                                    <label><span>Minute</span><input type="number" min="0" max="59" value={row.Minute__c} data-key={row._key} onchange={handleScheduleMinute}/></label>
                                    <button class="settings-delete" data-key={row._key} onclick={handleDeleteSchedule}>Delete</button>
                                </div>
                            </template>
                            <div class="settings-actions"><button class="arch-action-btn arch-export-btn" disabled={settingsBusy} onclick={handleSaveSchedules}>Save Changes</button></div>
                        </section>
                    </template>

                    <template if:true={settingsJobsOpen}>
                        <section class="settings-panel">
                            <div class="settings-panel-head"><div><h3>Scheduled Jobs</h3><p>Only Field Usage jobs owned by ER Modeller Studio are shown.</p></div><button class="arch-action-btn" disabled={settingsBusy} onclick={handleRefreshScheduledJobs}>Refresh</button></div>
                            <template if:true={settingsNoJobs}><div class="settings-empty"><strong>No Field Usage scheduled jobs</strong><p>Create a schedule in Schedule Configuration to add one.</p></div></template>
                            <template if:true={settingsHasJobs}>
                                <div class="settings-job-table">
                                    <div class="settings-job-header"><span>Schedule</span><span>Time</span><span>Status</span><span>Next run</span><span>Actions</span></div>
                                    <template for:each={settingsJobsView} for:item="job">
                                        <div class="settings-job-row" key={job.key}>
                                            <span><strong>{job.scheduleName}</strong><small>{job.jobName}</small></span>
                                            <span>{job.timeText}</span><span>{job.state}</span><span>{job.nextRunText}</span>
                                            <span class="settings-job-actions">
                                                <template if:true={job.canPause}><button data-id={job.scheduleId} onclick={handlePauseScheduledJob}>Pause</button></template>
                                                <template if:true={job.canResume}><button data-id={job.scheduleId} onclick={handleResumeScheduledJob}>Resume</button></template>
                                                <button class="settings-delete" data-id={job.scheduleId} onclick={handleDeleteScheduledJob}>Delete</button>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </section>
                    </template>
                    </template>
                    <template if:true={settingsSystemSectionOpen}>
                        <div class="settings-title"><div><h2>System Information</h2><p>Read-only information about this ER Modeller Studio installation and the Salesforce environment it is running in.</p></div><button class="arch-action-btn" onclick={loadSystemInfo}>Refresh</button></div>
                        <template if:true={systemInfoBusy}><div class="settings-loading">Reading system information…</div></template>
                        <section class="settings-panel system-info-panel">
                            <div class="settings-panel-head"><div><h3>Application</h3><p>Use these values when identifying the Studio build or raising a support issue.</p></div></div>
                            <div class="system-info-grid">
                                <div><span>ER Modeller Studio</span><strong>Version {systemStudioVersion}</strong></div>
                                <div><span>Default application theme</span><strong>Dark+</strong></div>
                                <div><span>Namespace</span><strong>{systemNamespace}</strong></div>
                            </div>
                        </section>
                        <section class="settings-panel system-info-panel">
                            <div class="settings-panel-head"><div><h3>Salesforce Integration</h3><p>Field Usage uses the Tooling API version shown here. Opening this page does not make a Tooling API request.</p></div></div>
                            <div class="system-info-grid">
                                <div><span>Tooling API</span><strong>{systemToolingVersion}</strong></div>
                                <div><span>Salesforce API baseline</span><strong>v{systemSalesforceApiVersion}</strong></div>
                                <div><span>Environment</span><strong>{systemEnvironment}</strong></div>
                                <div><span>Organisation ID</span><strong>{systemOrganisationId}</strong></div>
                                <div><span>Running user</span><strong>{systemRunningUser}</strong></div>
                            </div>
                        </section>
                    </template>

                    <template if:true={settingsDiagnosticsSectionOpen}>
                        <div class="settings-title"><div><h2>Diagnostics</h2><p>Verify whether this installation is in a good state to work. Diagnostics do not start a Field Usage scan.</p></div></div>
                        <section class="settings-panel diagnostics-launch-panel">
                            <div class="diag-launch-copy"><span class="diag-eyebrow">APPLICATION SELF-TEST</span><h3>ER Modeller Studio Health Check</h3><p>Checks Studio runtime, Field Usage data access, snapshot state, Batch Apex, scheduler configuration and the authenticated Salesforce Tooling API connection.</p><p class="diag-api-note">Opening Settings consumes no Tooling API request. Clicking Run Diagnostics deliberately performs one lightweight Tooling API preflight so authentication can be proven.</p></div>
                            <button class="arch-action-btn arch-export-btn diag-run-button" onclick={handleRunDiagnostics}>{diagnosticsButtonLabel}</button>
                            <div class={diagnosticsOverallClass}><span>Current diagnostic state</span><strong>{diagnosticsOverallStatus}</strong><p>{diagnosticsSummary}</p><small>Last completed: {diagnosticsCompletedAt}</small></div>
                        </section>
                    </template>

                    <template if:true={settingsThemeSectionOpen}>
                        <div class="settings-title"><div><h2>Theme</h2><p>Choose the appearance used throughout ER Modeller Studio, including the diagram, full-screen workspaces, Settings and Help.</p></div></div>
                        <template if:true={settingsMessage}><div class="settings-message" role="status">{settingsMessage}</div></template>
                        <section class="settings-panel">
                            <div class="settings-panel-head"><div><h3>Application Theme</h3><p>Select a theme to preview it immediately. Click Save Theme to keep the choice for future Studio sessions.</p></div></div>
                            <label><span>Theme</span><select class="theme-select settings-theme-select" onchange={handleThemeChange}>
                                <option value="theme-dark-plus" selected={isThemeDarkPlus}>Dark+</option>
                                <option value="theme-light-plus" selected={isThemeLightPlus}>Light+</option>
                                <option value="theme-monokai" selected={isThemeMonokai}>Monokai</option>
                                <option value="theme-solarized-light" selected={isThemeSolarizedLight}>Solarized Light</option>
                            </select></label>
                            <div class="settings-actions"><button class="arch-action-btn arch-export-btn" onclick={handleSaveTheme}>Save Theme</button></div>
                        </section>
                    </template>
                </main>
            </div>
        </section>
    </template>

    <template if:true={diagnosticsOpen}>
        <section class="diagnostics-page">
            <header class="diagnostics-head">
                <div><span class="settings-kicker">ER MODELLER STUDIO · SYSTEM DIAGNOSTICS</span><h1>Application Health Check</h1><p>Live self-test of the Studio installation. No Field Usage scan is started.</p></div>
                <button class="arch-action-btn" disabled={diagnosticsRunning} onclick={handleCloseDiagnostics}>Back to Settings</button>
            </header>
            <div class="diagnostics-body">
                <div class="diagnostics-hero">
                    <div class="diag-pulse" data-running={diagnosticsRunning}><span></span></div>
                    <div><span class="diag-eyebrow">DIAGNOSTIC ENGINE</span><h2>{diagnosticsOverallStatus}</h2><p>{diagnosticsStage}</p></div>
                    <button class="arch-action-btn arch-export-btn" disabled={diagnosticsRunning} onclick={handleRunDiagnostics}>{diagnosticsButtonLabel}</button>
                </div>
                <template if:true={diagnosticsRunning}><div class="diag-processing"><span></span><span></span><span></span><strong>{diagnosticsStage}</strong></div></template>
                <div class="diag-check-list">
                    <template for:each={diagnosticsChecks} for:item="check">
                        <article class={check.cssClass} key={check.key}>
                            <div class="diag-status-mark">{check.status}</div>
                            <div><h3>{check.label}</h3><template if:true={check.diagnosis}><div class="diag-likely-cause"><strong>Diagnosis</strong><span>{check.diagnosis}</span></div></template><p>{check.detail}</p><template if:true={check.remediation}><div class="diag-remediation"><strong>Recommended action</strong><span>{check.remediation}</span><template if:true={check.hasActions}><ul class="diag-remediation-list"><template for:each={check.actions} for:item="action"><li key={action.key}>{action.label}</li></template></ul></template></div></template></div>
                        </article>
                    </template>
                </div>
                <template if:true={diagnosticsHasResults}>
                    <section class={diagnosticsOverallClass}><span>Overall application state</span><strong>{diagnosticsOverallStatus}</strong><p>{diagnosticsSummary}</p><small>Completed {diagnosticsCompletedAt}</small></section>
                </template>
                <div class="diag-safety-note"><strong>Diagnostic scope</strong><span>This self-test is read-only except for the authenticated Tooling API preflight. It does not launch scans, alter schedules, modify credentials or expose OAuth tokens and secrets.</span></div>
            </div>
        </section>
    </template>

    <!-- IN-APP HELP -->
    <template if:true={helpOpen}>
        <section class="help-page">
            <header class="help-head">
                <div><div class="help-kicker">ER MODELLER STUDIO HELP</div><h1>Help and Documentation</h1><p>Configuration instructions and day-to-day guidance are available inside the Studio. No GitHub access is required.</p></div>
                <button class="arch-action-btn" onclick={handleCloseHelp}>Back to Diagram</button>
            </header>
            <div class="help-shell">
                <nav class="help-nav">
                    <div class="help-nav-group">HELP</div>
                    <button class={helpConfigurationClass} onclick={handleHelpConfiguration}>Configuration</button>
                    <button class={helpUserManualClass} onclick={handleHelpUserManual}>User Manual</button>
                </nav>
                <main class="help-content">
                    <template if:true={helpConfigurationOpen}>
                        <article class="help-doc">
                            <h2>Field Usage Configuration</h2>
                            <p class="help-lead">Field Usage scans formula fields directly and use Salesforce Tooling API for Apex classes, Apex triggers and active Flows. Complete the Tooling API connection once in every org where Field Usage will run.</p>
                            <div class="help-warning"><strong>If a scan says the Named Credential is missing, unauthenticated or inaccessible</strong><span>Do not repeatedly launch the scan. Complete the configuration below, verify principal access, then run the scan again.</span></div>

                            <section><h3>Before you start</h3><p>You need Salesforce Setup access appropriate to create OAuth and Named Credential configuration. Use the target org's own My Domain. Do not copy a Developer Edition, sandbox or production hostname, OAuth token or secret into another environment.</p></section>

                            <section><div class="help-step">1</div><h3>Create the External Auth Identity Provider</h3>
                                <p>Go to <strong>Setup → Named Credentials → External Auth Identity Providers → New</strong>.</p>
                                <div class="help-values"><span><b>Label</b> Salesforce Tooling API Provider</span><span><b>Name</b> Salesforce_Tooling_API_Provider</span><span><b>Authentication Protocol</b> OAuth 2.0</span><span><b>Authentication Flow Type</b> Authorization Code (Browser Flow)</span></div>
                                <p>Use the target org's My Domain for both endpoints:</p><code>https://&lt;your-my-domain&gt;.my.salesforce.com/services/oauth2/authorize</code><code>https://&lt;your-my-domain&gt;.my.salesforce.com/services/oauth2/token</code>
                                <p>Leave User Info Endpoint blank unless your organisation requires it. If Salesforce requires values before it will save the provider, use temporary Client ID and Client Secret placeholders only long enough to obtain the Salesforce-generated Callback URL. Copy that Callback URL exactly.</p>
                            </section>

                            <section><div class="help-step">2</div><h3>Create the External Client App</h3>
                                <p>Go to <strong>Setup → External Client App Manager → New External Client App</strong>.</p>
                                <div class="help-values"><span><b>External Client App Name</b> Salesforce Tooling API</span><span><b>API Name</b> Salesforce_Tooling_API</span><span><b>Distribution State</b> Local</span></div>
                                <p>Enable OAuth. Paste the Callback URL generated in step 1. Add these OAuth scopes:</p>
                                <code>Manage user data via APIs (api)</code><code>Perform requests at any time (refresh_token, offline_access)</code>
                                <p>Enable Authorization Code and Credentials Flow. If PKCE is enabled or required here, enable <strong>Use Proof Key for Code Exchange (PKCE) Extension</strong> on the External Auth Identity Provider too. Save the app and obtain its Consumer Key and Consumer Secret. Never place the secret in source control.</p>
                                <p>Return to the External Auth Identity Provider and replace the temporary Client ID and Client Secret with the External Client App's real Consumer Key and Consumer Secret.</p>
                            </section>

                            <section><div class="help-step">3</div><h3>Create the External Credential</h3>
                                <p>Go to <strong>Setup → Named Credentials → External Credentials → New</strong>.</p>
                                <div class="help-values"><span><b>Label</b> Salesforce Tooling API</span><span><b>Name</b> Salesforce_Tooling_API</span><span><b>Authentication Protocol</b> OAuth 2.0</span><span><b>Authentication Flow Type</b> Browser Flow</span><span><b>Identity Provider</b> Salesforce Tooling API Provider</span><span><b>Scope</b> api refresh_token</span></div>
                                <p>Leave Additional Status Codes for Token Refresh blank unless your organisation specifically requires another value.</p>
                            </section>

                            <section><div class="help-step">4</div><h3>Create and authenticate the Named Principal</h3>
                                <p>Open the External Credential. Under <strong>Principals</strong>, create:</p>
                                <div class="help-values"><span><b>Parameter Name</b> ToolingAPIPrincipal</span><span><b>Sequence Number</b> 1</span><span><b>Identity Type</b> Named Principal</span><span><b>Scope</b> leave blank</span></div>
                                <p>Save it, choose <strong>Authenticate</strong> from the principal's Actions menu, sign in to this target Salesforce org and approve access. Authentication Status should become <strong>Configured</strong>.</p>
                                <p>If Salesforce returns <strong>invalid_scope</strong>, confirm the External Client App has the API and refresh-token scopes above and that the External Credential scope is exactly <code>api refresh_token</code>.</p>
                            </section>

                            <section><div class="help-step">5</div><h3>Create the Named Credential</h3>
                                <p>Go to <strong>Setup → Named Credentials → Named Credentials → New</strong>.</p>
                                <div class="help-values"><span><b>Label</b> Salesforce Tooling API</span><span><b>Name</b> Salesforce_Tooling_API</span><span><b>URL</b> https://&lt;target-org-my-domain&gt;.my.salesforce.com</span><span><b>External Credential</b> Salesforce Tooling API</span><span><b>Enabled for Callouts</b> On</span><span><b>Generate Authorization Header</b> On</span></div>
                                <p>Leave Client Certificate blank unless required by your organisation. The Apex code deliberately uses the logical name <code>callout:Salesforce_Tooling_API</code>; do not change the credential name.</p>
                                <p>If this Studio's package namespace appears under the Named Credential, add that namespace to <strong>Allowed Namespaces for Callouts</strong>. Do not hard-code a namespace into the credential name used by the Apex code.</p>
                            </section>

                            <section><div class="help-step">6</div><h3>Grant External Credential Principal Access</h3>
                                <p>Open the permission set assigned to the user who runs Field Usage, normally <strong>Diagram Studio User</strong>. Open <strong>External Credential Principal Access → Edit</strong>, move <strong>Salesforce_Tooling_API - ToolingAPIPrincipal</strong> to Enabled External Credential Principals and save.</p>
                                <div class="help-warning"><strong>This is separate from Authentication Status = Configured.</strong><span>The principal can be authenticated while the user still has no permission to use it. Reopen External Credential Principal Access after deployment/configuration and verify the principal is still enabled.</span></div>
                                <p>Also verify the permission set has the Salesforce-required access to <strong>Object Settings → User External Credentials</strong>. Scheduled scans must run under a user who retains the same required credential/principal access.</p>
                            </section>

                            <section><div class="help-step">7</div><h3>Verify the connection</h3>
                                <p>Return to the Studio and choose <strong>Diagram → Run Field Usage Scan</strong>. Before a run is created, the Studio checks <code>Salesforce_Tooling_API</code>. If it cannot use the connection, the scan is stopped and the configuration error is shown instead of deliberately starting a broken Tooling API scan.</p>
                                <p>When configured correctly, the scan runs in Batch Apex in the background. Keep the activity window open to watch progress, or close it and return later. The scan itself continues independently of the browser.</p>
                            </section>

                            <section><h3>Common configuration errors</h3>
                                <div class="help-troubleshoot"><strong>Named Credential does not exist / could not access endpoint</strong><span>Verify the Named Credential name is Salesforce_Tooling_API, Enabled for Callouts is on, the URL is this org's My Domain and the External Credential is selected.</span></div>
                                <div class="help-troubleshoot"><strong>Could not access credential(s) / external credential might not exist</strong><span>Verify the Named Principal is Configured and, separately, that Salesforce_Tooling_API - ToolingAPIPrincipal is enabled under the running user's permission set.</span></div>
                                <div class="help-troubleshoot"><strong>invalid_scope</strong><span>External Client App: api plus refresh_token/offline_access. External Credential: api refresh_token.</span></div>
                                <div class="help-troubleshoot"><strong>Works until a permission-set deployment</strong><span>Recheck External Credential Principal Access. Authentication and principal authorisation are org-specific security configuration and should be verified after deployment.</span></div>
                            </section>
                        </article>
                    </template>

                    <template if:true={helpUserManualOpen}>
<article class="help-doc help-manual">
<h2>User Manual</h2>
<p class="help-lead">This manual assumes no previous knowledge of ER modelling or ER Modeller Studio. Follow the steps literally the first time. Every advanced result is evidence to investigate, not an automatic instruction to change Salesforce.</p>
<div class="help-manual-search-wrap"><input class="help-manual-search" type="search" placeholder="Search the manual: e.g. Field Usage, drag, hotspot, export..." value={helpManualSearch} oninput={handleHelpManualSearch}/><button class="arch-action-btn" onclick={handleClearHelpManualSearch}>Clear</button></div>
<div class="help-warning"><strong>New user?</strong><span>Read Start here, Files, Import Salesforce objects, Drag objects, and Relationships first. Then move to Data Dictionary and Architecture Intelligence.</span></div><section class="help-manual-section" data-search="beginner start screen toolbar explorer canvas DSL tabs"><h3>1. Start here: what you are looking at</h3><p>The Studio has five areas you will use repeatedly: the top menu bar, the file tabs, the Explorer on the left, the DSL editor, and the diagram canvas. If you are new, begin with a blank diagram and ignore the advanced architecture features until you can create, save and reopen a model.</p><p><strong>How to use it:</strong> Click <strong>File → New</strong> or the <strong>+</strong> beside Saved Diagrams. Give the diagram a name in the name box at the top. The Explorer lists saved diagrams and Salesforce objects. The canvas is the large modelling area. The DSL editor is the text representation of the same model. Changes to the model are reflected between the visual model and DSL.</p></section><section class="help-manual-section" data-search="file new save tabs rename delete explorer saved diagrams ctrl s"><h3>2. Files, tabs, saving and reopening</h3><p>Use <strong>File → New</strong> to start a model and <strong>File → Save</strong> or Ctrl+S to save it. Open a saved diagram by clicking its name under <strong>Saved Diagrams</strong>. Several diagrams can stay open as tabs. An asterisk on a tab means there are unsaved changes. The <strong>x</strong> closes a tab; it does not mean delete the saved diagram.</p><p><strong>How to use it:</strong> The diagram-name box names the active model. The Explorer <strong>+</strong> creates another diagram. Use the file row controls/context actions for file operations. Save before closing a tab when you want the latest edits retained.</p></section><section class="help-manual-section" data-search="import schema org object api names account contact case"><h3>3. Import Salesforce objects from the org</h3><p>Open <strong>Import from Org</strong> in the Explorer. Type object API names separated by commas, for example <code>Account, Contact, Case</code>, then click <strong>Import Schema</strong>. The Studio describes those accessible Salesforce objects and creates model content from their fields and relationships.</p><p><strong>How to use it:</strong> Use API names, not friendly labels. A custom object normally looks like <code>Project__c</code>. If an object cannot be described, check the spelling and the running user's Salesforce access.</p></section><section class="help-manual-section" data-search="drag canvas palette search objects explorer"><h3>4. Drag objects to the canvas</h3><p>Under <strong>Drag to Canvas</strong>, use <strong>Search objects</strong> to find an object. Press and hold the object chip, drag it into the large canvas, then release it where you want the object box to appear. Drag object boxes again to rearrange them.</p><p><strong>How to use it:</strong> Dragging changes presentation/layout; it does not create a Salesforce object. Use this when you want to build a focused diagram from existing org objects.</p></section><section class="help-manual-section" data-search="DSL editor entity fields relationship lookup master detail polymorphic syntax intellisense"><h3>5. DSL editor: reading and editing the model</h3><p>The DSL is a compact text version of the diagram. An <code>entity</code> line defines an object and its fields. Relationship lines connect a child field to a parent object. The editor provides suggestions while you type and can be maximised, wrapped, imported or exported.</p><p><strong>How to use it:</strong> Use <strong>&lt;/&gt;</strong> to show or hide the editor. <strong>Import</strong> loads a DSL file; <strong>Export</strong> saves the text model. <strong>Clear</strong> clears the model, so use it deliberately. Lookup, Master Detail and Polymorphic relationships have distinct relationship semantics in the model.</p></section><section class="help-manual-section" data-search="relationship connector lookup master detail polymorphic arrow child parent"><h3>6. Relationships and connector meaning</h3><p>A relationship says that one object's field points to another object. The child side owns the relationship field; the parent side is the referenced object. The Studio distinguishes Lookup, Master Detail and Polymorphic relationships and draws connectors so you can follow the structure.</p><p><strong>How to use it:</strong> When reading a connector, first identify the child object and relationship field, then follow it to the referenced object. A structural connector tells you the relationship exists; it does not by itself prove runtime usage, business criticality or change impact.</p></section><section class="help-manual-section" data-search="mimic new er custom objects fields generate model hypothetical"><h3>7. Mimic New ER: design without creating metadata</h3><p>Choose <strong>Diagram → Mimic New ER</strong> when you want to sketch a proposed custom data model without creating anything in Salesforce. Enter a model name, click <strong>+ Add Object</strong>, type the base object name, add fields, and choose field types. For Lookup, Master Detail or Polymorphic fields, select the target object.</p><p><strong>How to use it:</strong> Enter base custom names such as <code>Project</code> or <code>Status</code>; Mimic applies <code>__c</code>. Click <strong>Generate Model</strong> when finished. The result becomes normal Studio DSL and a normal diagram. Mimic is a modeller, not a Salesforce metadata deployment tool.</p></section><section class="help-manual-section" data-search="auto layout zoom fit summary canvas arrange"><h3>8. Auto Layout and diagram navigation</h3><p>Choose <strong>Diagram → Auto Layout</strong> when the canvas has become difficult to read and you want the Studio to reposition the current model automatically. You can still drag objects afterwards. Use the available zoom/fit controls in diagram workspaces to move between an overview and detail.</p><p><strong>How to use it:</strong> Layout changes where items appear, not the underlying Salesforce relationships. Use it after importing a large model or after adding many relationships.</p></section><section class="help-manual-section" data-search="compare org schema drift missing new fields recheck"><h3>9. Compare with Org / schema drift</h3><p>Choose <strong>Diagram → Compare with Org</strong>. The Studio freshly describes objects represented by the current model and compares their field lists with the diagram. <strong>In the org but not on this diagram</strong> means Salesforce returned a field that your diagram does not contain. <strong>On this diagram but not in the org</strong> means the current describe did not return that field.</p><p><strong>How to use it:</strong> Review before clicking Add or Remove. A field can appear missing because the running user cannot see it, not only because somebody deleted it. Use <strong>Re-check</strong> after investigating or changing the model.</p></section><section class="help-manual-section" data-search="sharing view internal external sharing rules apex sharing evidence"><h3>10. Sharing View</h3><p>Choose <strong>View → Sharing View</strong> to add sharing information to objects on the current diagram. Use it to discuss data-model structure together with object sharing posture. Hover/object summaries can show internal and external sharing information when that data has been loaded.</p><p><strong>How to use it:</strong> Treat sharing information as evidence about the displayed object, not as a complete security audit. Permissions, sharing rules, Apex-managed sharing and other security mechanisms need to be interpreted in context.</p></section><section class="help-manual-section" data-search="heatmap records volume counts data size"><h3>11. Record-count Heatmap</h3><p>Choose <strong>View → Heatmap</strong> to load record-count information and visually compare relative data volume across objects on the diagram. This answers a different question from relationships: it helps show where data volume is concentrated.</p><p><strong>How to use it:</strong> Use the heatmap when a structurally important object may also be large. Record counts are a point-in-time signal and can change as org data changes.</p></section><section class="help-manual-section" data-search="hover summary records sharing fields card"><h3>12. Object hover summary</h3><p>Hover over an object to see its summary card. The card combines information already available to the Studio, such as field count and, when the relevant views have loaded it, record and sharing information.</p><p><strong>How to use it:</strong> If the card tells you to turn on Heatmap or Sharing View, that means the information has not been loaded for the current view. The summary is a shortcut; use the dedicated workspace when you need deeper evidence.</p></section><section class="help-manual-section" data-search="data dictionary fields metadata search filter usage export excel"><h3>13. Data Dictionary: object and field reference</h3><p>Choose <strong>View → Data Dictionary</strong>. The left side is the object list. Search for an object and click it. The field area then shows metadata for that object. Use field search/filter controls to narrow a large object. Select a field when you want its detailed metadata/intelligence.</p><p><strong>How to use it:</strong> Think of the Data Dictionary as documentation of the schema rather than an ER drawing. <strong>Export All to Excel</strong> exports bulk dictionary information. Live percentage-used calculation, where available, is intentionally a per-object operation rather than an automatic whole-org scan.</p></section><section class="help-manual-section" data-search="dictionary percentage used records populated field usage"><h3>14. Data Dictionary field usage percentage</h3><p>Field usage percentage in the Data Dictionary is about how populated a field is in records; it is not the same thing as dependency usage in Apex, Flow or formulas. Start the supported calculation for the selected object and wait for it to complete before interpreting the percentages.</p><p><strong>How to use it:</strong> A low populated percentage does not automatically mean a field can be deleted. Dependency evidence, business meaning, integrations, reporting and historical requirements are separate questions.</p></section><section class="help-manual-section" data-search="field usage scan batch snapshot tooling api apex flow formula processing console"><h3>15. Run Field Usage Scan</h3><p>Choose <strong>Diagram → Run Field Usage Scan</strong>. The Studio first checks the Tooling API connection. A successful launch starts background Batch Apex. The activity window shows the live Salesforce batch state and processed batch counts. You can close the window; the Salesforce job continues.</p><p><strong>How to use it:</strong> When you reopen the activity screen, the Studio queries Salesforce again and attaches to the active Field Usage Batch Apex job. While a batch is active, starting another scan and cleaning the console are not available. If configuration fails, use <strong>Help → Configuration</strong> rather than repeatedly launching.</p></section><section class="help-manual-section" data-search="field usage coverage formula apex class trigger flow active dependency snapshot"><h3>16. What the Field Usage scan actually covers</h3><p>The snapshot gathers supported dependency evidence from formula fields and Tooling API sources including Apex classes, Apex triggers and active Flows. Work is processed asynchronously and the successful snapshot becomes the evidence source used by Field Usage views.</p><p><strong>How to use it:</strong> A scanner can only report evidence within its implemented coverage. <strong>0 dependencies</strong> therefore means no dependency was detected by this scanner in the successful snapshot; it is not a universal proof that the field is unused everywhere.</p></section><section class="help-manual-section" data-search="field usage map object field search build map dependency evidence source type component"><h3>17. Field Usage Map: step by step</h3><p>After a successful scan choose <strong>View → Field Usage Map</strong>. In the left <strong>Objects</strong> column, search and click an object. The middle <strong>Fields</strong> column then fills with that object's fields. Search there and click one or more fields. Click <strong>Build Map</strong>. The right panel draws the dependency map.</p><p><strong>How to use it:</strong> Read from left to right: selected object → selected field → evidence/source type → component. A source-type node can be clicked to load more detailed evidence. <strong>No dependency detected</strong> means the current successful snapshot contains no detected evidence for that selected field.</p></section><section class="help-manual-section" data-search="field change impact architecture selected field evidence source search"><h3>18. Field Change Impact</h3><p>Open <strong>Architecture Intelligence</strong> and choose the Field Change Impact capability. Select the object and field you are considering changing. Use its search/source controls to inspect persisted Field Usage evidence and identify components that deserve review before a change.</p><p><strong>How to use it:</strong> This is investigation support, not an automatic safe/unsafe decision. The map tells you where evidence was found so an architect or developer can inspect those dependencies.</p></section><section class="help-manual-section" data-search="architecture intelligence overview metrics topology complexity insight"><h3>19. Architecture Intelligence: what it is</h3><p>Choose <strong>View → Architecture Intelligence</strong>. This workspace analyses the current ER model and organises structural evidence into focused sections. It is designed to help you ask architecture questions such as: What is central? What is isolated? How are domains connected? What could sit in the structural neighbourhood of a change?</p><p><strong>How to use it:</strong> Architecture Intelligence analyses the model/evidence available to it. Its metrics and flags are signals for investigation, not design verdicts. Use them to find where to look next.</p></section><section class="help-manual-section" data-search="architecture overview summary metrics objects relationships components cycles hotspots isolated"><h3>20. Architecture Overview and summary</h3><p>The Overview summarises the model so you can orient yourself before drilling down. Depending on the current model, it can surface counts and structural signals such as objects, relationships, connected areas, cycles, hotspots or isolated objects.</p><p><strong>How to use it:</strong> Use Overview first on an unfamiliar model. A high count or highlighted structure is descriptive evidence. Ask why it exists before deciding whether it is good or bad.</p></section><section class="help-manual-section" data-search="topology complexity hotspot isolated connected components graph"><h3>21. Topology, complexity, hotspots and isolated objects</h3><p>Topology describes how objects are connected as a graph. A <strong>hotspot</strong> is an object with comparatively significant structural connectivity in the analysed model. An <strong>isolated object</strong> has no structural connection in that model. Connected components are groups that can reach one another through relationships.</p><p><strong>How to use it:</strong> Hotspot does not mean defective. Isolated does not mean useless. These terms describe graph structure and help you prioritise investigation.</p></section><section class="help-manual-section" data-search="cycle circular relationships architecture graph"><h3>22. Cycles and bounded cycles</h3><p>A cycle exists when relationships form a route that eventually returns to an earlier object. The cycle view helps you see these structural loops without manually tracing every connector.</p><p><strong>How to use it:</strong> A cycle is not automatically an error. Use the evidence to understand coupling, ownership and navigation patterns, especially before structural changes.</p></section><section class="help-manual-section" data-search="path finder source target objects route connected"><h3>23. Relationship Path Finder</h3><p>In Architecture Intelligence open <strong>Relationship Path Finder</strong>. Choose the starting object and destination object, then run the path search. The result shows a relationship route through the current model when one can be found.</p><p><strong>How to use it:</strong> Use it when two objects appear unrelated on a large diagram and you need to know how they are structurally connected. The path is a schema route, not proof that a transaction traverses that exact route at runtime.</p></section><section class="help-manual-section" data-search="object map impact blast radius dependencies neighbourhood external"><h3>24. Object Map and Impact / blast radius</h3><p>Choose an object in <strong>Object Map & Impact</strong>. The view builds its structural neighbourhood and impact evidence from the relationships represented by the model and supported external dependency information.</p><p><strong>How to use it:</strong> <strong>Blast radius</strong> here means the surrounding structural area that deserves investigation if the selected object changes. It is deliberately evidence, not a promise that every neighbour will break.</p></section><section class="help-manual-section" data-search="object usage change readiness references relationship evidence external dependencies"><h3>25. Object Usage and Change Readiness</h3><p>Select an object to inspect how it participates in relationships and, where available, additional cached org-schema references. Use the result as a checklist for change investigation.</p><p><strong>How to use it:</strong> <strong>Change Readiness</strong> should be read as organised evidence that helps prepare a change. It does not replace testing, deployment analysis, security review or knowledge of business processes.</p></section><section class="help-manual-section" data-search="relationship insights direction repeated external target type"><h3>26. Relationship Insights</h3><p>Relationship Insights groups and explains structural relationship evidence: direction, relationship type, repeated relationships and external targets where supported. Use it when the raw ER diagram contains too many connectors to reason about comfortably.</p><p><strong>How to use it:</strong> Repeated or external relationships can be architecturally important because they show concentration or boundaries. They still require human interpretation.</p></section><section class="help-manual-section" data-search="junction many to many object master detail lookup"><h3>27. Junction intelligence</h3><p>Junction intelligence looks for structures that behave like junction objects, which are commonly used to represent many-to-many relationships. Open this section when you want the Studio to call those patterns out rather than finding them manually.</p><p><strong>How to use it:</strong> Inspect the relationships around the identified object to understand why it was classified as junction-like. Treat the result as modelling evidence, especially in unconventional schemas.</p></section><section class="help-manual-section" data-search="show summary hide summary architecture controls buttons insight section"><h3>28. Show Summary and Architecture controls</h3><p><strong>Show Summary</strong> controls whether the architecture summary information is visible in the relevant architecture view. Use it when you want explanatory/context information alongside the diagram; hide it when you need more room for the visual analysis. Section buttons switch the current Architecture Intelligence analysis without changing your ER model.</p><p><strong>How to use it:</strong> These controls change what you are viewing, not the underlying Salesforce schema. If a section has no useful result, check that the current ER model contains the objects/relationships needed for that analysis.</p></section><section class="help-manual-section" data-search="export png mermaid drawio pdf image download files"><h3>29. Export diagram, Mermaid and draw.io</h3><p>Choose <strong>File → Export</strong>. For the diagram image choose the page size and use <strong>Export and Download</strong>. The Studio can also generate Mermaid text and draw.io XML. <strong>Copy Mermaid</strong> puts Mermaid source on the clipboard; <strong>Download .mmd</strong> saves it. <strong>Copy draw.io XML</strong> or <strong>Download .drawio</strong> produces an editable diagrams.net representation.</p><p><strong>How to use it:</strong> Exports are representations of the current model. Check the exported result before treating it as formal documentation, especially after changing layout or model content.</p></section><section class="help-manual-section" data-search="settings schedule automatic scan cron jobs pause resume delete"><h3>30. Field Usage schedules</h3><p>Choose <strong>Settings → Open Settings</strong>. Under <strong>Schedule Configuration</strong>, click <strong>+ Add Schedule</strong>, give it a name, choose hour/minute, enable it and save. Under <strong>Scheduled Jobs</strong>, inspect Studio-owned jobs and use the available Pause, Resume or Delete actions.</p><p><strong>How to use it:</strong> A scheduled scan still needs the Salesforce security and Tooling API configuration described in <strong>Help → Configuration</strong>. Scheduling does not bypass Named Credential or principal access.</p></section><section class="help-manual-section" data-search="theme dark light monokai solarized navigation back diagram workspace"><h3>31. Themes, full-screen workspaces and Back to Diagram</h3><p>Theme is now an application setting rather than a diagram-toolbar control. Open <strong>Settings → Theme</strong>. Choose Dark+, Light+, Monokai or Solarized Light. The selection previews immediately so you can inspect the diagram, Settings and other workspaces. Click <strong>Save Theme</strong> when you want that choice restored on later visits. Dark+ is the default when no preference has been saved.</p><p>Help, Settings, Mimic, Architecture Intelligence and other large features use dedicated workspaces because squeezing them into the diagram canvas would make them difficult to operate. <strong>Back to Diagram</strong> returns to the active modelling session; it does not create a new model or intentionally discard the current one. Theme changes presentation only and do not change Salesforce metadata, diagram DSL or architecture calculations.</p></section><section class="help-manual-section" data-search="reference evidence meaning zero dependency snapshot architecture signal limitations"><h3>32. How to interpret evidence safely</h3><p>Whenever the Studio says <strong>evidence</strong>, <strong>dependency</strong>, <strong>impact</strong>, <strong>hotspot</strong>, <strong>cycle</strong> or <strong>readiness</strong>, read it in the scope of the current model and the data/scanner coverage that produced it. The Studio is designed to make architecture knowledge visible, not to make an irreversible change decision for you.</p><p><strong>How to use it:</strong> Before deleting or changing Salesforce metadata, combine Studio evidence with source review, tests, integrations, reports, security, business ownership and your organisation's normal change process.</p></section><section class="help-manual-section" data-search="troubleshoot error not working configuration named credential refresh save"><h3>33. Troubleshooting: where to start</h3><p>If Field Usage reports credential/authentication errors, go to <strong>Help → Configuration</strong>. If an org object does not appear, check API name and Salesforce access. If Compare with Org reports a missing field unexpectedly, check field visibility. If a view looks stale, re-run the feature's refresh/re-check operation or rebuild the relevant map.</p><p><strong>How to use it:</strong> Do not repeatedly click a failing action. Read the displayed error first. For Field Usage, verify the Named Credential, authenticated principal and permission-set principal access before retrying.</p></section>
<section class="help-manual-section" data-search="settings system information version api namespace environment organisation support"><h3>34. Settings → System Information</h3><p><strong>Purpose:</strong> System Information is the identity card for the running Studio installation. Open <strong>Settings</strong>, then choose <strong>System Information</strong> under SYSTEM. This page is read-only. Merely opening it does not run a Field Usage scan and does not make a Tooling API request.</p><p>The Application area shows the ER Modeller Studio version, default application theme and namespace state. The Salesforce Integration area shows the Tooling API version used by Field Usage, the Salesforce API baseline, environment, Organisation ID and running user. These values are useful when comparing two environments or reporting a problem because they identify exactly where and with which integration baseline the Studio is running.</p><p><strong>Refresh:</strong> click Refresh after an environment or user change. A version such as <code>v60.0</code> describes the API contract used by this Studio build; it is not a statement about every API version available in your Salesforce org.</p></section>
<section class="help-manual-section" data-search="diagnostics health application ready self test run diagnostics configuration required attention"><h3>35. Settings → Diagnostics: application self-test</h3><p>Diagnostics answers a simple operational question: <strong>is this installation in a good state to work?</strong> Open <strong>Settings → Diagnostics</strong> and click <strong>Run Diagnostics</strong>. The Studio opens a dedicated full-screen health-check workspace and shows the processing stages rather than leaving you staring at an inactive button.</p><p>The self-test checks Studio runtime, required Field Usage data access, the latest snapshot state, active Field Usage Batch Apex work, scheduler configuration and the authenticated Tooling API connection. It never launches a Field Usage scan. The Tooling API connection check deliberately performs one lightweight authenticated preflight because configuration cannot be proven merely by looking at a Named Credential name.</p><p>The overall result is <strong>Application Ready</strong>, <strong>Attention Required</strong> or <strong>Configuration Required</strong>. Application Ready means the required checks passed at the time of the test. Attention Required means something deserves review but the diagnostic engine did not classify it as a blocking configuration failure. Configuration Required means at least one required check failed and the failed row should be resolved before relying on all Studio functions.</p></section>
<section class="help-manual-section" data-search="diagnostic passed failed attention information remediation what to do troubleshooting"><h3>36. Reading individual diagnostic results</h3><p>Every diagnostic row contains a check name, state and explanation. <strong>Passed</strong> means the test actually succeeded. <strong>Information</strong> records useful state that is not itself an error, such as no Field Usage snapshot existing yet. <strong>Attention</strong> identifies a condition worth investigating. <strong>Failed</strong> identifies a condition that prevented a required test from succeeding.</p><p>When a failed check has a known recovery path, the row contains <strong>What to do</strong>. Follow that remediation before rerunning diagnostics. For Tooling API failures the manual points you to <strong>Help → Configuration</strong>, because OAuth, Named Credential authentication and External Credential Principal Access are Salesforce Setup concerns rather than something the Studio should silently modify.</p><p>Diagnostics are a point-in-time health check. A successful test does not guarantee that a later Salesforce permission, credential, metadata or platform change cannot alter the state. Use <strong>Run Again</strong> after configuration changes.</p></section>
<section class="help-manual-section" data-search="named credential tooling api diagnostic oauth principal security secrets callout"><h3>37. What the Tooling API diagnostic proves</h3><p>The Tooling API diagnostic uses the same logical connection expected by Field Usage: <code>Salesforce_Tooling_API</code>. A successful result proves that the running context can resolve the Named Credential and complete the small authenticated Tooling API request used by the preflight. This is more meaningful than displaying a green icon merely because configuration metadata exists.</p><p>A failure can mean the Named Credential is missing or inaccessible, the External Credential is not authenticated, principal access is absent, OAuth configuration is invalid, or Salesforce rejected the callout. Diagnostics never display the Consumer Secret, access token, refresh token or other credential material. Do not paste those secrets into support reports or documentation.</p></section>
<section class="help-manual-section" data-search="field usage scan lifecycle discovery tooling work unit snapshot finalizer batch stages"><h3>38. Field Usage scan lifecycle in plain English</h3><p>A Field Usage scan is a background pipeline, not one synchronous button click. The first discovery stage prepares scan work from Salesforce schema information. Tooling discovery then finds supported source components such as Apex classes, Apex triggers and active Flows. Work-unit processing analyses queued work and stores dependency evidence. Formula evidence is also included through the Field Usage scanning pipeline. Finalisation promotes a successful snapshot for later maps and impact analysis.</p><p>Because Batch Apex is asynchronous, you can close the activity screen and return later. Reopening the Field Usage console asks Salesforce for current state and attaches to the active Field Usage job when one exists. The browser is a viewer of the server-side process; closing the browser does not cancel Salesforce Batch Apex.</p></section>
<section class="help-manual-section" data-search="field usage activity console processing batches launch clean console reopen progress"><h3>39. Field Usage Activity console</h3><p>Choose <strong>Diagram → Run Field Usage Scan</strong> to open the activity experience. If a Field Usage job is already active, the Studio should show that running state instead of presenting a second launch action. The console can show the current Batch Apex status and processed/total batch counts obtained from Salesforce runtime state.</p><p><strong>Launch Batch Now</strong> is intended only when no Field Usage batch is active. <strong>Clean Console</strong> is not an operation for changing Salesforce job state; it only concerns displayed console history and is unavailable while processing. Do not interpret closing or cleaning the console as aborting a server-side job.</p></section>
<section class="help-manual-section" data-search="field usage map objects fields dependency map build map select multiple search evidence"><h3>40. Field Usage Map: complete walkthrough</h3><p>The Field Usage Map uses a three-pane layout. The left pane is <strong>Objects</strong>, the middle pane is <strong>Fields</strong>, and the right pane is the dependency map. Search above Objects when the org contains too many objects to scan visually. Click an object to populate the Fields pane. Search the Fields pane to narrow the list, then select the field or fields you want to investigate.</p><p>Click <strong>Build Map</strong> after making the selection. The resulting graph is based on evidence stored by the current successful Field Usage snapshot. A node or relationship on this map is evidence discovered by the supported scanners; absence of a node is not a universal proof that no dependency exists anywhere in Salesforce or in external systems.</p><p>Use zoom controls for navigation rather than changing the model itself. When several fields are selected, keep the question narrow enough that the graph remains understandable. If you are preparing a change, use the map as the start of investigation and then inspect the underlying component/source evidence.</p></section>
<section class="help-manual-section" data-search="field change impact blast radius dependency impact field evidence source component"><h3>41. Field Change Impact: before changing a field</h3><p>Field Change Impact asks what the current Field Usage snapshot knows about a particular field. Select an object and field, then inspect the returned evidence and connected components. Use this before renaming, changing type, restricting values or considering deletion of an established field.</p><p><strong>Blast radius</strong> means the set of things the available evidence indicates may be affected. It is not a guarantee that every connected component will break, and it is not permission to change a field when no evidence is shown. External integrations, dynamically constructed references, reports or unsupported metadata can require separate investigation.</p></section>
<section class="help-manual-section" data-search="data dictionary object fields usage percentage calculate usage filter export excel"><h3>42. Data Dictionary: object and field investigation</h3><p>Open <strong>Data Dictionary</strong> when you need a structured description rather than a topology diagram. Select an object to load its field information. Use object search to find the object quickly and field search/filter controls to narrow large field sets. The dictionary is especially useful during discovery workshops, documentation work and change analysis.</p><p>Field Usage percentages or usage-related indicators should be read in the context in which they were calculated. They are not a universal business-value score. A low percentage does not automatically make a field safe to remove. Export functions are useful for sharing the dictionary with people who do not use the Studio, but exported information is a snapshot and can become stale after Salesforce changes.</p></section>
<section class="help-manual-section" data-search="architecture intelligence overview topology complexity hotspot isolated connected component cycle meaning"><h3>43. Architecture Intelligence: how to read the overview</h3><p>Architecture Intelligence analyses the model currently loaded into the Studio. Start with the overview before drilling into individual objects. <strong>Connected components</strong> identify groups linked by relationships. <strong>Isolated objects</strong> have no relationship path to the rest of the loaded model. <strong>Cycles</strong> identify relationship paths that return to an earlier object. <strong>Hotspots</strong> identify structurally prominent areas according to the Studio's model analysis.</p><p>These are architecture signals, not grades. A hotspot can be completely legitimate. A cycle can be intentional. An isolated object may simply be outside the bounded context represented by the current diagram. Always ask whether the loaded model is complete enough for the question you are trying to answer.</p></section>
<section class="help-manual-section" data-search="object map impact object usage change readiness external dependencies drill down"><h3>44. Object Map, Impact and Change Readiness</h3><p>Select an object in the relevant Architecture Intelligence workspace to inspect its neighbourhood and structural reach. Object Map &amp; Impact helps you see what is immediately connected and what can be reached through relationship paths. Change Readiness combines architecture signals into an investigation aid so that structurally sensitive objects are easier to notice before design work begins.</p><p>Do not treat readiness as an automated approval or rejection. The Studio cannot know every business deadline, data owner, external contract, regulatory constraint or runtime behaviour. Use the result to decide where more evidence is required, not to replace architecture governance.</p></section>
<section class="help-manual-section" data-search="relationship path finder source target shortest path relationship insights junction object"><h3>45. Relationship Path Finder and Relationship Insights</h3><p>Path Finder answers <em>how are these two objects connected in this model?</em> Choose a source object and a target object, then run the path search. The returned path is useful when designing navigation, integration payloads, queries or explaining a model to another person.</p><p>Relationship Insights focuses on the nature and concentration of relationships. Junction intelligence helps identify many-to-many modelling patterns represented through an intermediate object. A detected junction pattern is a structural observation; confirm the intended business semantics before documenting an object as a formal junction object.</p></section>
<section class="help-manual-section" data-search="sharing view heatmap record count owd sharing rules apex sharing runtime evidence"><h3>46. Sharing View and Heatmap</h3><p><strong>Sharing View</strong> overlays sharing-related information onto the model where the Studio has retrieved it. Use it to make security architecture discussions easier, but do not treat the visualisation as a replacement for a complete Salesforce security review. Object permissions, field permissions, role hierarchy, groups, sharing rules, manual sharing and Apex-managed behaviour can interact.</p><p><strong>Heatmap</strong> adds record-volume context to modelled objects. It is useful for spotting where large data volumes may influence design or migration conversations. Record count is not the same as performance cost, business importance or growth rate. The object hover summary can combine information already fetched by these views without creating a new scanner of its own.</p></section>
<section class="help-manual-section" data-search="dsl syntax entity field lookup master detail polymorphic intellisense compile parser editor"><h3>47. DSL editor: working safely with the textual model</h3><p>The DSL is the textual representation of the ER model. An entity declaration defines an object and its fields; relationship-capable field types describe how objects connect. IntelliSense suggestions help reduce typing and API-name mistakes. The visual canvas and DSL are two views of the same modelling intent, so editing text can rebuild visual geometry and visual operations can update the textual model.</p><p>When editing manually, make small changes and watch for parser or validation feedback. A syntax error can prevent the Studio from understanding the intended model. Save only after confirming the canvas represents what you meant. The DSL describes the Studio model; it does not by itself deploy Salesforce metadata.</p></section>
<section class="help-manual-section" data-search="mimic new er hypothetical custom object field lookup master detail generate"><h3>48. Mimic New ER: design without changing Salesforce</h3><p>Mimic New ER is the point-and-click modeller for hypothetical custom data models. Add an object, add fields, choose field types and select relationship targets. Mimic automatically applies the custom API suffix rules described on the screen. Relationship fields target the Salesforce Id of another mimicked object.</p><p>Click <strong>Generate Model</strong> when the form represents your idea. The Studio converts the form into its ER DSL and opens the result on the normal canvas. This is modelling only: Mimic does not create custom objects, fields or relationships in the Salesforce org.</p></section>
<section class="help-manual-section" data-search="export png pdf mermaid drawio excel files architecture report documentation"><h3>49. Exporting and sharing Studio results</h3><p>Use export when you need a durable artefact outside the interactive workspace. Diagram export supports image-oriented output and interchange/documentation formats such as Mermaid and draw.io where offered. Architecture reporting can produce architecture-oriented exports from the current analysis. Data Dictionary export is intended for tabular documentation.</p><p>Before sharing an export, confirm that the active model and snapshot are the ones you intended to document. An exported architecture picture does not automatically update when the Salesforce org changes. Treat exports as dated evidence and regenerate them after material model changes.</p></section>
<section class="help-manual-section" data-search="settings schedule automatic field usage hour minute enabled scheduled jobs pause resume delete"><h3>50. Settings → Field Usage schedules</h3><p>Open <strong>Settings → Schedule Settings</strong>. In <strong>Schedule Configuration</strong>, add only the automatic scans your organisation actually wants. Give each schedule a recognisable name, choose hour and minute, decide whether it is enabled, then click <strong>Save Changes</strong>. Studio does not need hidden default schedules.</p><p>Open the <strong>Scheduled Jobs</strong> tab to inspect Studio-owned Field Usage scheduled jobs. Refresh to read current job information. Pause when you want to retain a schedule definition without allowing it to run, Resume to reactivate it, and Delete only when the schedule is no longer required. Scheduling controls future scans; they do not retroactively alter an existing snapshot.</p></section>
<section class="help-manual-section" data-search="settings theme dark light monokai solarized save theme default black"><h3>51. Settings → Theme</h3><p>Open <strong>Settings → Theme</strong>. Dark+ is the default black theme for users who have no saved preference. Selecting another theme previews it immediately across the Studio. Click <strong>Save Theme</strong> to persist the choice. If saving fails, the preview can still remain for the current session, so read the Settings message rather than assuming the preference was stored.</p><p>The theme changes visual presentation only. It does not alter diagrams, Salesforce data, metadata, Field Usage evidence or architecture results.</p></section>
<section class="help-manual-section" data-search="workflow beginner first day tutorial create import save dictionary architecture field usage"><h3>52. First-day workflow for a new user</h3><p>If you have never used the Studio, use this sequence: create a new diagram; import two or three familiar Salesforce objects; drag/reposition them; inspect their fields and relationships; save the diagram; close and reopen it; open Data Dictionary; then open Architecture Intelligence. Only after those basics make sense should you move into Field Usage evidence and change-impact investigation.</p><p>This sequence deliberately separates <strong>modelling</strong> from <strong>org-wide evidence collection</strong>. You can learn the canvas without running Field Usage. When you are ready for Field Usage, ask an administrator to complete Help → Configuration, run Settings → Diagnostics, and only then launch the first scan.</p></section>
<section class="help-manual-section" data-search="architect workflow change investigation before change dependency path dictionary evidence governance"><h3>53. Suggested workflow for change investigation</h3><p>Start with the object or field being changed. Use Data Dictionary to understand its definition. Use the ER model and Architecture Intelligence to understand structural context. Use Field Usage Map or Field Change Impact for persisted dependency evidence. Use Path Finder when the question involves connectivity between objects. Export evidence when it needs to accompany an architecture or change record.</p><p>Then leave the Studio where appropriate: inspect source code, integration contracts, reports, permissions, tests and business ownership. The strongest use of the Studio is to reduce architectural blind spots before change, not to claim that one visualisation contains every fact about an enterprise Salesforce estate.</p></section>
<section class="help-manual-section" data-search="glossary object field relationship lookup master detail polymorphic dependency evidence snapshot hotspot cycle blast radius"><h3>54. Plain-English glossary</h3><p><strong>Object:</strong> a Salesforce data structure such as Account or a custom object. <strong>Field:</strong> one piece of data on an object. <strong>Relationship:</strong> a field/structure connecting records or objects. <strong>Lookup:</strong> a relationship where the referenced record is generally independent. <strong>Master-Detail:</strong> a stronger parent-child relationship with Salesforce platform semantics. <strong>Polymorphic:</strong> a relationship that can refer to more than one object type.</p><p><strong>Dependency evidence:</strong> a stored observation that a supported component references a field. <strong>Snapshot:</strong> the promoted result of a Field Usage scan at a point in time. <strong>Hotspot:</strong> a structurally prominent area identified by architecture analysis. <strong>Cycle:</strong> a relationship path that loops back. <strong>Blast radius:</strong> the area the available evidence suggests may be touched by a change. <strong>Connected component:</strong> a group of objects connected to one another within the loaded model.</p></section>
<section class="help-manual-section" data-search="limitations dynamic apex external integration reports unsupported metadata false negative no dependency"><h3>55. Important limitations and responsible interpretation</h3><p>No static architecture tool can prove the absence of every runtime or external dependency. Dynamic Apex, constructed strings, middleware, external applications, reports, analytics, unsupported metadata and human processes can sit outside a particular scanner's evidence. Therefore <strong>No dependency detected</strong> means no dependency was detected within the evidence and coverage available to that feature; it must not be rewritten mentally as <em>this field is safe to delete</em>.</p><p>Similarly, architecture metrics describe the loaded model, not an objective score of whether the organisation's architecture is good or bad. Use the Studio to ask better questions, find evidence faster and document what you know. Keep normal peer review, testing, security review and change governance.</p></section>
<section class="help-manual-section" data-search="support diagnostic report troubleshooting reproduce version system information configuration"><h3>56. Before raising a support issue</h3><p>First reproduce the problem once and capture the exact user-visible error. Open <strong>Settings → System Information</strong> and note Studio version, API baseline, environment and namespace state. Then run <strong>Settings → Diagnostics</strong>. If a check fails, follow its remediation and rerun it.</p><p>For Field Usage authentication issues, compare the failure with <strong>Help → Configuration</strong>. Never include OAuth secrets or tokens in a support message. For a visual/model issue, record which diagram was open, which workspace/control you used and whether the issue survives a refresh/reopen. This information is far more useful than saying only that the application is not working.</p></section></article></template>
                </main>
            </div>
        </section>
    </template>

    <!-- MIMIC NEW ER -->
    <template if:true={mimicOpen}>
        <div class="mimic-page">
            <header class="mimic-head"><div><span>POINT AND CLICK MODELLER</span><h1>Mimic New ER</h1><p>Design a hypothetical Salesforce data model without creating metadata in the org. Generate converts this form into the existing ER DSL and opens it on the normal canvas.</p><div class="mimic-custom-disclaimer"><strong>Custom objects and fields only</strong><span>Enter only the base API name, for example Project or Status. Mimic automatically adds __c to every object and field when generating the DSL. If you type __c or anything beginning with __, that suffix is discarded and Mimic applies __c itself. It does not create or modify metadata in your org.</span></div></div><button class="mimic-close" onclick={handleCloseMimic}>Back to Diagram</button></header>
            <main class="mimic-body">
                <section class="mimic-model-name"><label>Model name</label><input value={mimicModelName} oninput={handleMimicModelName} placeholder="Mimicked Model"/></section>
                <div class="mimic-section-title"><div><h2>Objects and fields</h2><p>Add the objects you want to model, then describe their fields.</p></div><button onclick={handleMimicAddObject}>+ Add Object</button></div>
                <template for:each={mimicObjectsView} for:item="obj">
                    <article class="mimic-object" key={obj.id}><div class="mimic-object-head"><input data-id={obj.id} value={obj.name} oninput={handleMimicObjectName} placeholder="Object name, e.g. Subscription"/><button data-id={obj.id} onclick={handleMimicRemoveObject}>Remove object</button></div>
                    <div class="mimic-field-labels"><span>Field name</span><span>Salesforce field type</span><span></span></div>
                    <template for:each={obj.fields} for:item="field"><div class="mimic-field" key={field.id}><input data-object={obj.id} data-field={field.id} value={field.name} oninput={handleMimicFieldName} placeholder="Field name, e.g. Status" disabled={field.locked}/><template if:true={field.locked}><div class="mimic-id-type">Salesforce Record ID</div></template><template if:false={field.locked}><select data-object={obj.id} data-field={field.id} value={field.type} onchange={handleMimicFieldType}><template for:each={mimicFieldTypeOptions} for:item="type"><option key={type} value={type}>{type}</option></template></select></template><template if:true={field.isRelationship}><select class="mimic-target" data-object={obj.id} data-field={field.id} value={field.target} onchange={handleMimicFieldTarget}><template for:each={field.targetOptions} for:item="target"><option key={target.value} value={target.value}>{target.label}</option></template></select></template><template if:false={field.isRelationship}><span></span></template><button data-object={obj.id} data-field={field.id} onclick={handleMimicRemoveField} disabled={field.locked}>×</button></div></template>
                    <button class="mimic-add-field" data-id={obj.id} onclick={handleMimicAddField}>+ Add Field</button></article>
                </template>
