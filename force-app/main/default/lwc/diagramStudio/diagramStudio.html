                    <template if:true={architecturePathReady}><div class="arch-path-result"><template if:true={architecturePathFound}><strong>{architecturePathResult.hops} hop shortest path</strong></template><p>{architecturePathText}</p></div><template if:true={architecturePathFound}><div class="arch-path-diagram-wrap"><div class="arch-path-diagram"><template for:each={architecturePathVisual} for:item="step"><div class="arch-path-step" key={step.key}><div class="arch-path-node"><span>OBJECT {step.step}</span><strong>{step.name}</strong></div><template if:true={step.hasArrow}><div class={step.edgeClass}><span class="arch-path-edge-label">{step.kind}</span><div class="arch-path-edge-line"></div><span class="arch-path-arrow">→</span><template if:true={step.fieldName}><small>{step.fieldName}</small></template></div></template></div></template></div></div><div class="arch-path-legend"><span class="arch-path-legend-lookup">Lookup</span><span class="arch-path-legend-master">Master Detail</span><span class="arch-path-legend-poly">Polymorphic</span></div></template></template>
                </section>
                <section class="arch-section arch-workspace arch-workspace-relationships">
                    <div class="arch-section-head"><span>Relationship Analysis</span><span class="arch-section-hint">How objects depend on each other</span></div>
                    <div class="arch-rel-explain"><h3>How to read this view</h3><p>{architectureRelationshipExplanation}</p><div class="arch-rel-type-guide"><div><strong>Lookup</strong><span>A reference from one object to another. Review it when understanding dependency, reporting joins and change impact.</span></div><div><strong>Master Detail</strong><span>A stronger parent child relationship. The parent participates in ownership semantics and can influence lifecycle behaviour.</span></div><div><strong>Polymorphic</strong><span>A relationship whose target can vary across supported object types. Treat it as a broader dependency when reasoning about the model.</span></div></div></div>
                    <div class="arch-rel-graph-scroll"><div class="arch-rel-graph" style={architectureRelationshipGraphStyle}><template for:each={architectureRelationshipGraphEdges} for:item="e"><div key={e.key} class={e.className} style={e.style} title={e.title}></div></template><template for:each={architectureRelationshipGraphNodes} for:item="n"><button key={n.key} class="arch-rel-graph-node" style={n.style} data-name={n.name} onclick={handleArchitectureObjectSelect}><strong>{n.name}</strong><small>{n.degree} relationships</small></button></template></div></div>
                    <div class="arch-rel-legend"><span class="arch-rel-lookup">Lookup</span><span class="arch-rel-master">Master Detail</span><span class="arch-rel-poly">Polymorphic</span></div>
                    <div class="arch-rel-deep-summary">
                        <div class="arch-section-head"><span>Relationship Detail</span><span class="arch-section-hint">Every relationship represented by the current ER file</span></div>
                        <p class="arch-domain-help">This section explains dependency direction and the architectural consequences of changing or deleting records. Record deletion behaviour is described conservatively from relationship semantics only; Flow, Apex, triggers, validation, integrations and live data are not inferred.</p>
                        <div class="arch-rel-detail-list">
                            <template for:each={architectureRelationshipSummaryRows} for:item="r">
                                <article class="arch-rel-detail-card" key={r.key}>
                                    <div class="arch-rel-detail-head"><strong>{r.child}.{r.field}</strong><span class="arch-tag">{r.kind}</span></div>
                                    <div class="arch-rel-route"><b>{r.child}</b><span>→</span><b>{r.parent}</b></div>
                                    <p><b>Dependency:</b> {r.dependencyText}. Target scope: {r.parentScope}.</p>
                                    <p><b>Record deletion impact:</b> {r.recordImpact}</p>
                                    <p><b>Schema/change impact:</b> {r.changeImpact}</p>
                                </article>
                            </template>
                        </div>
                    </div>
                    <div class="arch-rel-object-summary">
                        <div class="arch-section-head"><span>Object Dependency Summary</span><span class="arch-section-hint">Current diagram dependency inventory by object</span></div>
                        <div class="arch-rel-detail-list">
                            <template for:each={architectureObjectDependencySummaries} for:item="o">
                                <article class="arch-rel-detail-card" key={o.key}>
                                    <div class="arch-rel-detail-head"><strong>{o.name}</strong><span>{o.outgoingCount} outbound · {o.incomingCount} inbound</span></div>
                                    <p><b>Depends on:</b> {o.dependsOn}</p>
                                    <p><b>Depended on by:</b> {o.dependedOnBy}</p>
                                    <p><b>Explicit external targets:</b> {o.externalText}</p>
                                </article>
                            </template>
                        </div>
                    </div>
                    <div class="arch-junction-explain"><h3>Junction Intelligence</h3><p>{architectureJunctionExplanation}</p></div>
                    <template if:true={architectureHasJunctions}><div class="arch-junction-grid"><template for:each={architectureJunctionInsights} for:item="j"><div class="arch-junction-card arch-junction-insight" key={j.name}><div><strong>{j.name}</strong><span class="arch-tag">{j.reviewLabel}</span></div><p class="arch-junction-evidence"><b>Evidence:</b> {j.distinctTargets} parent targets · {j.outboundRelationships} outbound relationships · {j.masterDetailRelationships} Master Detail</p><p><b>What it means:</b> {j.meaning}</p><p class="arch-junction-suggestion"><b>Architect review:</b> {j.suggestion}</p></div></template></div></template>
                    <template if:false={architectureHasJunctions}><div class="arch-empty arch-empty-small">No multi-parent junction candidates detected in the current model.</div></template>
                </section>
                

                <template if:true={architectureShowFieldImpact}>
                    <section class="arch-field-impact">
                        <div class="afi-head"><div><div class="arch-brief-label">FIELD CHANGE IMPACT</div><h2>Visualise what a field change could affect</h2><p>Objects are scoped to the current ER model. Dependency evidence comes from the latest successful Field Usage snapshot.</p></div><div class="afi-head-actions"><button class="arch-action-btn" onclick={handleFieldImpactClear}>Clear</button><button class="arch-action-btn" onclick={handleFieldImpactBack}>Back to Architecture Intelligence</button></div></div>
                        <template if:true={fieldImpactLoading}><div class="afi-empty"><strong>Checking Field Usage snapshot…</strong><p>Please wait while Architecture Intelligence checks the persisted dependency index.</p></div></template>
                        <template if:true={fieldImpactWaitingForBatch}><div class="afi-empty afi-empty-running"><strong>Field Usage scan is currently running.</strong><p>Architecture Intelligence is building the dependency snapshot now. There is nothing else you need to launch. Please come back after the batch completes successfully; this message will disappear and Field Change Impact will open with the new snapshot.</p><button class="arch-action-btn" onclick={handleFieldImpactBack}>Back to Architecture Intelligence</button></div></template>
                        <template if:true={fieldImpactEmpty}><div class="afi-empty afi-empty-warning"><strong>Field Change Impact needs a Field Usage snapshot.</strong><p>No scan is currently running and there is no successful snapshot to analyse. Open Settings → Field Usage and run the scan there. After it completes successfully, return here and the object, field and impact-map tools will appear automatically.</p><button class="arch-action-btn arch-export-btn" onclick={handleFieldImpactOpenSettings}>Open Field Usage Settings</button></div></template>
                        <template if:true={fieldImpactReady}>
                            <div class="afi-usage-search"><div class="afi-search-title"><div><strong>Search Field Usage</strong><p>Search the latest snapshot across formula fields, Flow, Apex, triggers, OmniStudio and any other indexed source type.</p></div><button class="arch-action-btn" onclick={handleFieldImpactSearchClear}>Clear Search</button></div><div class="afi-search-controls"><input type="search" value={fieldImpactUsageSearch} oninput={handleFieldImpactUsageSearch} placeholder="Field, object, formula, flow, class, trigger, component or evidence…"/><select onchange={handleFieldImpactSourceType}><template for:each={fieldImpactSourceOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select><button class="arch-action-btn arch-export-btn" onclick={handleFieldImpactUsageSearchRun}>Search Usage</button></div><template if:true={fieldImpactSearchBusy}><div class="afi-search-status">Searching persisted snapshot…</div></template><template if:true={fieldImpactHasSearchResults}><div class="afi-results"><div class="afi-result afi-result-head"><span>Field</span><span>Source</span><span>Component</span><span>Evidence location</span><span>Uses</span></div><template for:each={fieldImpactSearchRows} for:item="r"><div class="afi-result" key={r.key}><span>{r.field}</span><span>{r.source}</span><span>{r.component}</span><span>{r.location}</span><span>{r.count}</span></div></template></div></template></div>
                            <div class="afi-picker">
                                <div><label>Search object</label><input type="search" value={fieldImpactObjectSearch} oninput={handleFieldImpactObjectSearch} placeholder="Search objects in current ER model…"/><label>Select object</label><select onchange={handleFieldImpactObject}><option value="">Choose object…</option><template for:each={fieldImpactFilteredObjects} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></div>
                                <div><label>Search field</label><input type="search" value={fieldImpactFieldSearch} oninput={handleFieldImpactFieldSearch} placeholder="Search fields…"/><label>Select field</label><select onchange={handleFieldImpactField}><option value="">Choose field…</option><template for:each={fieldImpactFilteredFields} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></div>
                                <div class="afi-zoom"><span>Map zoom</span><button class="arch-action-btn" onclick={handleFieldImpactZoomOut}>−</button><button class="arch-action-btn" onclick={handleFieldImpactZoomReset}>100%</button><button class="arch-action-btn" onclick={handleFieldImpactZoomIn}>+</button></div>
                            </div>
                            <template if:true={fieldImpactNoReferences}><div class="afi-search-status"><strong>No dependency detected in current snapshot.</strong> The map below records zero persisted dependency evidence for this field; it does not claim the field can never be used outside the sources covered by the successful scan.</div></template>
                            <template if:true={fieldImpactHasMap}><div class="afi-map-scroll"><div class="afi-map-canvas" style={fieldImpactCanvasStyle}><svg class="afi-map-edges"><template for:each={fieldImpactEdges} for:item="e"><path key={e.key} d={e.path}></path></template></svg><template for:each={fieldImpactNodes} for:item="n"><article key={n.key} class="afi-node" data-kind={n.kind} data-field={n.field} data-source={n.source} style={n.style} onclick={handleFieldImpactNodeClick}><strong>{n.label}</strong><span>{n.sub}</span></article></template></div></div></template>
                        </template>
                    </section>
                </template>
                <div class="arch-boundary"><strong>Scope:</strong> data-model architecture only. Permissions, CRUD/FLS, vulnerability and security-posture analysis remain outside ER Modeller Studio.</div>
            </template>
            <template if:true={architectureShowEmpty}><div class="arch-empty">Add or import objects to the diagram to analyse its architecture.</div></template>
        </div>
    </template>

    <!-- DATA DICTIONARY -->
    <template if:true={dictionaryOpen}>
        <div class={dictionaryPanelClass}>
            <div class="dict-header">
                <div class="dict-header-actions">
                    <button class="dict-back-btn" onclick={handleCloseDictionary} title="Return to the ER canvas">&#8592; Back to Diagram</button>
                    <span class="dict-title">Data Dictionary</span>
                </div>
                <div class="dict-header-actions">
                    <button class="dsl-head-btn" onclick={handleToggleDictionaryFullScreen}>{dictionaryFullScreenLabel}</button>
                    <button class="modal-close" onclick={handleCloseDictionary}>x</button>
                </div>
            </div>
            <div class="dict-body">
                <!-- Left: object list -->
                <div class="dict-list-pane">
                    <input type="text"
                           class="dict-search-input"
                           placeholder="Search objects..."
                           value={dictionarySearch}
                           oninput={handleDictionarySearchInput} />
                    <p class="dict-list-count">{dictionaryObjectCount} objects</p>
                    <div class="dict-obj-list">
                        <template for:each={dictionaryObjectList} for:item="o">
                            <div key={o.name} class={o.rowClass} data-name={o.name} onclick={handleSelectDictionaryObject}>{o.name}</div>
                        </template>
                    </div>
                    <div class="dict-list-footer">
                        <button class="tb-btn tb-btn-primary" disabled={dictionaryExportAllBusy} onclick={handleExportAllDictionary}>Export All to Excel</button>
                        <template if:true={dictionaryExportAllBusy}>
                            <p class="dict-export-progress">{dictionaryExportAllProgress}</p>
                        </template>
                        <p class="hint-text">Bulk export includes every field's metadata but not % Used — that's a live data scan, run per-object only, to keep bulk export fast and safe.</p>
                    </div>
                </div>

                <!-- Right: selected object detail -->
                <div class="dict-detail-pane">
                    <template if:false={dictionaryHasSelection}>
                        <div class="dict-empty-state">
                            <p class="hint-text">Select an object on the left to see its field-level detail here.</p>
                        </div>
                    </template>
                    <template if:true={dictionaryLoading}>
                        <p class="hint-text">Loading {dictionarySelectedObject}...</p>
                    </template>
                    <template if:true={dictionaryHasSelection}>
                        <div class="dict-detail-head">
                            <div>
                                <span class="dict-detail-title">{dictionaryRow.apiName}</span>
                                <span class="dict-detail-sub">{dictionaryRow.label} &middot; {dictionaryObjectTypeText} &middot; {dictionaryFieldCount} fields</span>
                            </div>
                            <div class="dict-detail-actions">
                                <button class="dsl-head-btn dict-intelligence-launch" onclick={handleDictionaryIntelligenceToggle}>Expand Intelligence</button>
                                <button class="dsl-head-btn" onclick={handleClearDictionarySelection} title="Clear this object's field list on the right — does not touch the canvas">Clear Selection</button>
                                <button class="dsl-head-btn" disabled={dictionaryUsagePending} onclick={handleCalculateUsage}>{dictionaryCalcUsageLabel}</button>
                                <button class="dsl-head-btn" onclick={handleExportDictionaryCsv}>Export CSV</button>
                                <button class="dsl-head-btn" disabled={dictionaryExportBusy} onclick={handleExportDictionaryXlsx}>Export Excel</button>
                            </div>
                        </div>
                        <section class="dict-fields-primary"><div class="dict-primary-title"><div><span class="dict-intel-kicker">ALL FIELDS</span><strong>Field Dictionary</strong></div><span>{dictionaryVisibleFieldCount} of {dictionaryFieldCount} fields</span></div><div class="dict-field-tools">
                            <input class="dict-search-input dict-field-search" type="text" placeholder="Search fields, labels, descriptions, types or relationship targets..." value={dictionaryFieldSearch} oninput={handleDictionaryFieldSearch}/>
                            <select class="arch-select dict-field-filter" value={dictionaryFieldFilter} onchange={handleDictionaryFieldFilter}><template for:each={dictionaryFilterOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select>
                            <span class="dict-visible-count">{dictionaryVisibleFieldCount} fields shown</span>
                        </div>
                                                <div class="dict-table-wrap">
                            <table class="dict-table">
                                <thead>
                                    <tr>
                                        <th class={dictSortClassApiName} data-column="apiName" onclick={handleSortDictionary}>Field API Name{dictSortArrowApiName}</th>
                                        <th>Label</th>
                                        <th>Description</th>
                                        <th>Data Type</th>
                                        <th class={dictSortClassRequired} data-column="required" onclick={handleSortDictionary}>Required{dictSortArrowRequired}</th>
                                        <th class={dictSortClassCustom} data-column="isCustom" onclick={handleSortDictionary}>Custom{dictSortArrowCustom}</th>
                                        <th>PK</th>
                                        <th>FK</th>
                                        <th>FK To</th>
                                        <th>Last Modified</th>
                                        <th>% Used</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={dictionaryFieldRows} for:item="f">
                                        <tr key={f.key} class={f.rowClass}>
                                            <td><button class="arch-object-link" data-name={f.apiName} onclick={handleDictionaryFieldSelect}>{f.apiName}</button></td>
                                            <td>{f.label}</td>
                                            <td>{f.description}</td>
                                            <td>{f.dataType}</td>
                                            <td>{f.requiredText}</td>
                                            <td>{f.customText}</td>
                                            <td>{f.pkText}</td>
                                            <td>{f.fkText}</td>
                                            <td>{f.fkTarget}</td>
                                            <td>{f.lastModified}</td>
                                            <td>{f.usageText}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div></section><template if:true={dictionaryIntelligenceExpanded}>
                            <section class="dict-intelligence-workspace">
                                <div class="dict-intelligence-workspace-head">
                                    <div><span class="dict-intel-kicker">OBJECT INTELLIGENCE</span><strong>{dictionaryRow.apiName}</strong><p>Metadata evidence and field population insight for the selected object.</p></div>
                                    <button class="dsl-head-btn" onclick={handleDictionaryIntelligenceToggle}>Back to Data Dictionary</button>
                                </div>
                                <div class="dict-intelligence-workspace-body">
                                    <c-object-architecture-health
                                        object-api-name={dictionarySelectedObject}
                                        fields={dictionaryFieldRows}>
                                    </c-object-architecture-health>
                                    <section class="dict-wow-hero"><span class="dict-intel-kicker">OBJECT AT A GLANCE</span><h2>{dictionaryIntelligenceHeadline}</h2></section>
                                    <div class="dict-wow-grid">
                                        <section class="dict-wow-card"><div class="dict-wow-title"><strong>Field composition</strong><span>Standard versus custom extension</span></div><template for:each={dictionaryComposition} for:item="row"><div class="dict-wow-bar-row" key={row.key}><div><span>{row.label}</span><strong>{row.count}</strong></div><div class="dict-wow-track"><i style={row.width}></i></div></div></template></section>
                                        <section class="dict-wow-card"><div class="dict-wow-title"><strong>Documentation coverage</strong><span>Custom field descriptions</span></div><template for:each={dictionaryDocumentationLandscape} for:item="row"><div class="dict-wow-bar-row" key={row.key}><div><span>{row.label}</span><strong>{row.count}</strong></div><div class="dict-wow-track"><i style={row.width}></i></div></div></template></section>
                                    </div>
                                    <div class="dict-summary-grid"><template for:each={dictionaryObjectSummary} for:item="m"><div class="dict-summary-card" key={m.label}><strong>{m.value}</strong><span>{m.label}</span></div></template></div>
                                    <div class="dict-findings"><template for:each={dictionaryMetadataFindings} for:item="f"><article class="dict-finding" key={f.key}><span class="arch-tag">{f.kind}</span><div><strong>{f.title}</strong><p>{f.detail}</p></div></article></template></div>
                                    <template if:true={dictionaryHasUsageSummary}><div class="dict-usage-summary"><div class="dict-mini-title">Field population profile</div><div class="dict-summary-grid"><template for:each={dictionaryUsageSummary} for:item="u"><div class="dict-summary-card" key={u.label}><strong>{u.value}</strong><span>{u.label}</span></div></template></div></div></template>
                                    <template if:true={dictionaryHasRelationships}><div class="dict-rel-summary"><div class="dict-mini-title">Relationship context</div><div class="dict-rel-grid"><template for:each={dictionaryRelationshipRows} for:item="rel"><div class="dict-rel-card" key={rel.key}><strong>{rel.field}</strong><span>{rel.type}</span><p>Target: {rel.target}</p></div></template></div></div></template>
                                </div>
                            </section>
                        </template>

                        <template if:true={dictionaryArchaeologistOpen}>
                            <section class={dictionaryArchaeologistClass}>
                                <div class="dict-archaeologist-head"><div><span class="dict-intel-kicker">DATA MODEL ARCHAEOLOGIST</span><strong>{dictionaryRow.apiName}</strong><p>Evidence from metadata already loaded by the Data Dictionary. No Tooling API or external API calls.</p></div><button class="modal-close" onclick={handleCloseDictionaryArchaeologist}>x</button></div>
                                <div class="dict-archaeology-facts"><template for:each={dictionaryArchaeologyFacts} for:item="fact"><article key={fact.key}><span>{fact.label}</span><strong>{fact.value}</strong><p>{fact.detail}</p></article></template></div>
                                <div class="dict-archaeology-section"><div class="dict-archaeology-title"><strong>Field families</strong><span>Repeated business concepts found in field names and labels. Select one to inspect those fields.</span></div><template if:true={dictionaryHasFieldFamilies}><div class="dict-family-grid"><template for:each={dictionaryFieldFamilies} for:item="family"><button key={family.key} class="dict-family-card" data-token={family.filter} onclick={handleDictionaryFamilySelect}><span>{family.label}</span><strong>{family.count} fields</strong><small>{family.fields}</small></button></template></div></template></div>
                                <div class="dict-archaeology-columns">
                                    <div class="dict-archaeology-section"><div class="dict-archaeology-title"><strong>Relationship concentration</strong><span>Repeated relationship references by target object.</span></div><div class="dict-landscape"><template for:each={dictionaryRelationshipConcentration} for:item="rel"><div key={rel.key} class="dict-landscape-row"><span>{rel.target}</span><strong>{rel.count}</strong></div></template></div></div>
                                    <div class="dict-archaeology-section"><div class="dict-archaeology-title"><strong>Possible semantic overlap</strong><span>Same normalised labels or names. Evidence for review, not a duplicate claim.</span></div><template if:true={dictionaryHasPossibleOverlaps}><div class="dict-overlap-list"><template for:each={dictionaryPossibleOverlaps} for:item="item"><article key={item.key}><strong>{item.label}</strong><span>{item.count} fields</span><p>{item.fields}</p></article></template></div></template></div>
                                </div>
                            </section>
                        </template>
                        <template if:true={dictionaryHasFieldDetail}>
                            <c-data-dictionary-field-detail
                                object-api-name={dictionarySelectedObject}
                                field-api-name={dictionaryFieldDetail.apiName}
                                field={dictionaryFieldDetail}
                                onclose={handleDictionaryFieldDrillClose}>
                            </c-data-dictionary-field-detail>
                        </template>
                    </template>
                </div>
            </div>
        </div>
    </template>
</div>
</template>
