<template>
<div class={rootClass}>

    <!-- CONTEXT MENU -->
    <template if:true={ctxMenu}>
        <div class="ctx-menu" style={ctxMenuStyle}>
            <div class="ctx-item" onclick={handleCtxOpen}>Open</div>
            <div class="ctx-item" onclick={handleCtxDuplicate}>Duplicate</div>
            <div class="ctx-divider"></div>
            <div class="ctx-item ctx-danger" onclick={handleCtxDelete}>Delete</div>
        </div>
    </template>

    <!-- OBJECT SUMMARY HOVER CARD -->
    <template if:true={hoverCard}>
        <div class="hover-card" style={hoverCard.style}>
            <div class="hover-card-title">{hoverCard.name}</div>
            <div class="hover-card-sub">{hoverCard.objectTypeText} &middot; {hoverCard.fieldCount} fields</div>
            <div class="hover-card-divider"></div>

            <div class="hover-card-row">
                <span class="hover-card-label">Records</span>
                <template if:true={hoverCard.hasRecordData}>
                    <span class="hover-card-value">{hoverCard.recordCountText}</span>
                </template>
                <template if:false={hoverCard.hasRecordData}>
                    <span class="hover-card-hint">Turn on Heatmap to see this</span>
                </template>
            </div>
            <template if:true={hoverCard.recordFreshnessText}>
                <div class="hover-card-row">
                    <span class="hover-card-label"></span>
                    <span class="hover-card-freshness">{hoverCard.recordFreshnessText}</span>
                </div>
            </template>

            <div class="hover-card-row">
                <span class="hover-card-label">Internal Sharing</span>
                <template if:true={hoverCard.hasSharingData}>
                    <span class="hover-card-value">{hoverCard.internalSharingText}</span>
                </template>
                <template if:false={hoverCard.hasSharingData}>
                    <span class="hover-card-hint">Turn on Sharing View to see this</span>
                </template>
            </div>
            <template if:true={hoverCard.hasSharingData}>
                <div class="hover-card-row">
                    <span class="hover-card-label">External Sharing</span>
                    <span class="hover-card-value">{hoverCard.externalSharingText}</span>
                </div>
                <template if:true={hoverCard.hasSharingSignalData}>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Sharing Rules</span>
                        <span class="hover-card-value">{hoverCard.sharingRuleText}</span>
                    </div>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Apex Sharing</span>
                        <span class="hover-card-value">{hoverCard.apexSharingText}</span>
                    </div>
                </template>
                <template if:false={hoverCard.hasSharingSignalData}>
                    <div class="hover-card-row">
                        <span class="hover-card-label">Sharing Rules / Apex Sharing</span>
                        <span class="hover-card-hint">No sharing data for this object</span>
                    </div>
                </template>
            </template>
        </div>
    </template>

    <!-- SETTINGS WORKSPACE -->
    <template if:true={settingsOpen}>
        <section class="settings-page">
            <header class="settings-head">
                <div><span class="settings-kicker">ER MODELLER STUDIO</span><h1>Settings</h1><p>Operate Field Usage, inspect the environment, run diagnostics and configure appearance.</p></div>
                <button class="mimic-close" onclick={handleCloseSettings}>Back to Diagram</button>
            </header>
            <div class="settings-shell">
                <aside class="settings-nav">
                    <div class="settings-nav-group">FIELD USAGE</div>
                    <button class={settingsScheduleNavClass} onclick={handleSettingsScheduleSection}>Field Usage</button>
                    <div class="settings-nav-group">SYSTEM</div>
                    <button class={settingsSystemNavClass} onclick={handleSettingsSystemSection}>System Information</button>
                    <button class={settingsDiagnosticsNavClass} onclick={handleSettingsDiagnosticsSection}>Diagnostics</button>
                    <div class="settings-nav-group">APPEARANCE</div>
                    <button class={settingsThemeNavClass} onclick={handleSettingsThemeSection}>Theme</button>
                </aside>
                <main class="settings-content">
                    <template if:true={settingsScheduleSectionOpen}>
                        <c-field-usage-settings></c-field-usage-settings>
                    </template>
                    <template if:true={settingsSystemSectionOpen}>
                        <div class="settings-title"><div><h2>System Information</h2><p>Read-only Studio, Salesforce environment, architecture and Field Usage health information.</p></div><button class="arch-action-btn" onclick={loadSystemInfo}>Refresh</button></div>
                        <template if:true={systemInfoBusy}><div class="settings-loading">Reading system information…</div></template>
                        <section class="settings-panel system-info-panel">
                            <div class="settings-panel-head"><div><h3>Application &amp; Environment</h3><p>Useful when identifying the Studio build or raising a support issue.</p></div></div>
                            <div class="system-info-grid">
                                <div><span>ER Modeller Studio</span><strong>Version {systemStudioVersion}</strong></div>
                                <div><span>Tooling API</span><strong>{systemToolingVersion}</strong></div>
                                <div><span>Salesforce API baseline</span><strong>v{systemSalesforceApiVersion}</strong></div>
                                <div><span>Environment</span><strong>{systemEnvironment}</strong></div>
                                <div><span>Organisation</span><strong>{systemOrganisationName}</strong><small>{systemOrganisationType}</small></div>
                                <div><span>Instance</span><strong>{systemInstanceName}</strong></div>
                                <div><span>Namespace</span><strong>{systemNamespace}</strong></div>
                                <div><span>Running user</span><strong>{systemRunningUserName}</strong><small>{systemRunningUser}</small></div>
                                <div><span>Profile / user type</span><strong>{systemProfileName}</strong><small>{systemUserType}</small></div>
                                <div><span>Timezone</span><strong>{systemTimeZone}</strong></div>
                            </div>
                        </section>
                        <section class="settings-panel system-info-panel">
                            <div class="settings-panel-head"><div><h3>Org Architecture</h3><p>Accessible schema footprint seen by the running user.</p></div></div>
                            <div class="system-info-grid">
                                <div><span>Accessible objects</span><strong>{systemAccessibleObjects}</strong></div>
                                <div><span>Standard / custom objects</span><strong>{systemObjectSplit}</strong></div>
                                <div><span>Accessible fields</span><strong>{systemAccessibleFields}</strong></div>
                                <div><span>Custom fields</span><strong>{systemCustomFields}</strong></div>
                                <div><span>Relationship fields</span><strong>{systemRelationshipFields}</strong></div>
                                <div><span>Formula fields</span><strong>{systemFormulaFields}</strong></div>
                            </div>
                        </section>
                        <section class="settings-panel system-info-panel">
                            <div class="settings-panel-head"><div><h3>Field Usage Engine</h3><p>Current persisted snapshot and scheduler state. Opening this page does not invoke Tooling API.</p></div></div>
                            <div class="system-info-grid">
                                <div><span>Snapshot</span><strong>{systemSnapshotStatus}</strong></div>
                                <div><span>Dependencies</span><strong>{systemDependencyCount}</strong></div>
                                <div><span>Snapshot errors</span><strong>{systemSnapshotErrors}</strong></div>
                                <div><span>Scan</span><strong>{systemScanState}</strong><small>{systemScanPhase}</small></div>
                                <div><span>Enabled schedules</span><strong>{systemEnabledSchedules}</strong></div>
                            </div>
                        </section>
                    </template>
                    <template if:true={settingsDiagnosticsSectionOpen}>
                        <div class="settings-title"><div><h2>Diagnostics</h2><p>Verify whether this installation is in a good state to work. Diagnostics do not start a Field Usage scan.</p></div></div>
                        <section class="settings-panel diagnostics-launch-panel">
                            <div class="diag-launch-copy"><span class="diag-eyebrow">APPLICATION SELF-TEST</span><h3>ER Modeller Studio Health Check</h3><p>Checks Studio runtime, Field Usage data access, snapshot state, Batch Apex, scheduler configuration and the authenticated Salesforce Tooling API connection.</p><p class="diag-api-note">Opening Settings consumes no Tooling API request. Clicking Run Diagnostics deliberately performs one lightweight Tooling API preflight so authentication can be proven.</p></div>
                            <button class="arch-action-btn arch-export-btn diag-run-button" onclick={handleRunDiagnostics}>{diagnosticsButtonLabel}</button>
                            <div class={diagnosticsOverallClass}><span>Current diagnostic state</span><strong>{diagnosticsOverallStatus}</strong><p>{diagnosticsSummary}</p><small>Last completed: {diagnosticsCompletedAt}</small></div>
                        </section>
                    </template>
                    <template if:true={settingsThemeSectionOpen}>
                        <div class="settings-title"><div><h2>Theme</h2><p>Choose the appearance used throughout ER Modeller Studio.</p></div></div>
                        <template if:true={settingsMessage}><div class="settings-message" role="status">{settingsMessage}</div></template>
                        <section class="settings-panel"><div class="settings-panel-head"><div><h3>Application Theme</h3><p>Select a theme to preview it immediately. Save it for future sessions.</p></div></div><label><span>Theme</span><select class="theme-select settings-theme-select" onchange={handleThemeChange}><option value="theme-dark-plus" selected={isThemeDarkPlus}>Dark+</option><option value="theme-light-plus" selected={isThemeLightPlus}>Light+</option><option value="theme-monokai" selected={isThemeMonokai}>Monokai</option><option value="theme-solarized-light" selected={isThemeSolarizedLight}>Solarized Light</option></select></label><div class="settings-actions"><button class="arch-action-btn arch-export-btn" onclick={handleSaveTheme}>Save Theme</button></div></section>
                    </template>
                </main>
            </div>
        </section>
    </template>

    <template if:true={diagnosticsOpen}>
        <section class="diagnostics-page">
            <header class="diagnostics-head">
                <div><span class="settings-kicker">ER MODELLER STUDIO · SYSTEM DIAGNOSTICS</span><h1>Application Health Check</h1><p>Live self-test of the Studio installation. No Field Usage scan is started.</p></div>
                <button class="arch-action-btn" disabled={diagnosticsRunning} onclick={handleCloseDiagnostics}>Back to Settings</button>
            </header>
            <div class="diagnostics-body">
                <div class="diagnostics-hero">
                    <div class="diag-pulse" data-running={diagnosticsRunning}><span></span></div>
                    <div><span class="diag-eyebrow">DIAGNOSTIC ENGINE</span><h2>{diagnosticsOverallStatus}</h2><p>{diagnosticsStage}</p></div>
                    <button class="arch-action-btn arch-export-btn" disabled={diagnosticsRunning} onclick={handleRunDiagnostics}>{diagnosticsButtonLabel}</button>
                </div>
                <template if:true={diagnosticsRunning}><div class="diag-processing"><span></span><span></span><span></span><strong>{diagnosticsStage}</strong></div></template>
                <div class="diag-check-list">
                    <template for:each={diagnosticsChecks} for:item="check">
                        <article class={check.cssClass} key={check.key}>
                            <div class="diag-status-mark">{check.status}</div>
                            <div><h3>{check.label}</h3><template if:true={check.diagnosis}><div class="diag-likely-cause"><strong>Diagnosis</strong><span>{check.diagnosis}</span></div></template><p>{check.detail}</p><template if:true={check.remediation}><div class="diag-remediation"><strong>Recommended action</strong><span>{check.remediation}</span><template if:true={check.hasActions}><ul class="diag-remediation-list"><template for:each={check.actions} for:item="action"><li key={action.key}>{action.label}</li></template></ul></template></div></template></div>
                        </article>
                    </template>
                </div>
                <template if:true={diagnosticsHasResults}>
                    <section class={diagnosticsOverallClass}><span>Overall application state</span><strong>{diagnosticsOverallStatus}</strong><p>{diagnosticsSummary}</p><small>Completed {diagnosticsCompletedAt}</small></section>
                </template>
                <div class="diag-safety-note"><strong>Diagnostic scope</strong><span>This self-test is read-only except for the authenticated Tooling API preflight. It does not launch scans, alter schedules, modify credentials or expose OAuth tokens and secrets.</span></div>
            </div>
        </section>
    </template>

    <!-- IN-APP HELP (modular child component) -->
    <template if:true={helpOpen}>
        <c-studio-help initial-section={helpSection} onclose={handleCloseHelp}></c-studio-help>
    </template>

    <!-- MIMIC NEW ER -->
    <template if:true={mimicOpen}>
        <div class="mimic-page">
            <header class="mimic-head"><div><span>POINT AND CLICK MODELLER</span><h1>Mimic New ER</h1><p>Design a hypothetical Salesforce data model without creating metadata in the org. Generate converts this form into the existing ER DSL and opens it on the normal canvas.</p><div class="mimic-custom-disclaimer"><strong>Custom objects and fields only</strong><span>Enter only the base API name, for example Project or Status. Mimic automatically adds __c to every object and field when generating the DSL. If you type __c or anything beginning with __, that suffix is discarded and Mimic applies __c itself. It does not create or modify metadata in your org.</span></div></div><button class="mimic-close" onclick={handleCloseMimic}>Back to Diagram</button></header>
            <main class="mimic-body">
                <section class="mimic-model-name"><label>Model name</label><input value={mimicModelName} oninput={handleMimicModelName} placeholder="Mimicked Model"/></section>
                <div class="mimic-section-title"><div><h2>Objects and fields</h2><p>Add the objects you want to model, then describe their fields.</p></div><button onclick={handleMimicAddObject}>+ Add Object</button></div>
                <template for:each={mimicObjectsView} for:item="obj">
                    <article class="mimic-object" key={obj.id}><div class="mimic-object-head"><input data-id={obj.id} value={obj.name} oninput={handleMimicObjectName} placeholder="Object name, e.g. Subscription"/><button data-id={obj.id} onclick={handleMimicRemoveObject}>Remove object</button></div>
                    <div class="mimic-field-labels"><span>Field name</span><span>Salesforce field type</span><span></span></div>
                    <template for:each={obj.fields} for:item="field"><div class="mimic-field" key={field.id}><input data-object={obj.id} data-field={field.id} value={field.name} oninput={handleMimicFieldName} placeholder="Field name, e.g. Status" disabled={field.locked}/><template if:true={field.locked}><div class="mimic-id-type">Salesforce Record ID</div></template><template if:false={field.locked}><select data-object={obj.id} data-field={field.id} value={field.type} onchange={handleMimicFieldType}><template for:each={mimicFieldTypeOptions} for:item="type"><option key={type} value={type}>{type}</option></template></select></template><template if:true={field.isRelationship}><select class="mimic-target" data-object={obj.id} data-field={field.id} value={field.target} onchange={handleMimicFieldTarget}><template for:each={field.targetOptions} for:item="target"><option key={target.value} value={target.value}>{target.label}</option></template></select></template><template if:false={field.isRelationship}><span></span></template><button data-object={obj.id} data-field={field.id} onclick={handleMimicRemoveField} disabled={field.locked}>×</button></div></template>
                    <button class="mimic-add-field" data-id={obj.id} onclick={handleMimicAddField}>+ Add Field</button></article>
                </template>
                <div class="mimic-rel-help"><strong>Relationship fields live with the object.</strong><span>Choose Lookup, Master Detail or Polymorphic as a field type. Then select another mimicked object. Relationships always target that object's Salesforce Id, so you cannot accidentally link to Name, Email or another non ID field.</span></div>
            </main>
            <footer class="mimic-footer"><div><strong>No Salesforce metadata is created.</strong><span>Generate uses the ER Modeller Studio DSL and existing parser/compiler.</span></div><button class="mimic-generate" onclick={handleGenerateMimic}>Generate Model</button></footer>
        </div>
    </template>

    <!-- EXPORT MODAL -->
    <template if:true={exportModalOpen}>
        <div class="modal-backdrop" onclick={handleCloseExport}>
            <div class="modal-box" onclick={stopProp}>
                <div class="modal-header">
                    <span class="modal-title">Export Diagram</span>
                    <button class="modal-close" onclick={handleCloseExport}>x</button>
                </div>
                <div class="modal-body">
                    <div class="export-field">
                        <label class="export-label" for="exportPageSize">Page Size</label>
                        <select id="exportPageSize" class="export-select" onchange={handleExportSizeChange}>
                            <template for:each={exportSizeOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                    <p class="hint-text slds-m-top_small">The PNG will be saved to Salesforce Files and downloaded to your browser.</p>
                    <div class="export-divider"></div>
                    <div class="export-field">
                        <label class="export-label">Mermaid ER Diagram</label>
                        <p class="hint-text">Paste this straight into a GitHub README, Confluence, or Notion page — it renders as a live diagram, no image needed.</p>
                        <div class="export-mermaid-actions">
                            <lightning-button label="Copy Mermaid" variant="neutral" onclick={handleCopyMermaid}></lightning-button>
                            <lightning-button label="Download .mmd" variant="neutral" onclick={handleDownloadMermaid}></lightning-button>
                        </div>
                    </div>
                    <div class="export-divider"></div>
                    <div class="export-field">
                        <label class="export-label">draw.io Diagram</label>
                        <p class="hint-text">Opens directly in draw.io / diagrams.net (File → Open, or drag the .drawio file in) — laid out exactly like your canvas, fully editable there.</p>
                        <div class="export-mermaid-actions">
                            <lightning-button label="Copy draw.io XML" variant="neutral" onclick={handleCopyDrawio}></lightning-button>
                            <lightning-button label="Download .drawio" variant="neutral" onclick={handleDownloadDrawio}></lightning-button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <lightning-button label="Cancel" variant="neutral" onclick={handleCloseExport}></lightning-button>
                    <lightning-button label="Export and Download" variant="brand" disabled={exportModalSaveDisabled} onclick={handleDoExport}></lightning-button>
                </div>
            </div>
        </div>
    </template>

    <!-- SCHEMA DRIFT MODAL -->
    <template if:true={driftModalOpen}>
        <div class="modal-backdrop" onclick={handleCloseDriftModal}>
            <div class="modal-box modal-box-wide" onclick={stopProp}>
                <div class="modal-header">
                    <span class="modal-title">Compare with Org Schema</span>
                    <button class="modal-close" onclick={handleCloseDriftModal}>x</button>
                </div>
                <div class="modal-body">
                    <template if:true={driftBusy}>
                        <p class="hint-text">Re-checking against the org's current schema…</p>
                    </template>
                    <template if:true={driftNoIssues}>
                        <p class="hint-text">Everything matches — for every entity on this canvas that maps to a real object, the diagram's field list and the org's current schema are identical. (Entities with no matching object in the org are skipped, since there's nothing to compare them against.)</p>
                    </template>
                    <template for:each={driftResults} for:item="r">
                        <div key={r.entityName} class="drift-entity-block">
                            <div class="drift-entity-head">
                                <span>{r.entityName}</span>
                            </div>
                            <template if:true={r.newFields.length}>
                                <div class="drift-section">
                                    <div class="drift-section-head">
                                        <span class="drift-section-label drift-new">+ In the org but not on this diagram ({r.newFields.length})</span>
                                        <button class="dsl-head-btn" data-entity={r.entityName} onclick={handleAddAllDriftFields}>Add all</button>
                                    </div>
                                    <p class="drift-new-hint">These exist on the object in the org but aren't in your diagram — either added since you built it, or just never included. Add any you want shown.</p>
                                    <template for:each={r.newFields} for:item="f">
                                        <div key={f.id} class="drift-row">
                                            <span class="drift-field-name">{f.name}</span>
                                            <button class="rel-suggest-add" data-entity={r.entityName} data-field={f.name} onclick={handleAddDriftField}>+ Add</button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:true={r.missingFields.length}>
                                <div class="drift-section drift-section-warn">
                                    <div class="drift-section-head">
                                        <span class="drift-section-label drift-missing">⚠ On this diagram but not in the org ({r.missingFields.length})</span>
                                    </div>
                                    <p class="drift-missing-hint">Your diagram lists these, but they didn't come back from the org — usually renamed or deleted. Note they'd also show up here if your profile simply can't see them (field-level security), so check before removing.</p>
                                    <template for:each={r.missingFields} for:item="f">
                                        <div key={f.id} class="drift-row">
                                            <span class="drift-field-name drift-field-stale">{f.name}</span>
                                            <button class="drift-remove-btn" data-entity={r.entityName} data-field={f.name} onclick={handleRemoveDriftField}>Remove</button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <div class="modal-footer">
                    <lightning-button label="Close" variant="neutral" onclick={handleCloseDriftModal}></lightning-button>
                    <lightning-button label="Re-check" variant="brand" disabled={driftBusy} onclick={handleOpenDriftCheck}></lightning-button>
                </div>
            </div>
        </div>
    </template>

    <!-- TOP MENU BAR -->
    <div class="menu-bar">
        <span class="app-logo">ER</span>
        <span class="app-name">Diagram Studio</span>
        <div class="menu-spacer"></div>
        <span class={statusClass}>{statusLabel}</span>
        <template if:true={currentId}>
            <button class="menu-btn" onclick={handleCopyId} title="Copy record Id">Copy Id</button>
        </template>
    </div>

    <!-- FIELD USAGE WORKSPACE -->
    <template if:true={fieldUsageOpen}>
        <section class={fieldUsageWorkspaceClass}>
            <header class="fu-header">
                <div><span class="settings-kicker">FIELD USAGE INTELLIGENCE</span><h1>Field Usage Map</h1><p>Select an object and one or more fields to visualise where they are used across the latest successful scan.</p></div>
                <div class="fu-actions"><button class="arch-action-btn" onclick={handleFieldUsageClear}>Clear</button><button class="arch-action-btn" onclick={handleToggleFieldUsageFullScreen}>{fieldUsageFullScreenLabel}</button><button class="mimic-close" onclick={handleCloseFieldUsage}>Back to Diagram</button></div>
            </header>
            <template if:true={fieldUsageLoading}><div class="settings-loading">Loading Field Usage snapshot…</div></template>
            <template if:true={fieldUsageShowEntryMessage}><div class="afi-empty"><strong>Field Usage status</strong><p>{fieldUsageEntryMessage}</p></div></template>
            <template if:true={fieldUsageReady}>
                <div class="fu-browser-shell">
                    <aside class="fu-picker-pane"><div class="settings-panel-head"><div><h3>Objects</h3><p>Choose an indexed object</p></div></div><input class="fu-picker-search" type="search" placeholder="Search objects" value={fieldUsageObjectSearch} oninput={handleFieldUsageObjectSearch}/><div class="fu-picker-list"><template for:each={fieldUsageObjectOptions} for:item="o"><button key={o.value} class={o.rowClass} data-value={o.value} onclick={handleFieldUsageObject}>{o.label}</button></template></div></aside>
                    <aside class="fu-picker-pane"><div class="settings-panel-head"><div><h3>Fields</h3><p>Select one or more fields</p></div></div><input class="fu-picker-search" type="search" placeholder="Search fields" value={fieldUsageFieldSearch} oninput={handleFieldUsageFieldSearch}/><div class="fu-picker-list"><template if:true={fieldUsageHasObject}><template for:each={fieldUsageFieldOptions} for:item="f"><button key={f.value} class={f.rowClass} data-value={f.value} onclick={handleFieldUsageFields}>{f.label}</button></template></template><template if:false={fieldUsageHasObject}><div class="fu-picker-empty">Select an object first.</div></template></div></aside>
                    <main class="fu-map-pane">
                        <div class="fu-map-toolbar"><div><strong>Dependency Map</strong><span>Object → Field → Source → Component → Evidence</span></div><div class="fu-actions"><button class="arch-action-btn" onclick={handleFieldUsageAnalyse}>{fieldUsageBuildLabel}</button><button class="arch-action-btn" onclick={handleFieldUsageZoomOut}>−</button><button class="arch-action-btn" onclick={handleFieldUsageZoomReset}>{fieldUsageZoomLabel}</button><button class="arch-action-btn" onclick={handleFieldUsageZoomIn}>+</button><button class="arch-action-btn" onclick={handleFieldUsageFit}>Fit</button><button class="arch-action-btn" onclick={handleFieldUsageExport}>Export PNG</button></div></div>
                        <div class="fu-scroll" onmousedown={handleFieldUsagePanStart} onmousemove={handleFieldUsagePanMove} onmouseup={handleFieldUsagePanEnd} onmouseleave={handleFieldUsagePanEnd}><div class="fu-stage" style={fieldUsageStageStyle}><div class="fu-canvas" style={fieldUsageCanvasStyle}><svg class="fu-edges"><template for:each={fieldUsageEdges} for:item="edge"><path key={edge.key} d={edge.path}></path></template></svg><template for:each={fieldUsageNodes} for:item="node"><button key={node.key} class="fu-node" style={node.style} data-kind={node.kind} data-field={node.field} data-source={node.source} data-evidence-key={node.evidenceKey} onclick={handleFieldUsageNodeClick}><strong>{node.label}</strong><span>{node.sub}</span></button></template></div></div></div>
                    </main>
                </div>
            </template>
        </section>
    </template>

    <!-- ACTION TOOLBAR -->
    <div class="toolbar">
        <button class="tb-icon-btn" onclick={handleToggleSidebar} title="Toggle file explorer">|||</button>
        <button class="tb-icon-btn" onclick={handleToggleDslPanel} title="Toggle DSL editor">&lt;/&gt;</button>
        <div class="tb-sep"></div>

        <!-- FILE MENU -->
        <div class="dd-menu-wrap">
            <button class={fileMenuClass} data-menu="file" onclick={handleToggleMenu}>File <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={fileMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuNew}>+ New</div>
                    <div class="dd-menu-item" onclick={handleMenuSave}>Save <span class="dd-menu-shortcut">Ctrl+S</span></div>
                    <div class="dd-menu-divider"></div>
                    <div class="dd-menu-item" onclick={handleMenuImport}>Import from Org</div>
                    <div class="dd-menu-item" onclick={handleMenuExport}>Export...</div>
                </div>
            </template>
        </div>

        <!-- DIAGRAM MENU -->
        <div class="dd-menu-wrap">
            <button class={diagramMenuClass} data-menu="diagram" onclick={handleToggleMenu}>Diagram <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={diagramMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuMimic}>Mimic New ER</div>
                    <div class="dd-menu-item" onclick={handleMenuCompareOrg}>Compare with Org</div>
                    <div class="dd-menu-divider"></div>
                    <div class="dd-menu-item dd-menu-item-danger" onclick={handleMenuClearCanvas}>Clear Canvas</div>
                </div>
            </template>
        </div>

        <!-- VIEW MENU -->
        <div class="dd-menu-wrap">
            <button class={viewMenuClass} data-menu="view" onclick={handleToggleMenu}>View <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={viewMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuSharingView}>{sharingViewMenuText}</div>
                    <div class="dd-menu-item" onclick={handleMenuHeatmap}>{heatmapMenuText}</div>
                    <div class="dd-menu-item" onclick={handleMenuDataDictionary}>{dictionaryMenuText}</div>
                    <div class="dd-menu-item" onclick={handleMenuFieldUsage}>{fieldUsageMenuText}</div>
                    <div class="dd-menu-divider"></div>
                    <div class="dd-menu-item" onclick={handleMenuArchitecture}>{architectureMenuText}</div>
                </div>
            </template>
        </div>

        <!-- SETTINGS MENU -->
        <div class="dd-menu-wrap">
            <button class={settingsMenuClass} data-menu="settings" onclick={handleToggleMenu}>Settings <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={settingsMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuSettings}>Open Settings</div>
                </div>
            </template>
        </div>

        <!-- HELP MENU -->
        <div class="dd-menu-wrap">
            <button class={helpMenuClass} data-menu="help" onclick={handleToggleMenu}>Help <span class="dd-menu-caret">&#9662;</span></button>
            <template if:true={helpMenuOpen}>
                <div class="dd-menu-dropdown" onclick={stopProp}>
                    <div class="dd-menu-item" onclick={handleMenuHelpConfiguration}>Configuration</div>
                    <div class="dd-menu-item" onclick={handleMenuHelpUserManual}>User Manual</div>
                </div>
            </template>
        </div>

        <div class="tb-spacer"></div>
        <input class="diag-name-input" type="text" value={fileName} oninput={handleNameChange} placeholder="Diagram name" />
    </div>

    <!-- TAB BAR -->
    <div class="tab-bar">
        <template for:each={computedTabs} for:item="tab">
            <div key={tab.id}
                 class={tab.tabClass}
                 data-tabid={tab.id}
                 onclick={handleTabClick}
                 title={tab.name}>
                <template if:false={tab.renaming}>
                    <span class="tab-name">{tab.name}</span>
                    <template if:true={tab.dirty}>
                        <span class="tab-dirty">*</span>
                    </template>
                    <button class="tab-close" data-tabid={tab.id} onclick={handleTabClose}>x</button>
                </template>
                <template if:true={tab.renaming}>
                    <input class="tab-rename-input"
                           type="text"
                           value={tab.renameValue}
                           data-tabid={tab.id}
                           onchange={handleTabRenameChange}
                           onkeydown={handleTabRenameCommit}
                           onblur={handleTabRenameBlur} />
                </template>
            </div>
        </template>
        <button class="tab-new-btn" onclick={handleNew}>+</button>
    </div>

    <!-- MAIN BODY -->
    <div class="studio-body">

        <!-- FILE EXPLORER SIDEBAR -->
        <div class={sidebarClass}>
            <div class="sidebar-head">EXPLORER</div>

            <div class="sidebar-section">
                <div class="sidebar-sec-head">
                    <span>SAVED DIAGRAMS</span>
                    <button class="sb-icon-btn" onclick={handleNew}>+</button>
                </div>
                <div class="file-list">
                    <template for:each={files} for:item="f">
                        <div key={f.id}
                             class={f.rowClass}
                             data-id={f.id}
                             onclick={handleOpen}
                             oncontextmenu={handleFileContextMenu}>
                            <span class="file-name">{f.name}</span>
                            <span class="file-date">{f.modified}</span>
                            <button class="file-del-btn" data-id={f.id} onclick={handleDeleteFile}>x</button>
                        </div>
                    </template>
                    <template if:true={noFiles}>
                        <p class="empty-msg">No saved diagrams yet. Click + to create one.</p>
                    </template>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-sec-head" onclick={handleToggleImport}>
                    <span>IMPORT FROM ORG</span>
                </div>
                <template if:true={importPanelOpen}>
                    <div class="import-panel">
                        <textarea class="import-textarea"
                                  placeholder="Account, Contact, Case"
                                  value={importObjectNames}
                                  oninput={handleImportNamesChange}></textarea>
                        <button class="sb-full-btn" onclick={handleImportSchema}>Import Schema</button>
                    </div>
                </template>
            </div>

            <div class="sidebar-section palette-section">
                <div class="sidebar-sec-head">DRAG TO CANVAS</div>
                <input class="palette-search" type="text"
                       placeholder="Search objects"
                       value={paletteFilter}
                       oninput={handlePaletteFilterChange} />
                <div class="palette-chips">
                    <template for:each={filteredPaletteObjects} for:item="obj">
                        <div key={obj} class="palette-chip"
                             draggable="true"
                             data-name={obj}
                             ondragstart={handlePaletteDragStart}>{obj}</div>
                    </template>
                </div>
            </div>

        </div>

        <!-- DSL EDITOR PANEL -->
        <div class={dslPanelClass} style={dslPanelStyle}>
            <div class="dsl-panel-head">
                <span>DSL EDITOR</span>
                <div class="dsl-panel-head-actions">
                    <button class="dsl-head-btn" onclick={handleToggleDslWrap} title="Toggle editor word wrapping without changing the DSL">{dslWrapLabel}</button>
                    <button class="dsl-head-btn" onclick={handleToggleDslMaximise} title="Maximise or restore the editor without changing the DSL">{dslMaximiseLabel}</button>
                    <button class="dsl-head-btn" onclick={handleImportDslClick} title="Import a .dsl file from your computer and draw it">Import</button>
                    <button class="dsl-head-btn" onclick={handleExportDsl} title="Export this DSL as a .dsl file">Export</button>
                    <button class="dsl-head-btn dsl-head-btn-danger" onclick={handleClearCanvas} title="Clear the DSL editor and the canvas">Clear</button>
                </div>
            </div>
            <input type="file" class="dsl-file-input" accept=".dsl,.txt" onchange={handleImportDslFile} />
            <p class="dsl-hint">Type entity / relationship lines directly — the canvas updates as you type. Suggestions appear at the cursor; use up/down then Enter or Tab to accept, Esc to dismiss.</p>

            <template if:true={missingRelationshipSuggestions.length}>
                <div class="rel-suggest-banner">
                    <div class="rel-suggest-head">
                        <span>💡 Possible relationships found</span>
                        <div class="rel-suggest-head-actions">
                            <button class="dsl-head-btn" onclick={handleAddAllSuggestions}>Add all</button>
                            <button class="dsl-head-btn" onclick={handleDismissSuggestions} title="Dismiss">×</button>
                        </div>
                    </div>
                    <template for:each={missingRelationshipSuggestions} for:item="s">
                        <div key={s.id} class="rel-suggest-row">
                            <span class="rel-suggest-label">{s.label}</span>
                            <button class="rel-suggest-add" data-line={s.line} onclick={handleAddSuggestion}>+ Add</button>
                        </div>
                    </template>
                </div>
            </template>

            <div class="dsl-editor-wrap">
                <div class="dsl-line-numbers" aria-hidden="true" style={dslLineNumberStyle}>
                    <template for:each={dslLineNumbers} for:item="line">
                        <span key={line.key}>{line.number}</span>
                    </template>
                </div>
                <textarea class={dslEditorClass}
                          spellcheck="false"
                          wrap={dslWrapAttribute}
                          placeholder="entity Account : Name, Industry&#10;&#10;Contact.AccountId => Account"
                          value={sourceText}
                          oninput={handleTextChange}
                          onkeydown={handleDslKeyDown}
                          onclick={handleDslClick}
                          onscroll={handleDslScroll}
                          onblur={handleDslBlur}></textarea>
                <template if:true={dslSuggestOpen}>
                    <div class="dsl-suggestions" style={dslSuggestStyle}>
                        <template for:each={computedSuggestions} for:item="s">
                            <div key={s.id}
                                 class={s.rowClass}
                                 data-index={s.idx}
                                 onmousedown={handleSuggestionMouseDown}
                                 onclick={handleSuggestionClick}>
                                <span class="dsl-suggest-label">{s.label}</span>
                                <span class="dsl-suggest-detail">{s.detail}</span>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>

        <!-- DSL PANEL RESIZE HANDLE -->
        <template if:true={dslPanelOpen}>
            <div class="dsl-resize-handle"
                 onpointerdown={handleDslResizePointerDown}
                 onpointermove={handleDslResizePointerMove}
                 onpointerup={handleDslResizePointerUp}></div>
        </template>

        <!-- CANVAS AREA -->
        <div class={canvasOuterClass}>

            <template if:true={errorMessage}>
                <div class="error-bar" role="alert">
                    {errorMessage}
                    <button class="error-dismiss" onclick={clearError}>x</button>
                </div>
            </template>

            <!-- Zoom controls -->
            <div class="zoom-controls">
                <button class="zoom-btn zoom-btn-wide" onclick={handleToggleCanvasMaximise} title="Maximise or restore canvas">{canvasMaximiseLabel}</button>
                <button class="zoom-btn zoom-btn-wide" onclick={handleFitModel} title="Fit the complete model into the visible canvas">Fit Model</button>
                <template lwc:if={showCanvasFitExport}><button class="zoom-btn zoom-btn-wide" onclick={handleOpenExport} title="Export the complete fitted model">Export</button></template>
                <template if:true={canvasHasModel}><button class="zoom-btn zoom-btn-wide" onclick={handleToggleCanvasSummary}>{canvasSummaryToggleLabel}</button></template>
                <button class="zoom-btn" onclick={handleZoomOut} title="Zoom out">-</button>
                <button class="zoom-btn zoom-btn-label" onclick={handleZoomReset} title="Reset zoom">{zoomPercentLabel}</button>
                <button class="zoom-btn" onclick={handleZoomIn} title="Zoom in">+</button>
            </div>

            <!-- Legend -->
            <div class="legend-overlay" style={legendStyle}>
                <div class="legend-drag-head" onpointerdown={handleLegendPointerDown} onpointermove={handleLegendPointerMove} onpointerup={handleLegendPointerUp} onpointercancel={handleLegendPointerUp}><p class="legend-title">Relationships</p><button class="legend-reset" onclick={handleLegendReset} title="Reset legend position">Reset</button></div>
                <div class="legend-row">
                    <svg width="52" height="14"><line x1="2" y1="7" x2="40" y2="7" stroke="#5c2d91" stroke-width="2.5"></line><polygon points="38,4 50,7 38,10" fill="#5c2d91"></polygon></svg>
                    <span>Master-Detail</span>
                </div>
                <div class="legend-row">
                    <svg width="52" height="14"><line x1="2" y1="7" x2="38" y2="7" stroke="#0070d2" stroke-width="1.75"></line><polyline points="34,4 48,7 34,10" fill="none" stroke="#0070d2" stroke-width="1.75"></polyline></svg>
                    <span>Lookup</span>
                </div>
                <div class="legend-row">
                    <svg width="52" height="14"><line x1="2" y1="7" x2="38" y2="7" stroke="#ea4335" stroke-width="1.75" stroke-dasharray="4,2"></line><polygon points="38,4 50,7 38,10" fill="none" stroke="#ea4335" stroke-width="1.5"></polygon></svg>
                    <span>Polymorphic</span>
                </div>
            </div>

            <!-- Scrollable canvas -->
            <div class="canvas-wrap" ondragover={handleCanvasDragOver} ondrop={handleCanvasDrop}>
              <div class="svg-scale-wrap" style={svgScaleWrapStyle}>
                <svg data-role="er-svg"
                     viewBox={svgViewBox}
                     width={svgWidth}
                     height={svgHeight}
                     style={svgTransformStyle}
                     class="er-svg"
                     xmlns="http://www.w3.org/2000/svg"
                     onpointermove={handleSvgPointerMove}
                     onpointerup={handleSvgPointerUp}>

                    <defs lwc:dom="manual"></defs>

                    <rect x="0" y="0" width={svgWidth} height={svgHeight} fill="#f4f6f9" onclick={handleCanvasBackgroundClick}></rect>

                    <!-- Connectors rendered under boxes -->
                    <template for:each={connectorsView} for:item="c">
                        <g key={c.key} opacity={c.connOpacity} class="conn-group">
                            <path d={c.d} fill="none" stroke="rgba(0,0,0,0)" stroke-width="10"></path>
                            <path d={c.d} fill="none" stroke={c.stroke} stroke-width={c.strokeWidth} stroke-dasharray={c.dashArray} marker-end={c.markerEnd}></path>
                            <text x={c.midX} y={c.midY} text-anchor="middle" font-size="10" class="conn-label" fill={c.stroke}>{c.label}</text>
                            <circle cx={c.cardStartX} cy={c.cardStartY} r="9" fill="#ffffff" stroke={c.stroke} stroke-width="1.5"></circle>
                            <text x={c.cardStartX} y={c.cardStartY} dy="4" text-anchor="middle" font-size="9" font-weight="bold" fill={c.stroke}>{c.cardStartText}</text>
                            <circle cx={c.cardEndX} cy={c.cardEndY} r="9" fill="#ffffff" stroke={c.stroke} stroke-width="1.5"></circle>
                            <text x={c.cardEndX} y={c.cardEndY} dy="4" text-anchor="middle" font-size="9" font-weight="bold" fill={c.stroke}>{c.cardEndText}</text>
                        </g>
                    </template>

                    <!-- Entity boxes -->
                    <template for:each={erBoxes} for:item="b">
                        <g key={b.name}
                           data-name={b.name}
                           opacity={b.boxOpacity}
                           class="entity-group"
                           onmouseenter={handleBoxMouseEnter}
                           onmouseleave={handleBoxMouseLeave}>

                            <!-- Shadow -->
                            <rect x={b.shadowX} y={b.shadowY} width={b.width} height={b.height} rx="7" fill="#c8cdd6"></rect>
                            <!-- Body -->
                            <rect x={b.x} y={b.y} width={b.width} height={b.height} rx="7" fill={b.bodyFill} stroke={b.boxStroke} stroke-width={b.boxStrokeWidth}></rect>
                            <!-- Header drag handle -->
                            <rect data-name={b.name} x={b.x} y={b.y} width={b.width} height="36" rx="6" fill={b.headerFill} class="drag-header" onpointerdown={handleBoxPointerDown}></rect>
                            <!-- Header bottom strip (covers rounded corners gap) -->
                            <rect x={b.x} y={b.headerBodyY} width={b.width} height="10" fill={b.headerFill}></rect>
                            <!-- Entity name -->
                            <text x={b.x} y={b.y} dx="12" dy="24" font-size="13" font-weight="bold" fill="#ffffff">{b.name}</text>
                            <!-- Delete button -->
                            <g data-name={b.name} class="delete-btn" onclick={handleDeleteEntity} transform={b.deleteTransform}>
                                <circle cx="0" cy="0" r="10" fill="#c23934"></circle>
                                <text x="0" y="0" font-size="14" fill="#ffffff" text-anchor="middle" dy="5">x</text>
                            </g>
                            <!-- Badges: heatmap record count, sharing model (internal/external) -->
                            <template for:each={b.badges} for:item="badge">
                                <g key={badge.id} class="entity-badge">
                                    <title>{badge.title}</title>
                                    <circle cx={badge.cx} cy={badge.cy} r="12" fill={badge.fillColor} stroke={badge.strokeColor} stroke-width="2"></circle>
                                    <text x={badge.cx} y={badge.cy} font-size="9" font-weight="bold" fill={badge.textColor} text-anchor="middle" dy="3">{badge.code}</text>
                                </g>
                            </template>
                            <!-- Divider -->
                            <line x1={b.x} y1={b.dividerY} x2={b.xEnd} y2={b.dividerY} stroke="#e4e7ec" stroke-width="1"></line>

                            <!-- Field rows — primary key -->
                            <template for:each={b.pkFields} for:item="fld">
                                <g key={fld.key}>
                                    <text x={b.x} y={fld.rowY} dx="10" font-size="10" fill="#d4a72c">*</text>
                                    <text x={b.x} y={fld.rowY} dx="22" font-size="11" font-weight="600" fill="#101828">{fld.text}</text>
                                    <template if:true={fld.isRequired}>
                                        <text x={b.x} y={fld.rowY} dx={b.reqMarkerDx} font-size="10" font-weight="700" fill="#d92d20">R</text>
                                    </template>
                                </g>
                            </template>
                            <!-- Field rows — relationship fields -->
                            <template for:each={b.relFields} for:item="fld">
                                <g key={fld.key}>
                                    <text x={b.x} y={fld.rowY} dx="10" font-size="10" fill="#7b5ea7">~</text>
                                    <text x={b.x} y={fld.rowY} dx="22" font-size="11" font-style="italic" fill="#667085">{fld.text}</text>
                                    <template if:true={fld.isRequired}>
                                        <text x={b.x} y={fld.rowY} dx={b.reqMarkerDx} font-size="10" font-weight="700" fill="#d92d20">R</text>
                                    </template>
                                </g>
                            </template>
                            <!-- Field rows — plain fields (roll-up summary fields get a Σ marker) -->
                            <template for:each={b.plainFields} for:item="fld">
                                <g key={fld.key}>
                                    <template if:true={fld.isRollupSummary}>
                                        <text x={b.x} y={fld.rowY} dx="10" font-size="10" fill="#0d9488">&#931;</text>
                                    </template>
                                    <text x={b.x} y={fld.rowY} dx="22" font-size="11" fill="#344054">{fld.text}</text>
                                    <template if:true={fld.isRequired}>
                                        <text x={b.x} y={fld.rowY} dx={b.reqMarkerDx} font-size="10" font-weight="700" fill="#d92d20">R</text>
                                    </template>
                                </g>
                            </template>

                            <!-- More fields indicator -->
                            <template if:true={b.hasHidden}>
                                <text data-name={b.name} x={b.x} y={b.moreTextY} dx="12" font-size="10" fill="#98a2b3" class="more-fields-text" onclick={handleShowAllFields}>{b.moreLabel}</text>
                            </template>

                            <!-- Bottom resize handle -->
                            <rect data-name={b.name} data-role="resize"
                                  x={b.x} y={b.resizeY}
                                  width={b.width} height="14"
                                  fill="rgba(0,0,0,0)"
                                  class="resize-handle"
                                  onpointerdown={handleResizePointerDown}
                                  onpointermove={handleResizePointerMove}
                                  onpointerup={handleResizePointerUp}
                                  ondblclick={handleShowAllFields}></rect>
                            <line x1={b.resizeDotX1} y1={b.resizeLineY} x2={b.resizeDotX2} y2={b.resizeLineY}
                                  stroke="#d0d5dd" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"></line>
                            <!-- Right resize handle -->
                            <rect data-name={b.name} data-role="resize-right"
                                  x={b.resizeRightX} y={b.resizeRightY}
                                  width="14" height={b.resizeRightHeight}
                                  fill="rgba(0,0,0,0)"
                                  class="resize-handle-right"
                                  onpointerdown={handleResizeRightPointerDown}
                                  onpointermove={handleResizeRightPointerMove}
                                  onpointerup={handleResizeRightPointerUp}></rect>
                        </g>
                    </template>

                </svg>
              </div>
            </div>
            <template if:true={canvasSummaryVisible}>
                <section class="canvas-summary">
                    <div class="canvas-summary-head">
                        <div><strong>Model Relationship Summary</strong><span>Live explanation of the relationships currently on this canvas.</span></div>
                    </div>
                    <div class="canvas-summary-scroll">
                            <template for:each={canvasRelationshipSummary} for:item="item">
                                <div class="canvas-summary-row" key={item.key}>
                                    <span class="canvas-summary-kind">{item.kind}</span>
                                    <strong>{item.child}</strong><span class="canvas-summary-arrow">→</span><strong>{item.parent}</strong>
                                    <span class="canvas-summary-field">{item.field}</span>
                                    <span class="canvas-summary-sentence">{item.sentence}</span>
                                </div>
                            </template>
                    </div>
                </section>
            </template>
        </div>

    </div>

    <!-- DATA ARCHITECTURE INTELLIGENCE -->
    <template if:true={architectureOpen}>
        <div class={architecturePanelClass} style={architecturePanelStyle}>
            <div class="arch-header">
                <div><div class="arch-kicker">DATA MODEL ANALYSIS</div><div class="arch-title">Data Architecture Intelligence</div><div class="arch-subtitle">Analysing file: <strong>{fileName}</strong> · Structural evidence from the ER model currently on the canvas.</div></div>
                <div class="arch-header-actions"><button class="arch-action-btn arch-refresh-btn" onclick={handleArchitectureReset}>Clear / Refresh</button><div class="arch-font-controls" title="Adjust Architecture Intelligence text size"><button class="arch-font-btn" onclick={handleArchitectureFontDecrease} disabled={architectureCannotDecreaseFont}>A−</button><button class="arch-font-value" onclick={handleArchitectureFontReset} title="Reset text size">{architectureFontPercent}</button><button class="arch-font-btn" onclick={handleArchitectureFontIncrease} disabled={architectureCannotIncreaseFont}>A+</button></div><button class="arch-action-btn" onclick={handleCloseArchitecture}>Back to Diagram</button><button class="modal-close arch-close" onclick={handleCloseArchitecture}>x</button></div>
            </div>
            <template if:true={architectureHasError}>
                <div class="arch-error" role="alert">
                    <div><strong>Analysis unavailable</strong><p>{architectureError}</p><span>Your diagram has not been changed. Fix the DSL/model issue and retry.</span></div>
                    <button class="arch-action-btn" onclick={handleRetryArchitecture}>Retry Analysis</button>
                </div>
            </template>
            <template if:true={architectureHasModel}>
                <template if:true={architectureShowHome}>
                    <section class="arch-home">
                        <div class="arch-home-hero"><div class="arch-brief-label">ARCHITECTURE INTELLIGENCE HOME</div><h2>Choose the architecture question you want to answer</h2><p>This workspace turns the current Salesforce ER model into focused architecture evidence. Start with Overview, then open the question you need: change impact, business boundaries or relationship design.</p></div>
                        <div class="arch-home-grid"><template for:each={architectureHomeTiles} for:item="tile"><button class="arch-home-tile" key={tile.key} data-section={tile.key} onclick={handleArchitectureSection}><span class="arch-home-question">{tile.question}</span><strong>{tile.title}</strong><p>{tile.detail}</p><span class="arch-home-action">{tile.action} →</span></button></template></div>
                    </section>
                </template>
                <template if:false={architectureShowHome}><div class="arch-workspace-nav"><button class="arch-home-back" onclick={handleArchitectureHome}>← Back to Architecture Home</button></div></template>
                <section class="arch-brief arch-workspace arch-workspace-overview">
                    <div class="arch-brief-label">ARCHITECTURE SUMMARY</div>
                    <p class="arch-brief-text">{architectureExecutiveSummary}</p>
                    <div class="arch-brief-signals">
                        <div><span>Connectivity</span><strong>{architectureConnectivityLabel}</strong></div>
                        <div><span>Maximum reach</span><strong>{architectureAnalysis.maxRelationshipDepth} hops</strong></div>
                        <div><span>Cycles</span><strong>{architectureCycleLabel}</strong></div>
                        <div><span>Isolated objects</span><strong>{architectureIslandLabel}</strong></div>
                        <div><span>Junctions</span><strong>{architectureJunctionLabel}</strong></div>
                        <div><span>Relationship mix</span><strong>{architectureRelationshipSemantics}</strong></div>
                    </div>
                    <div class="arch-guide-intro"><strong>What this summary actually means</strong><p>The numbers above describe structure found in the current ER file. They do not score the architecture and they do not claim that a relationship automatically creates runtime impact. The evidence below explains each signal and what an architect can reasonably use it for.</p></div>
                    <div class="arch-guide-grid"><template for:each={architectureOverviewExplanations} for:item="item"><article class="arch-guide-card" key={item.key}><h3>{item.title}</h3><div><strong>Current evidence</strong><p>{item.value}</p></div><div><strong>What it means</strong><p>{item.meaning}</p></div><div><strong>What to review</strong><p>{item.review}</p></div></article></template></div>
                </section>

                <template if:true={architectureReviewLead}>
                    <section class="arch-section arch-review-first arch-workspace arch-workspace-overview">
                        <div class="arch-section-head"><span>Where Should I Look First?</span><span class="arch-section-hint">Evidence-led starting point</span></div>
                        <div class="arch-review-card">
                            <div class="arch-review-rank">1</div>
                            <div class="arch-review-main"><div class="arch-review-title"><strong>{architectureReviewLead.name}</strong><span class="arch-tag">{architectureReviewLead.role}</span></div><p>{architectureReviewLead.reason}</p><div class="arch-evidence">{architectureReviewLead.evidence} · {architectureReviewLead.reach}</div></div>
                            <button class="arch-action-btn" data-name={architectureReviewLead.name} onclick={handleArchitectureFindingInspect}>Object Map</button>
                            
                        </div>
                    </section>
                </template>

                

                <section class="arch-section arch-designer-dashboard arch-workspace arch-workspace-overview">
<div class="arch-section-head"><span>Designer Architecture Dashboard</span><span class="arch-section-hint">See concentration, coupling and review areas before drilling into metrics</span></div>
<div class="arch-designer-brief"><template for:each={architectureDesignerBrief} for:item="x"><article key={x.key}><span>{x.label}</span><strong>{x.title}</strong><p>{x.detail}</p></article></template></div>
<div class="arch-visual-grid">
<article class="arch-visual-card"><div class="arch-visual-head"><strong>Object Complexity Profile</strong><span>Relationship concentration versus field breadth</span></div><div class="arch-object-bars"><template for:each={architectureDashboardObjects} for:item="o"><button key={o.name} class="arch-bar-row" data-name={o.name} onclick={handleArchitectureObjectSelect}><span class="arch-bar-name">{o.name}</span><span class="arch-bar-pair"><i class="arch-bar arch-bar-rel" style={o.relationshipStyle}></i><i class="arch-bar arch-bar-field" style={o.fieldStyle}></i></span><small>{o.degree} rel. · {o.fieldCount} fields</small></button></template></div><div class="arch-bar-legend"><span>Relationship concentration</span><span>Field breadth</span></div></article>
<article class="arch-visual-card"><div class="arch-visual-head"><strong>Relationship Composition</strong><span>How objects are structurally connected</span></div><div class="arch-mix-chart"><template for:each={architectureRelationshipMix} for:item="m"><div class="arch-mix-row" key={m.key}><div><strong>{m.label}</strong><span>{m.value} relationships · {m.pct}%</span></div><div class="arch-mix-track"><i style={m.style}></i></div></div></template></div><div class="arch-chart-help">Lookup shows reference dependency. Master Detail represents tighter lifecycle ownership. Polymorphic relationships can point to more than one parent type and deserve contextual review.</div></article>
</div><div class="arch-dashboard-help"><strong>How to use this dashboard</strong><span>Start with the highlighted review areas, compare object concentration, then click an object to open its Object Map. Use Object Usage & Change Readiness when you want to assess modelled dependency exposure before change.</span></div>
</section>
<section class="arch-section arch-guide-section arch-workspace arch-workspace-overview">
                    <div class="arch-section-head"><span>How to Read Architecture Intelligence</span><span class="arch-section-hint">What each signal means and what to do with it</span></div>
                    <p class="arch-guide-intro">These signals are deterministic observations from the current ER model. They are not architecture scores. Use them as evidence for review, then apply business context before making a design decision.</p>
                    <div class="arch-guide-grid"><template for:each={architectureInsightGuide} for:item="g"><article class="arch-guide-card" key={g.key}><h3>{g.title}</h3><div class="arch-current-finding"><strong>Current model finding</strong><p>{g.finding}</p></div><div><strong>What it shows</strong><p>{g.what}</p></div><div><strong>Why it is valuable</strong><p>{g.value}</p></div><div><strong>Opportunity</strong><p>{g.opportunity}</p></div><div><strong>Challenge to review</strong><p>{g.challenge}</p></div><div><strong>What to do next</strong><p>{g.action}</p></div></article></template></div>
                </section>
                

                

                

                
                <section class="arch-section arch-workspace arch-workspace-map">
                    <div class="arch-section-head"><span>Object Map & Impact</span><span class="arch-section-hint">One-object architecture view · not Relationship Path Finder</span></div>
                    <p class="arch-domain-help">This is the dedicated one-object interface. It maps the selected object's parents and dependants, architectural role, structural reach and 1–3 hop change impact. Relationship Path Finder is a separate two-object route tool.</p>
                    <div class="arch-map-picker"><select class="arch-select" onchange={handleArchitectureMapObject}><template for:each={architectureObjectOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></div>
                    <template if:true={architectureHasObjectDetail}>
                        <div class="arch-domain-result-head"><span class="arch-brief-label">OBJECT ARCHITECTURE</span><h3>{architectureSelectedObject}</h3><p>{architectureObjectMapSummary}</p></div>
                        <div class="arch-object-map-stats">
                            <div><span>Role</span><strong>{architectureObjectDetail.role}</strong></div>
                            <div><span>Domain</span><strong>{architectureObjectMapDomain}</strong></div>
                            <div><span>Incoming</span><strong>{architectureObjectDetail.incoming}</strong></div>
                            <div><span>Outgoing</span><strong>{architectureObjectDetail.outgoing}</strong></div>
                            <div><span>Fields</span><strong>{architectureObjectDetail.fieldCount}</strong></div>
                            <div><span>3 hop reach</span><strong>{architectureObjectDetail.reachableWithin3}</strong></div>
                        </div>
                        <div class="arch-object-map">
                            <div class="arch-object-map-column"><h4>Parents / Targets</h4><template for:each={architectureObjectParentGraphNodes} for:item="n"><div class="arch-object-map-node arch-object-map-parent" key={n.key}><strong>{n.name}</strong><span>{n.role}</span></div></template><template if:false={architectureObjectParentGraphNodes.length}><div class="arch-object-map-empty">No parent relationships</div></template></div>
                            <div class="arch-object-map-centre"><span>SELECTED OBJECT</span><strong>{architectureSelectedObject}</strong><small>{architectureObjectDetail.role}</small></div>
                            <div class="arch-object-map-column"><h4>Children / Dependants</h4><template for:each={architectureObjectChildGraphNodes} for:item="n"><div class="arch-object-map-node arch-object-map-child" key={n.key}><strong>{n.name}</strong><span>{n.role}</span></div></template><template if:false={architectureObjectChildGraphNodes.length}><div class="arch-object-map-empty">No child relationships</div></template></div>
                        </div>
                        <div class="arch-object-observation"><strong>Architecture observation</strong><p>{architectureObjectMapObservation}</p></div>
                        <div class="arch-object-impact-inline">
                            <div class="arch-section-head"><span>Change Impact</span><span class="arch-section-hint">Structural blast radius for this object</span></div>
                            <p>{architectureImpactSummary}</p>
                            <div class="arch-guide-grid"><template for:each={architectureBlastLevels} for:item="level"><article class="arch-guide-card" key={level.key}><h3>{level.depth} hop impact · {level.count} objects</h3><div><strong>Objects in scope</strong><p>{level.objectText}</p></div><div><strong>How to interpret this</strong><p>{level.meaning}</p></div></article></template></div>
                        </div>
                        <div class="arch-object-reach"><h4>Structural reach</h4><template for:each={architectureObjectReach} for:item="r"><div key={r.depth}><strong>{r.depth} hop</strong><span>{r.count} objects</span><p>{r.names}</p></div></template></div>
                    </template>
                    <template if:false={architectureHasObjectDetail}><div class="arch-empty arch-empty-small">Select an object above to build its architecture map from the current ER model.</div></template>
                </section>
                <section class="arch-section arch-workspace arch-workspace-usage">
                    <div class="arch-section-head"><span>Object Usage & Change Readiness</span><span class="arch-section-hint">Diagram + cached Salesforce schema evidence · no Tooling API</span></div>
                    <div class="arch-usage-scope"><strong>What this can prove</strong><p>It combines relationships in the ER model with Salesforce schema reference fields discovered across the org. The org schema scan is loaded once when Architecture Intelligence opens and cached for the active diagram, so selecting different objects does not repeatedly scan Salesforce metadata.</p></div>
                    <div class="arch-map-picker"><select class="arch-select" onchange={handleArchitectureUsageObject}><template for:each={architectureObjectOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></div>
                    <template if:true={architectureHasUsageDetail}>
                        <div class="arch-usage-head"><div><span class="arch-brief-label">CHANGE READINESS</span><h3>{architectureUsageDetail.name}</h3><p>{architectureUsageDetail.type}</p></div><span class="arch-usage-status">{architectureUsageDetail.status}</span></div>
                        <div class="arch-object-map-stats">
                            <div><span>Modelled relationships</span><strong>{architectureUsageDetail.degree}</strong></div>
                            <div><span>Objects depending on it</span><strong>{architectureUsageDetail.incoming}</strong></div>
                            <div><span>Objects it depends on</span><strong>{architectureUsageDetail.outgoing}</strong></div>
                            <div><span>Fields in model</span><strong>{architectureUsageDetail.fieldCount}</strong></div>
                            <div><span>3 hop exposure</span><strong>{architectureUsageDetail.reach}</strong></div>
                            <div><span>Junction signal</span><strong>{architectureUsageDetail.junctionText}</strong></div>
                        </div>
                        <div class="arch-usage-scroll-frame"><div class="arch-usage-diagram arch-usage-diagram-simple">
                            <div class="arch-usage-centre"><span>SELECTED OBJECT</span><strong>{architectureUsageDetail.name}</strong><small>{architectureUsageDetail.type}</small></div>
                            <div class="arch-usage-all-dependencies">
                                <div class="arch-usage-side"><h4>Depends on</h4><p class="arch-usage-direction-help">Objects referenced by {architectureUsageDetail.name}</p><template if:true={architectureUsageDetail.hasOutbound}><template for:each={architectureUsageDetail.outbound} for:item="x"><div class="arch-usage-node arch-usage-group-node" key={x.key}><strong>{x.name}</strong><span>{x.relationshipLabel}</span><div class="arch-usage-field-list"><template for:each={x.relationships} for:item="r"><div class="arch-usage-field-row" key={r.key}><b>{r.field}</b><span>{r.kind}</span></div></template></div></div></template></template><template if:false={architectureUsageDetail.hasOutbound}><div class="arch-object-map-empty">None represented in this diagram</div></template></div>
                                <div class="arch-usage-side"><h4>Depended on by</h4><p class="arch-usage-direction-help">Objects that reference {architectureUsageDetail.name}</p><template if:true={architectureUsageDetail.hasInbound}><template for:each={architectureUsageDetail.inbound} for:item="x"><div class="arch-usage-node arch-usage-group-node" key={x.key}><strong>{x.name}</strong><span>{x.relationshipLabel}</span><div class="arch-usage-field-list"><template for:each={x.relationships} for:item="r"><div class="arch-usage-field-row" key={r.key}><b>{r.field}</b><span>{r.kind}</span></div></template></div></div></template></template><template if:false={architectureUsageDetail.hasInbound}><div class="arch-object-map-empty">None represented in this diagram</div></template></div>
                            </div>
                        </div></div>
                        <div class="arch-usage-assessment"><strong>Architecture assessment</strong><p>{architectureUsageDetail.observation}</p></div>
                        <div class="arch-usage-unknown">
                            <strong>Referenced objects outside the declared diagram</strong>
                            <template if:true={architectureUsageDetail.hasOutsideDiagram}>
                                <p>The DSL explicitly references the following relationship targets, but they are not declared as entities in this diagram:</p>
                                <div class="arch-usage-external-list"><template for:each={architectureUsageDetail.outsideDiagram} for:item="x"><div class="arch-usage-node" key={x.key}><strong>{x.name}</strong><span>{x.kind}</span><small>{x.field}</small></div></template></div>
                            </template>
                            <template if:false={architectureUsageDetail.hasOutsideDiagram}><p>None explicitly referenced by this object's modelled relationships.</p></template>
                            <p>Other Salesforce metadata, automation, Apex, reports and integrations remain unknown because Architecture Intelligence does not query the org.</p>
                        </div>
                        <div class="arch-usage-unknown">
                            <strong>Org schema references beyond this ER diagram</strong>
                            <p>Reference fields discovered in Salesforce schema metadata where either end of the relationship is outside the current ER model. Each row shows the exact referencing field.</p>
                            <template if:true={architectureOrgReferencesLoading}><p>Loading org schema relationship index…</p></template>
                            <template if:true={architectureOrgReferencesError}><p>{architectureOrgReferencesError}</p></template>
                            <template if:true={architectureHasUsageOutsideOrgReferences}>
                                <div class="arch-usage-scroll-frame arch-usage-org-scroll">
                                    <div class="arch-usage-org-diagram arch-usage-org-flow">
                                        <div class="arch-usage-centre arch-usage-org-root"><span>SELECTED OBJECT</span><strong>{architectureUsageOrgDiagram.selected}</strong><small>Salesforce schema index</small></div>
                                        <div class="arch-usage-org-dependencies">
                                            <h4>Connected objects outside this ER</h4>
                                            <p class="arch-usage-direction-help">Each object appears once. All reference fields between it and {architectureUsageOrgDiagram.selected} are grouped inside the same box.</p>
                                            <template if:true={architectureUsageOrgDiagram.hasDependencies}>
                                                <template for:each={architectureUsageOrgDiagram.dependencies} for:item="x">
                                                    <div class="arch-usage-node arch-usage-group-node" key={x.key}>
                                                        <strong>{x.name}</strong><span>{x.relationshipLabel}</span>
                                                        <div class="arch-usage-field-list"><template for:each={x.relationships} for:item="r"><div class="arch-usage-field-row" key={r.key}><b>{r.field}</b><span>{r.kind}</span><small>{r.category} · {r.direction}</small></div></template></div>
                                                    </div>
                                                </template>
                                            </template>
                                            <template if:false={architectureUsageOrgDiagram.hasDependencies}><div class="arch-object-map-empty">No outside schema references discovered</div></template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template if:false={architectureHasUsageOutsideOrgReferences}><template if:false={architectureOrgReferencesLoading}><p>No additional Salesforce schema relationship references were found outside the current ER model for this object.</p></template></template>
                        </div>
                        <div class="arch-usage-evidence">{architectureUsageEvidenceNote}</div>
                    </template>
                    <template if:false={architectureHasUsageDetail}><div class="arch-empty arch-empty-small">Select an object to inspect its modelled usage and change exposure.</div></template>
                </section>
                <section class="arch-section arch-workspace arch-workspace-paths">
                    <div class="arch-section-head"><span>Relationship Path Finder</span><span class="arch-section-hint">Two-object route analysis · separate from Object Map</span></div>
                    <div class="arch-path-controls"><select class="arch-select" onchange={handleArchitecturePathSource}><template for:each={architectureObjectOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select><span>→</span><select class="arch-select" onchange={handleArchitecturePathTarget}><template for:each={architectureObjectOptions} for:item="o"><option key={o.value} value={o.value}>{o.label}</option></template></select></div>
