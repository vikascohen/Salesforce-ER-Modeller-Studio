<template><section class="health-shell"><header><div><span class="kicker">OBJECT ARCHITECTURE HEALTH</span><h3>{objectApiName}</h3><p>{summary}</p></div><div class="health-counters"><strong>{findingCount}</strong><span>findings</span><b>{attentionCount} attention · {reviewCount} review</b></div></header><div class="health-map"><div><strong>Fields</strong><span>{businessFields.length}</span></div><i>→</i><div><strong>Relationships</strong><span>{relationshipCount}</span></div><i>→</i><div><strong>Derived logic</strong><span>{derivedCount}</span></div><i>→</i><div><strong>Architecture review</strong><span>{findingCount} signals</span></div></div><div class="health-scroll"><template if:true={hasFindings}><template for:each={findings} for:item="item"><article key={item.key} class={item.css}><div class="finding-head"><span>{item.severity}</span><strong>{item.title}</strong></div><div class="finding-grid"><div><b>Evidence</b><p>{item.evidence}</p></div><div><b>Recommendation</b><p>{item.recommendation}</p></div></div></article></template></template><template if:false={hasFindings}><div class="health-empty">No architecture-health findings were generated for this object.</div></template></div><footer>Architecture Health findings are review signals. They do not assert that metadata is unnecessary or safe to delete.</footer></section></template>
