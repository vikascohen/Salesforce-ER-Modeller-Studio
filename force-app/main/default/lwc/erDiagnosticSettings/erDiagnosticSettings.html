<template>
    <section class="diagnostic-config">
        <h3>Error Log Configuration</h3>
        <p>Diagnostics are buffered in memory. Optionally store events in an existing Salesforce object. For detailed history, use View → Error Log.</p>
        <label class="toggle"><input type="checkbox" checked={config.enabled} data-name="enabled" onchange={update}/> Store diagnostic events in a Salesforce object</label>
        <template if:true={enabled}>
            <div class="field">
                <span class="structure-label">Logging structure</span>
                <div class="structure-options" role="group" aria-label="Logging structure">
                    <button type="button" class={simpleOptionClass} data-provider="simple" onclick={chooseProvider} aria-pressed={simpleSelected}>
                        <span class="structure-option-title">Simple Salesforce Object</span>
                        <span class="structure-option-description">Save each event directly into one Salesforce object.</span>
                    </button>
                    <button type="button" class={customOptionClass} data-provider="custom" onclick={chooseProvider} aria-pressed={customSelected}>
                        <span class="structure-option-title">Custom Logging Structure</span>
                        <span class="structure-option-description">Create a parent log and linked child entries.</span>
                    </button>
                </div>
            </div>
            <template if:true={isCustom}>
                <p>Creates a parent log record and links each diagnostic entry to it. Historical reads query the child entry object, use the configured child relationship field to identify the parent record, and order by CreatedDate. The object and relationship are validated against Salesforce metadata before saving or querying.</p>
                <div class="field"><label for="parentObjectApi">Parent log object API name</label><input id="parentObjectApi" data-name="parentObjectApi" value={config.parentObjectApi} onchange={update} onblur={validate}/><small role="status">{parentNotice}</small></div>
                <div class="field"><label for="parentLookupField">Child field referencing parent (lookup/master-detail API name)</label><input id="parentLookupField" data-name="parentLookupField" value={config.parentLookupField} onchange={update} onblur={validate}/><small role="status">{relationshipNotice}</small></div>
                <h3>Parent required fields</h3>
                <p>Map mandatory parent fields that have no Salesforce default. Leave empty when the parent object has no such fields.</p>
                <template for:each={parentFields} for:item="f">
                    <div class="mapping" key={f.index}>
                        <div class="field"><label>Parent field API name</label><input data-index={f.index} data-name="field" value={f.field} onchange={updateParentField}/></div>
                        <div class="field"><label>Default value</label><input data-index={f.index} data-name="value" value={f.value} onchange={updateParentField}/></div>
                        <button class="config-button config-button-remove" data-index={f.index} onclick={removeParentField}>Remove</button>
                    </div>
                </template>
                <button class="config-button config-button-secondary" onclick={addParentField}>Add parent field</button>
            </template>
            <div class="field"><label for="objectApi">{childObjectLabel}</label><input id="objectApi" value={config.objectApi} data-name="objectApi" onchange={update} onblur={validate} placeholder="namespace__Log__c"/><small role="status">{objectNotice}</small></div>
            <div class="field"><label for="messageField">Message field API name</label><input id="messageField" value={config.messageField} data-name="messageField" onchange={update} onblur={validate} placeholder="Message__c"/><small role="status">{messageNotice}</small></div>
            <p>Salesforce metadata determines the field's actual maximum size. Longer messages are truncated when stored; the full message remains in the session buffer.</p>
            <label class="toggle"><input type="checkbox" checked={config.severityEnabled} data-name="severityEnabled" onchange={update}/> Populate a severity field</label>
            <template if:true={severityEnabled}>
                <div class="field"><label for="severityField">Severity field API name</label><input id="severityField" value={config.severityField} data-name="severityField" onchange={update} onblur={validate}/><small role="status">{severityNotice}</small></div>
                <div class="field"><label for="errorValue">Exact value for errors</label><input id="errorValue" value={config.errorValue} data-name="errorValue" onchange={update}/></div>
                <div class="field"><label for="warningValue">Exact value for warnings</label><input id="warningValue" value={config.warningValue} data-name="warningValue" onchange={update}/></div>
            </template>
            <h3>Additional required field values</h3>
            <p>Add any mandatory fields and their default values. Salesforce validates field types and restricted picklists before saving.</p>
            <template for:each={fields} for:item="f">
                <div class="mapping" key={f.index}>
                    <div class="field"><label>Field API name</label><input data-index={f.index} data-name="field" value={f.field} onchange={updateRequired} onblur={validateRequired}/></div>
                    <div class="field"><label>Default value</label><input data-index={f.index} data-name="value" value={f.value} onchange={updateRequired}/></div>
                    <button class="config-button config-button-remove" data-index={f.index} onclick={removeField} title="Remove mapping">Remove</button><small role="status">{f.notice}</small>
                </div>
            </template>
            <button class="config-button config-button-secondary" onclick={addField}>Add required field</button>
        </template>
        <div class="actions"><button class="config-button config-button-primary" disabled={disabledSave} onclick={saveConfig}>Save Configuration</button><span role="status">{feedback}</span></div>
    </section>
</template>
