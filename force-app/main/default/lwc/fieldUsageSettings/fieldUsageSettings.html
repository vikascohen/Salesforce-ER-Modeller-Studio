<template>
    <section class="console">
        <header class="head"><div><span>FIELD USAGE INTELLIGENCE</span><h2>Scanner Operations</h2><p>One place for snapshot health, live scan state, scanner coverage and Salesforce schedules.</p></div><div class="actions"><button onclick={refresh} disabled={busy}>Refresh</button><button class="primary" onclick={handleRunNow} disabled={scanRunning}>Run Scan Now</button></div></header>
        <template if:true={message}><div class="message">{message}</div></template>
        <div class="metrics"><article><span>Health</span><strong>{healthState}</strong></article><article><span>Snapshot</span><strong>{snapshotState}</strong><small>{lastCompleted}</small></article><article><span>Dependencies</span><strong>{dependencyCount}</strong></article><article><span>Errors</span><strong>{errorCount}</strong></article></div>
        <section class="panel"><div class="panelHead"><div><h3>Live Scan Pipeline</h3><p>{phase}</p></div><strong>{progress}%</strong></div><div class="progress"><i style={progressStyle}></i></div><c-field-usage-scanner-coverage></c-field-usage-scanner-coverage></section>
        <section class="panel"><div class="panelHead"><div><h3>Scanner Coverage</h3><p>Capabilities reported by the installed scanner engine.</p></div></div><div class="coverage"><template for:each={coverageRows} for:item="row"><div key={row.key}><strong>{row.name}</strong><span>{row.status}</span></div></template></div></section>
        <section class="panel"><div class="panelHead"><div><h3>Scheduled Jobs</h3><p>Salesforce scheduler state for ER Modeller Studio Field Usage scans.</p></div></div><template if:true={hasJobs}><div class="jobs"><div class="job header"><span>Schedule</span><span>Status</span><span>Previous</span><span>Next</span></div><template for:each={jobsView} for:item="job"><div class="job" key={job.key}><span><strong>{job.scheduleName}</strong><small>{job.jobName}</small></span><span>{job.state}</span><span>{job.previous}</span><span>{job.next}</span></div></template></div></template><template if:false={hasJobs}><div class="empty">No Field Usage scheduled jobs.</div></template></section>
    </section>
</template>
