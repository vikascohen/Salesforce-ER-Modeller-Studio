<template>
<section class="console">
<header class="head"><div><span>FIELD USAGE INTELLIGENCE</span><h2>Operational Console</h2><p>Live scan progress, errors, schedules, Salesforce jobs, history and scanner coverage in one place.</p></div><div class="actions"><button class="primary" onclick={handleRunNow} disabled={scanRunning}>Run Scan Now</button></div></header>
<template if:true={message}><div class="message" role="status">{message}</div></template>
<div class="metrics"><article><span>Health</span><strong>{healthState}</strong></article><article><span>Snapshot</span><strong>{snapshotState}</strong><small>{lastCompleted}</small></article><article><span>Dependencies</span><strong>{dependencyCount}</strong></article><article><span>Errors</span><strong>{errorCount}</strong><small>Batch errors: {jobErrors}</small></article></div>
<section class="panel livePanel"><div class="panelHead"><div><h3>Live Scan Pipeline</h3><p>{phase}</p></div><strong class="progressPercent">{progress}%</strong></div><div class="progress"><i style={progressStyle}></i></div><div class="liveStats"><div><span>Current batch</span><strong>{jobProcessed} / {jobTotal}</strong></div><div><span>Batch status</span><strong>{jobStatus}</strong></div><div><span>Objects</span><strong>{objectsProcessed} / {objectsTotal}</strong></div><div><span>Batch errors</span><strong>{jobErrors}</strong></div></div><template if:true={hasProgressLog}><div class="activity"><span>LATEST ACTIVITY / ERRORS</span><pre>{progressLog}</pre></div></template><c-field-usage-scanner-coverage coverage={coverageRows}></c-field-usage-scanner-coverage></section>
<section class="panel scanHistoryPanel"><div class="panelHead"><div><h3>Last 10 Scans</h3><p>Click a failed or Completed With Errors status to inspect the persisted diagnostic detail.</p></div></div><template if:true={hasHistory}><div class="historyScroll" tabindex="0"><div class="history historyWide"><div class="historyRow header"><span>#</span><span>Status</span><span>Started</span><span>Completed</span><span>Dependencies</span><span>Errors</span><span>Last phase</span></div><template for:each={historyView} for:item="row"><div class="historyEntry" key={row.key}><div class="historyRow"><span>{row.number}</span><span><template if:true={row.hasError}><button class="historyStatusError" data-id={row.id} onclick={handleHistoryToggle}>{row.status}</button></template><template if:false={row.hasError}><strong>{row.status}</strong></template></span><span>{row.started}</span><span>{row.completed}</span><span>{row.dependencies}</span><span>{row.errors}</span><span>{row.phase}</span></div><template if:true={row.isExpanded}><div class="historyErrorDetail"><div class="errorDetailHead"><strong>SCAN ERROR DETAIL</strong><button class="historyErrorButton" data-id={row.id} onclick={handleHistoryToggle}>Close</button></div><pre>{row.errorDetail}</pre></div></template></div></template></div></div></template><template if:false={hasHistory}><div class="empty">No Field Usage scan history yet.</div></template></section>
<section class="panel"><div class="panelHead"><div><h3>Automatic Scans</h3><p>Configure only the schedules your organisation needs.</p></div><button onclick={handleAddSchedule} disabled={busy}>+ Add Schedule</button></div><template if:true={hasSchedules}><div class="schedules"><template for:each={schedules} for:item="row"><div class="schedule" key={row._key}><label class="enabled"><input type="checkbox" checked={row.Enabled__c} data-key={row._key} onchange={handleEnabled}/> Enabled</label><label><span>Name</span><input value={row.Name} data-key={row._key} oninput={handleName}/></label><label><span>Hour</span><input type="number" min="0" max="23" value={row.Hour__c} data-key={row._key} onchange={handleHour}/></label><label><span>Minute</span><input type="number" min="0" max="59" value={row.Minute__c} data-key={row._key} onchange={handleMinute}/></label><button class="danger" data-key={row._key} onclick={handleDeleteSchedule}>Delete</button></div></template></div></template><template if:false={hasSchedules}><div class="empty">No automatic scans configured.</div></template><div class="save"><button class="primary" onclick={handleSaveSchedules} disabled={busy}>Save Schedules</button></div></section>
<section class="panel"><div class="panelHead"><div><h3>Scheduled Jobs</h3><p>Runtime state for Studio-owned Salesforce scheduled jobs.</p></div></div><template if:true={hasJobs}><div class="jobs"><div class="job header"><span>Schedule</span><span>Time</span><span>Status</span><span>Previous</span><span>Next</span><span>Actions</span></div><template for:each={jobsView} for:item="job"><div class="job" key={job.key}><span><strong>{job.scheduleName}</strong><small>{job.jobName}</small></span><span>{job.time}</span><span>{job.state}</span><span>{job.previous}</span><span>{job.next}</span><span class="jobActions"><template if:true={job.canPause}><button data-id={job.scheduleId} onclick={handlePause}>Pause</button></template><template if:true={job.canResume}><button data-id={job.scheduleId} onclick={handleResume}>Resume</button></template><button class="danger" data-id={job.scheduleId} onclick={handleDeleteJob}>Delete</button></span></div></template></div></template><template if:false={hasJobs}><div class="empty">No Field Usage scheduled jobs.</div></template></section>
</section>
</template>
