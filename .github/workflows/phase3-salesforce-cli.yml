name: Phase 3 Salesforce CLI Validation

on:
  push:
    branches:
      - version-3-field-usage-intelligence
  pull_request:
    branches:
      - version-3-field-usage-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Metadata and Apex
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Verify Salesforce CLI
        run: sf version

      - name: Authenticate CI org
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SFDX_AUTH_URL is not configured."
            exit 1
          fi
          printf '%s' "$SFDX_AUTH_URL" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --alias phase3-ci --set-default
          rm -f /tmp/sfdx-auth-url.txt

      - name: Compile and deploy source to disposable CI org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org phase3-ci \
            --test-level NoTestRun \
            --wait 40

      - name: Run Phase 3 Apex tests with coverage
        run: |
          sf apex run test \
            --target-org phase3-ci \
            --tests FieldUsageApexScannerTest \
            --tests FieldUsageControllerTest \
            --tests FieldUsageFlowScannerTest \
            --tests FieldUsageFormulaScannerTest \
            --tests FieldUsageOrchestratorTest \
            --tests FieldUsageScheduleServiceTest \
            --tests FieldUsageSnapshotFinalizerTest \
            --tests FieldUsageToolingApiClientTest \
            --tests FieldUsageWorkUnitBatchTest \
            --code-coverage \
            --result-format human \
            --wait 30
