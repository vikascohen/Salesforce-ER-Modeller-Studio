name: Deploy to Salesforce

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Salesforce
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout architecture refactor branch
        uses: actions/checkout@v4
        with:
          ref: architecture-intelligence-refactor

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate Salesforce org
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SFDX_AUTH_URL is not configured."
            exit 1
          fi
          printf '%s' "$SFDX_AUTH_URL" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --alias deploy-org --set-default
          rm -f /tmp/sfdx-auth-url.txt

      - name: Deploy architecture refactor branch
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org deploy-org \
            --test-level NoTestRun \
            --wait 40
