name: Phase 3 Salesforce CLI Validation

on:
  workflow_dispatch:
  push:
    branches:
      - v3-beta-testing
    paths:
      - 'force-app/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sfdx-project.json'
      - '.github/workflows/phase3-salesforce-validation.yml'

permissions:
  contents: read

concurrency:
  group: phase3-salesforce-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Salesforce Validation + Jest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli
      - name: Verify Salesforce auth secret exists
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Repository secret SFDX_AUTH_URL is missing or empty."
            exit 1
          fi
      - name: Authenticate Developer Edition
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          printf '%s' "$SFDX_AUTH_URL" > /tmp/sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdx-auth-url.txt --alias phase3-validation --set-default
          rm -f /tmp/sfdx-auth-url.txt
          sf org display --target-org phase3-validation
      - name: Validate metadata with ER Modeller Apex tests only
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org phase3-validation \
            --test-level RunSpecifiedTests \
            --tests DiagramFileControllerTest \
            --tests DiagramPreferenceControllerTest \
            --tests SchemaMetadataControllerTest \
            --tests FieldUsageApexScannerTest \
            --tests FieldUsageControllerTest \
            --tests FieldUsageDiscoveryBatchTest \
            --tests FieldUsageFlowScannerTest \
            --tests FieldUsageFormulaScannerTest \
            --tests FieldUsageLayoutScannerTest \
            --tests FieldUsageOrchestratorTest \
            --tests FieldUsageScheduleServiceTest \
            --tests FieldUsageSnapshotFinalizerTest \
            --tests FieldUsageToolingApiClientTest \
            --tests FieldUsageCredentialDiagTest \
            --tests FieldUsageToolingDiscoveryBatchTest \
            --tests FieldUsageUiScannerTest \
            --tests FieldUsageUiToolingClientTest \
            --tests FieldUsageWorkUnitBatchTest \
            --tests FieldUsageErrorControllerTest \
            --tests DataDictionaryFieldDetailControllerTest \
            --tests ObjectIntelligenceControllerTest \
            --tests StudioDiagnosticsControllerTest \
            --wait 25
      - name: Run all LWC Jest tests
        run: npm run test:unit -- -- --runInBand
