name: Jest Tests

on:
  push:
    branches:
      - version-2-stable
      - version-3-field-usage-intelligence
  pull_request:
    branches:
      - version-2-stable
      - version-3-field-usage-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lwc-jest:
    name: LWC Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all LWC Jest tests
        run: npm run test:unit -- --runInBand
